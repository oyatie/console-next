tags:
- onboarding
operationId: readTerms
summary: Read the exact current service terms and required privacy notice, including before passkey enrollment
security:
- bearerAuth: []
responses:
  '200':
    description: Exact published text, version and hash.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/TermsDocument'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '409':
    description: terms_not_published; ask the service operator for approved terms.
