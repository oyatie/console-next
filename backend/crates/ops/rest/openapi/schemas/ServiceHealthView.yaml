type: "object"
required: ["evaluated_at", "internal_slos", "page_load_error_rate_5m", "page_loads_rate_5m", "evidence_truth", "textfiles", "public_status"]
properties:
  evaluated_at: {"$ref": "#/components/schemas/Timestamp"}
  internal_slos:
    type: "array"
    items:
      type: "object"
      required: ["key", "remaining_percent", "burn_30m", "burn_1h", "burn_6h", "burn_3d", "burn_30d", "exhaustion_s", "requests_30d", "low_sample"]
      properties:
        key: {"$ref": "#/components/schemas/Text"}
        remaining_percent: {"$ref": "#/components/schemas/ObservedNumber"}
        burn_30m: {"$ref": "#/components/schemas/ObservedNumber"}
        burn_1h: {"$ref": "#/components/schemas/ObservedNumber"}
        burn_6h: {"$ref": "#/components/schemas/ObservedNumber"}
        burn_3d: {"$ref": "#/components/schemas/ObservedNumber"}
        burn_30d: {"$ref": "#/components/schemas/ObservedNumber"}
        exhaustion_s: {"$ref": "#/components/schemas/ObservedNumber"}
        requests_30d: {"$ref": "#/components/schemas/ObservedNumber"}
        low_sample: {"type": "boolean"}
        low_sample_note: {"anyOf": [{"type": "string"}, {"type": "null"}]}
  page_load_error_rate_5m: {"$ref": "#/components/schemas/ObservedNumber"}
  page_loads_rate_5m: {"$ref": "#/components/schemas/ObservedNumber"}
  evidence_truth:
    type: "array"
    items:
      type: "object"
      required: ["source", "ok"]
      properties:
        source: {"$ref": "#/components/schemas/Text"}
        ok: {"$ref": "#/components/schemas/ObservedBoolean"}
  textfiles:
    type: "array"
    items:
      type: "object"
      required: ["file", "age_s", "max_age_s"]
      properties:
        file: {"$ref": "#/components/schemas/Text"}
        age_s: {"$ref": "#/components/schemas/ObservedNumber"}
        max_age_s: {"$ref": "#/components/schemas/ObservedNumber"}
  public_status:
    type: "object"
    required: ["feed_ok", "revision", "published_at", "observed_at", "expires_at", "unknown_components", "components"]
    properties:
      feed_ok: {"$ref": "#/components/schemas/ObservedBoolean"}
      revision: {"$ref": "#/components/schemas/ObservedCount"}
      published_at: {"$ref": "#/components/schemas/ObservedTimestamp"}
      observed_at: {"$ref": "#/components/schemas/ObservedTimestamp"}
      expires_at: {"$ref": "#/components/schemas/ObservedTimestamp"}
      unknown_components: {"$ref": "#/components/schemas/ObservedCount"}
      components:
        type: "object"
        additionalProperties:
          allOf: [{"$ref": "#/components/schemas/Observation"}, {"properties": {"value": {"anyOf": [{"$ref": "#/components/schemas/PublicComponent"}, {"type": "null"}]}}}]
