  signer: {"anyOf": [{"type": "string"}, {"type": "null"}]}
  signed_on: {"anyOf": [{"type": "string", "format": "date", "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"}, {"type": "null"}]}
  deadline: {"$ref": "#/components/schemas/Text"}
