type: object
required: [framework_id, control_key, title, objective, control_type]
properties:
  framework_id: { $ref: '#/components/schemas/Uuid' }
  control_key: { type: string }
  title: { type: string }
  objective: { type: string }
  control_type: { $ref: '#/components/schemas/ControlType' }
  cadence: { type: [string, 'null'], enum: [CONTINUOUS, DAILY, WEEKLY, MONTHLY, QUARTERLY, ANNUAL, EVENT_DRIVEN, null] }
  evidence_requirements:
    type: object
    additionalProperties: true
    description: Released SDKs declare this legacy property as an object. Historically the server accepts JSON arrays here and rejects objects. Use evidence_requirement_items for new writes.
  evidence_requirement_items:
    type: array
    items: {}
    description: Ordered evidence requirements. Omit both fields for an empty array. When both fields are sent their arrays must match.
  owner_user_id: { type: [string, 'null'], format: uuid }
