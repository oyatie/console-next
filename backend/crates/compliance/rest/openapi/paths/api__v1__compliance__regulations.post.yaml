tags: [Compliance]
operationId: createComplianceRegulation
summary: Create an audited regulation impact
security: [{ bearerAuth: [] }]
parameters:
- name: Idempotency-Key
  in: header
  required: false
  description: Reuse this key for a retry of the same catalog command.
  schema: { type: string }
requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateRegulationImpactRequest' } } } }
responses:
  '200': { description: Created regulation impact., content: { application/json: { schema: { $ref: '#/components/schemas/RegulationImpact' } } } }
  '401': { $ref: '#/components/responses/Unauthorized' }
  '403': { $ref: '#/components/responses/Forbidden' }
  '409': { description: A previous command with this key was already applied or is processing., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' } } } }
  '422': { $ref: '#/components/responses/ValidationError' }
  '500': { $ref: '#/components/responses/InternalServerError' }
  '503': { $ref: '#/components/responses/ServiceUnavailable' }
