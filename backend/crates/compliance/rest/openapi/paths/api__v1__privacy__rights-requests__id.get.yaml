# SPDX-License-Identifier: LicenseRef-Proprietary
tags: [Compliance]
operationId: readPrivacyRightsIntake
summary: Read a tenant receipt under the live privacy_request_intake_read Cedar scope
security: [{ bearerAuth: [] }]
parameters:
- { name: id, in: path, required: true, schema: { type: string, format: uuid } }
responses:
  '200':
    description: Tenant receipt and requester name. Account-data requests are never returned.
    content:
      application/json:
        schema:
          type: object
          required: [request, subject_name, as_of]
          properties:
            request: { $ref: '#/components/schemas/PrivacyRightsReceipt' }
            subject_name: { type: string }
            as_of: { type: string, format: date }
  '401': { $ref: '#/components/responses/Unauthorized' }
  '404': { $ref: '#/components/responses/NotFound' }
  '503': { $ref: '#/components/responses/ServiceUnavailable' }
