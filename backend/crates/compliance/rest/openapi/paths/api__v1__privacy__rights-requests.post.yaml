# SPDX-License-Identifier: LicenseRef-Proprietary
tags: [Compliance]
operationId: filePrivacyRightsRequest
summary: File a self-service request with register-backed per-kind deadlines
security: [{ bearerAuth: [] }]
description: >
  The server supplies the subject and receipt date. Idempotency-Key replays the
  original receipt; changed payloads conflict. A fresh PRIVACY_REQUEST passkey envelope is bound to the actor UUID and the SHA-256 of the serialized filing (controller, kinds, detail in that order).
  Refusals include passkey_step_up_required, passkey_step_up_failed, no_employee_record,
  request_kind_required, request_kind_unavailable and detail_too_long. Unregistered
  automated-decision and transmission kinds are unavailable. Missing statutory
  rules leave the per-kind deadline unknown; HOLD rule dispositions remain visible.
parameters:
- { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 200 } }
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        additionalProperties: false
        required: [controller, kinds, step_up]
        properties:
          controller: { type: string, enum: [TENANT, OPERATOR] }
          kinds: { type: array, minItems: 1, items: { type: string, enum: [ACCESS, CORRECTION, DELETION, SUSPENSION, WITHDRAWAL] } }
          detail: { type: string, maxLength: 2000, default: '' }
          step_up: { $ref: '#/components/schemas/MobilePasskeyStepUpEnvelope' }
responses:
  '200': { description: Filed receipt or exact idempotent replay., content: { application/json: { schema: { $ref: '#/components/schemas/PrivacyRightsReceipt' } } } }
  '401': { $ref: '#/components/responses/Unauthorized' }
  '403': { $ref: '#/components/responses/Forbidden' }
  '409': { $ref: '#/components/responses/Conflict' }
  '422': { $ref: '#/components/responses/ValidationError' }
  '503': { $ref: '#/components/responses/ServiceUnavailable' }
