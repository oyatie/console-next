[package]
name = "console-platform-provisioning"
version = "0.1.0"
description = "Bulk roster provisioning and passkey cold-start bootstrap credentials."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aws-lc-rs = { workspace = true }
base64 = { workspace = true }
console-settings-domain = { path = "../../settings/domain" }
console-kernel-core = { workspace = true }
console-platform-authz = { workspace = true }
console-platform-auth = { path = "../auth" }
console-platform-crypto = { path = "../crypto" }
console-platform-db = { path = "../db" }
console-platform-email = { path = "../email" }
console-platform-storage = { path = "../storage" }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
console-platform-test-support = { workspace = true }
tokio = { workspace = true, features = ["macros", "sync", "time"] }
url = "2.5.8"
webauthn-authenticator-rs = { workspace = true, features = ["softpasskey"] }

[lints]
workspace = true
