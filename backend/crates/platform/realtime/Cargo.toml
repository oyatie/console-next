[package]
name = "console-platform-realtime"
version = "0.1.0"
description = "WebSocket realtime hub and Postgres LISTEN/NOTIFY bridge."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = { workspace = true, features = ["ws"] }
console-kernel-core = { workspace = true }
console-messenger-application = { workspace = true }
console-messenger-adapter-postgres = { workspace = true }
console-notifications-application = { workspace = true }
console-notifications-adapter-postgres = { workspace = true }
console-notifications-domain = { workspace = true }
console-platform-auth = { workspace = true }
console-platform-authz = { workspace = true }
console-platform-db = { workspace = true }
console-platform-request-context = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
console-platform-test-support = { workspace = true }
console-messenger-domain = { workspace = true }
p256 = { workspace = true, features = ["ecdsa", "pkcs8", "pem"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
