tags: [evaluation]
operationId: createEvaluationCycle
summary: Create a draft evaluation cycle
security: [{ bearerAuth: [] }]
parameters:
- name: Idempotency-Key
  in: header
  required: false
  description: Reuse this key for the same create intent.
  schema: { type: string }
requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateEvaluationCycleRequest' } } } }
responses:
  '201': { description: Draft cycle created., content: { application/json: { schema: { $ref: '#/components/schemas/EvaluationCycleDetail' } } } }
  '401': { $ref: '#/components/responses/Unauthorized' }
  '403': { $ref: '#/components/responses/Forbidden' }
  '409': { description: A previous command with this key was already applied or is processing., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' } } } }
  '422': { $ref: '#/components/responses/ValidationError' }
  '500': { $ref: '#/components/responses/InternalServerError' }
  '503': { $ref: '#/components/responses/ServiceUnavailable' }
