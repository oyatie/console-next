tags: [audit]
operationId: lookupCommandOutcome
summary: Look up a command after a lost response
security: [{bearerAuth: []}]
parameters:
- in: query
  name: idempotency_key
  required: true
  schema: {type: string, minLength: 16, maxLength: 200}
responses:
  '200':
    description: Authorized, currently masked command outcome
    content:
      application/json:
        schema: {$ref: '#/components/schemas/CommandOutcome'}
  '401': {$ref: '#/components/responses/Unauthorized'}
  '404': {$ref: '#/components/responses/NotFound'}
  '422': {$ref: '#/components/responses/ValidationError'}
