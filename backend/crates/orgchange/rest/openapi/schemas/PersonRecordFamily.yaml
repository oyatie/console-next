type: object
additionalProperties: false
description: Family. Never a resident registration number; no dependant flag (payroll).
required: [relation, name]
properties:
  relation:
    type: string
    enum: [SPOUSE, CHILD, PARENT, PARENT_IN_LAW, SIBLING, GRANDPARENT, GRANDCHILD, OTHER]
  name:
    type: string
    maxLength: 50
  birth_date:
    type: [string, 'null']
    format: date
  cohabiting:
    type: [boolean, 'null']
