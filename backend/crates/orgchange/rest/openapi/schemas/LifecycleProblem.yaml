type: "object"
required:
  - "type"
  - "title"
  - "status"
  - "error"
properties:
  type:
    type: "string"
  title:
    type: "string"
  status:
    type: "integer"
  detail:
    type: "string"
  code:
    type: "string"
  error:
    type: object
    required: [code, message]
    properties:
      code:
        type: string
      message:
        type: string
