type: object
additionalProperties: false
description: Qualification and license. number is never a driver's license number (unique identifying information); a DRIVER_LICENSE entry has no number.
required: [name, kind]
properties:
  name:
    type: string
    maxLength: 100
  kind:
    type: string
    enum: [NATIONAL_TECHNICAL, NATIONAL_PROFESSIONAL, PRIVATE, DRIVER_LICENSE, FOREIGN, OTHER]
  grade:
    type: [string, 'null']
    maxLength: 50
  issuer:
    type: [string, 'null']
    maxLength: 100
  number:
    type: [string, 'null']
    maxLength: 50
  acquired_on:
    type: [string, 'null']
    format: date
  expires_on:
    type: [string, 'null']
    format: date
