type: object
required: [signed_by, signed_by_name, signed_at, total_rows, confirmed, needs_check, unchecked, note]
properties:
  signed_by:
    $ref: '#/components/schemas/Uuid'
  signed_by_name:
    type: [string, 'null']
  signed_at:
    type: string
    format: date-time
  total_rows:
    type: integer
  confirmed:
    type: integer
  needs_check:
    type: integer
  unchecked:
    type: integer
  note:
    type: [string, 'null']
