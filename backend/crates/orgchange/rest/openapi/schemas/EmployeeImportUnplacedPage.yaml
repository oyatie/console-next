type: object
required: [count, items]
properties:
  count:
    type: integer
    minimum: 0
  items:
    type: array
    items:
      type: object
      required: [employee_id, name, company, reason]
      properties:
        employee_id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        employee_number:
          type: [string, 'null']
        company:
          type: string
        legal_entity_id:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
        workplace_id:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
        org_unit_id:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
        source_org_unit:
          type: [string, 'null']
          description: The department text the import file named that bound nothing (source department).
        source_workplace:
          type: [string, 'null']
          description: The statutory workplace text the import file named that bound nothing, separate from the physical site.
        reason:
          type: string
          enum: [no_place, workplace_unknown, unit_unknown]
        position:
          type: [string, 'null']
          description: 'UX-R3 IMPORT (r3:hire-21): the facts placement is decided with, read with the
            person (title, employment type code, hire date YYYY-MM-DD, the work location and department texts on the record).'
        employment_type:
          type: [string, 'null']
        hire_date:
          type: [string, 'null']
        worksite_name:
          type: [string, 'null']
        org_unit:
          type: [string, 'null']
  next_cursor:
    type: [string, 'null']
