# SPDX-License-Identifier: LicenseRef-Proprietary
type: object
required: [protected_periods, notice_required, refusal_code, notice_pay]
properties:
  protected_periods:
    type: array
    items:
      $ref: '#/components/schemas/ProtectedExitPeriod'
  notice_required:
    type: boolean
  refusal_code:
    type: [string, 'null']
  notice_pay:
    oneOf:
    - $ref: '#/components/schemas/NoticePay'
    - type: 'null'
  protection_rules:
    type: array
    items:
      type: object
      required: [leave_type, rule]
      properties:
        leave_type:
          type: string
        rule:
          $ref: '#/components/schemas/LegalRule'
