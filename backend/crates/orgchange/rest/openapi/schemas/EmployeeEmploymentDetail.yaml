type: object
required: [employment_type, currency]
properties:
  employment_type:
    type: string
    enum: [REGULAR, CONTRACT, PART_TIME, INTERN]
  phone_e164:
    type: [string, 'null']
    description: Omitted for callers without employee_directory_manage (read-only directory access); null when
      not recorded (a profile an import created, MR-7).
  base_pay:
    description: Omitted for callers without employee_directory_manage (read-only directory access); null when
      not recorded (a profile an import created, MR-7).
    type: [string, 'null']
    minLength: 4
    maxLength: 15
    pattern: '^(0|[1-9][0-9]{0,11})\.[0-9]{2}$'
  currency:
    type: string
    enum: [KRW]
  contract_start_date:
    type: [string, 'null']
    format: date
    description: CONTRACT employment start (YYYY-MM-DD); null otherwise or when registered before contract dates were
      recorded.
  contract_end_date:
    type: [string, 'null']
    format: date
    description: Current CONTRACT end (YYYY-MM-DD), moved by CONTRACT_RENEWAL; null otherwise or when registered before
      contract dates were recorded.
