type: object
required: [employee_id, recorded]
properties:
  employee_id:
    $ref: '#/components/schemas/Uuid'
  recorded:
    type: boolean
  masked:
    type: [string, 'null']
    description: Policy-controlled display mask; fully masked by default.
    example: ••••••-•••••••
  source:
    type: [string, 'null']
    enum: [IMPORT, FORM, null]
  recorded_at:
    type: [string, 'null']
    format: date-time
