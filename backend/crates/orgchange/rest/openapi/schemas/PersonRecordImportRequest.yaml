type: object
additionalProperties: false
required: [rows]
properties:
  rows:
    type: array
    minItems: 1
    maxItems: 1000
    items:
      type: object
      additionalProperties: false
      required: [row, employee_number]
      properties:
        row:
          type: integer
          minimum: 0
          description: The sheet row number, echoed in the report.
        employee_number:
          type: string
        entry_id:
          type: [string, 'null']
          format: uuid
        expected_version:
          type: [integer, 'null']
          format: int64
        void_reason:
          type: [string, 'null']
          maxLength: 500
          description: With entry_id, voids that entry.
        fields:
          oneOf:
          - $ref: '#/components/schemas/PersonRecordFields'
          - type: 'null'
  plan_digest:
    type: [string, 'null']
    description: Apply only; the preview's plan_digest.
