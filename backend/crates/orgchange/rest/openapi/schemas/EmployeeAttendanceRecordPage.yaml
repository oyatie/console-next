type: object
required:
- items
- total
- limit
- offset
properties:
  console_clock_out:
    type: boolean
    description: Whether the current employee may clock out from the console under the effective policy. Returned by the self endpoint.
  items:
    type: array
    items:
      $ref: '#/components/schemas/EmployeeAttendanceRecord'
  total:
    type: integer
    format: int64
  limit:
    type: integer
    format: int64
  offset:
    type: integer
    format: int64
