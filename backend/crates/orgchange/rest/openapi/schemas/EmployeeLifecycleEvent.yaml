type: object
required:
- id
- employee_id
- event_type
- to_status
- state
- effective_date
- comment
- signoffs
- created_by
- created_by_name
- created_at
properties:
  action_refusals:
    type: object
    additionalProperties: false
    description: >-
      Always present on GET lifecycle-events items. Cedar decisions for opening correction/rescission;
      a present verb carries its server refusal code, an absent verb is permitted.
      Payload, concurrency and period guards are rechecked by the command.
    properties:
      correct: {type: string}
      rescind: {type: string}
  actor_kind: {oneOf: [{$ref: '#/components/schemas/ActorKind'}, {type: 'null'}]}
  command_id: {type: [string, 'null'], format: uuid}
  id:
    $ref: '#/components/schemas/Uuid'
  employee_id:
    $ref: '#/components/schemas/Uuid'
  event_type:
    type: string
    enum:
    - ONBOARD
    - OFFBOARD
    - TERMINATE
    - TRANSFER
    - PROMOTE
    - LEAVE_OF_ABSENCE
    - RETURN_FROM_LEAVE
    - CONTRACT_RENEWAL
    - EXIT_REVERSAL
    - REHIRE
    - RESCIND
    - GROUP_TRANSFER
    - APPOINT
    - EMPLOYMENT_TYPE_CHANGE
    description: OFFBOARD/TERMINATE rows are recorded by exit-case HR confirmation (or are historical);
      EXIT_REVERSAL is the compensating event a rejected/cancelled exit case records; RESCIND is the compensating
      row of a rescission (voids_event_id names the rescinded event); REHIRE starts a new employment period
      (rehire, BW-19).
  from_status:
    type: string
    nullable: true
  to_status:
    type: string
    enum:
    - PRE_HIRE
    - ACTIVE
    - ON_LEAVE
    - EXITED
    - UNKNOWN
  from_company:
    type: string
    nullable: true
  to_company:
    type: string
    nullable: true
  from_org_unit:
    type: string
    nullable: true
  to_org_unit:
    type: string
    nullable: true
  from_position:
    type: string
    nullable: true
  to_position:
    type: string
    nullable: true
  expected_return_date:
    type: string
    nullable: true
  contract_end_date:
    type: string
    nullable: true
  leave_type:
    type: string
    x-extensible-enum: [CHILDCARE, MATERNITY, WORK_INJURY, ILLNESS, PERSONAL, OTHER]
    description: LEAVE_OF_ABSENCE only; absent when not given. WORK_INJURY is industrial accident medical care. Omitted for callers without
      employee_directory_manage (ILLNESS, MATERNITY and WORK_INJURY reveal health information, Personal Information Protection Act Article 23).
  batch_id:
    $ref: '#/components/schemas/Uuid'
    description: Present when the event was recorded by a bulk appointment (POST /api/v1/employees/lifecycle-events/bulk).
  state:
    type: string
    enum: [SCHEDULED, APPLIED, APPLY_FAILED, CANCELLED]
    description: SCHEDULED until its effective_date (KST) arrives; APPLIED once in effect (every immediate event);
      APPLY_FAILED when it was no longer valid on its date (failure_code/failure_reason say why); CANCELLED when
      withdrawn or replaced by a correction (superseded_by). The from_/to_ fields of a SCHEDULED event are the
      projection at scheduling time and are rewritten from the live employee when it applies.
  applied_at:
    $ref: '#/components/schemas/Timestamp'
    description: When a scheduled event was applied; absent otherwise.
  failure_code:
    type: string
    description: APPLY_FAILED only, the refusal code (e.g. invalid_transition, lifecycle_noop, validation).
  failure_reason:
    type: string
    description: >-
      APPLY_FAILED only, the server's refusal message, localized exactly like error.message (Korean when the
      request prefers `Accept-Language: ko`).
  cancelled_by:
    $ref: '#/components/schemas/Uuid'
    description: CANCELLED only.
  cancelled_by_name:
    type: string
    description: CANCELLED by hand only, the canceller's display name resolved server-side within the tenant;
      absent when unknown.
  cancelled_at:
    $ref: '#/components/schemas/Timestamp'
    description: CANCELLED only.
  cancel_reason:
    type: string
    description: CANCELLED by hand only (absent when replaced by a correction). Omitted for callers without
      employee_directory_manage (free text about the employee).
  superseded_by:
    $ref: '#/components/schemas/Uuid'
    description: CANCELLED by a correction only, the SCHEDULED event that replaced it.
  reason_code:
    type: string
    description: The BW-07 reason code of a TRANSFER or PROMOTE (lifecycle_cancel for a RESCIND), when one was
      given; comment is its note.
  voids_event_id:
    $ref: '#/components/schemas/Uuid'
    description: BW-11. The event this row corrects (same type and date) or rescinds (RESCIND).
  voided_by:
    $ref: '#/components/schemas/Uuid'
    description: BW-11. The correction or RESCIND row that voided this event; it no longer holds.
  to_workplace_id:
    $ref: '#/components/schemas/Uuid'
    description: TRANSFER (E-S3b). The workplace of the same legal entity the event moves the employee to (relocation), named or
      taken from the unit's workplace; absent when the employee stays where they work. GROUP_TRANSFER - the
      receiving workplace of the other legal entity.
  group_transfer:
    $ref: '#/components/schemas/GroupTransferFacts'
    description: GROUP_TRANSFER only. The facts recorded with the group transfer (evidence references are omitted from the
      read-only view), plus from_legal_entity_id and to_legal_entity_id.
  from_job_title_id:
    $ref: '#/components/schemas/Uuid'
    description: PROMOTE only, the catalog title before (absent when the employee had none).
  to_job_title_id:
    $ref: '#/components/schemas/Uuid'
    description: PROMOTE by catalog id only, the title after.
  from_grade_id:
    $ref: '#/components/schemas/Uuid'
    description: PROMOTE with to_grade_id only (MR-25), the grade before.
  to_grade_id:
    $ref: '#/components/schemas/Uuid'
    description: PROMOTE with to_grade_id only, the grade after.
  from_position_kind_id:
    $ref: '#/components/schemas/Uuid'
    description: APPOINT only, the position before (absent when none).
  to_position_kind_id:
    $ref: '#/components/schemas/Uuid'
    description: APPOINT only, the position after (absent when none, e.g. relieved of position).
  from_job_id:
    $ref: '#/components/schemas/Uuid'
    description: APPOINT only, the job before.
  to_job_id:
    $ref: '#/components/schemas/Uuid'
    description: APPOINT only, the job after.
  from_job:
    type: string
    description: APPOINT only, the job duties text before.
  to_job:
    type: string
    description: APPOINT only, the job duties text after.
  from_job_family_id:
    $ref: '#/components/schemas/Uuid'
    description: APPOINT only, the job family before.
  to_job_family_id:
    $ref: '#/components/schemas/Uuid'
    description: APPOINT only, the job family after.
  from_employment_type:
    $ref: '#/components/schemas/EmploymentType'
    description: EMPLOYMENT_TYPE_CHANGE only (MR-24), the employment type before.
  to_employment_type:
    $ref: '#/components/schemas/EmploymentType'
    description: EMPLOYMENT_TYPE_CHANGE only, the employment type after.
  effective_date:
    type: string
  comment_code:
    type: [string, 'null']
    description: System-authored comment catalog code; absent on legacy or user-written notes.
  comment:
    type: string
  signoffs:
    $ref: '#/components/schemas/EmployeeLifecycleSignoffs'
  created_by:
    $ref: '#/components/schemas/Uuid'
  created_by_name:
    type: [string, 'null']
    description: The recorder's display name, resolved server-side within the tenant; null when unknown.
  created_at:
    $ref: '#/components/schemas/Timestamp'
