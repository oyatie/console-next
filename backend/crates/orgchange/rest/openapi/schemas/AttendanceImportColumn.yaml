type: object
required:
- source_header
- normalized_header
- classification
- preview_allowed
properties:
  source_header:
    type: string
  normalized_header:
    type: string
  target:
    type: string
    nullable: true
    enum:
    - employee_number
    - employee_name
    - branch_name
    - work_date
    - check_in_at
    - check_out_at
    - minutes_worked
  classification:
    type: string
    description: '`restricted` columns are dropped at import: their values are never stored and never appear in preview
      `values`.'
    enum:
    - canonical
    - retained
    - restricted
  preview_allowed:
    type: boolean
