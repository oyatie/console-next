type: object
additionalProperties: false
description: Discipline (restricted). title is the discipline type; ends_on closes a suspension or pay-cut period.
required: [title, decided_on]
properties:
  title:
    type: string
    maxLength: 100
  decided_on:
    type: string
    format: date
  issuer:
    type: [string, 'null']
    maxLength: 100
  details:
    type: [string, 'null']
    maxLength: 500
  ends_on:
    type: [string, 'null']
    format: date
