type: object
required:
- employee_id
- phase
- cancel
- cancel_route
- attestation_required
- register_confirmation_required
- exit
- updated_at
- can_cancel
- can_report_exit
properties:
  employee_id:
    type: string
    format: uuid
  phase:
    type: string
    enum:
    - SETUP
    - OPERATING
  cancel:
    $ref: '#/components/schemas/EndOffer'
  cancel_route:
    type: string
    enum:
    - DELETE
    - VOID
  attestation_required:
    type: boolean
  void_basis:
    type: string
    description: The server's allowed registration_void basis; omitted when cancellation is refused.
  recorded_hire_date:
    type: string
    format: date
    description: Recorded first day, shown when the operator attests a mistaken historical registration.
  register_confirmation_required:
    type: boolean
  exit:
    $ref: '#/components/schemas/EndOffer'
  open_exit_case_id:
    type: string
    format: uuid
  updated_at:
    type: string
    format: date-time
  can_cancel:
    type: boolean
  can_report_exit:
    type: boolean
