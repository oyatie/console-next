# SPDX-License-Identifier: LicenseRef-Proprietary
type: object
additionalProperties: false
required:
  - prefix
  - width
  - seal_text
  - version
  - seal_png
  - legal_entity_id
properties:
  prefix:
    type: string
  width:
    type: integer
    minimum: 1
    maximum: 12
  seal_text:
    type: string
  version:
    type: integer
  seal_png:
    type:
      - string
      - 'null'
    description: >-
      Optional PNG data URL; validated bytes, size and dimensions. Clearing settings does not change
      previously issued snapshots.
  legal_entity_id:
    type: string
    format: uuid
