type: object
additionalProperties: false
description: Military service. No exemption reason and no discharge type (both can disclose health, Personal Information Protection Act §23). branch, rank and
  dates only for COMPLETED or SERVING.
required: [status]
properties:
  status:
    type: string
    enum: [COMPLETED, SERVING, NOT_COMPLETED, EXEMPT, NOT_APPLICABLE]
  branch:
    type: [string, 'null']
    enum: [ARMY, NAVY, AIR_FORCE, MARINE_CORPS, SOCIAL_SERVICE, ALTERNATIVE, OTHER, null]
  rank:
    type: [string, 'null']
    maxLength: 30
  served_from:
    type: [string, 'null']
    format: date
  served_to:
    type: [string, 'null']
    format: date
