# SPDX-License-Identifier: LicenseRef-Proprietary
allOf:
- {$ref: '#/components/schemas/ApprovalDocument'}
- type: object
  required: [body, revision, fingerprint, consequence, opinion_max, my_actions]
  properties:
    body:
      type: array
      items:
        type: object
        required: [key, label, value]
        properties:
          key: {type: string}
          label: {type: string}
          value: {type: string}
    proposal:
      type: array
      items: {$ref: '#/components/schemas/OrgProposalOp'}
    proposal_names:
      type: object
      description: Current names of same-tenant organization units referenced by the proposal, covered by the fingerprint.
      additionalProperties: {type: string}
    revision:
      type: integer
      description: Source event sequence length plus one; the fingerprint also covers edits without new events.
    fingerprint:
      type: string
      description: Opaque snapshot token covering the source request, proposal, route and displayed facts.
    consequence: {type: string}
    opinion_max: {type: integer, minimum: 0}
    my_actions:
      type: object
      required: [kind]
      description: >-
        What the viewer may decide now. approve carries reject, and return only where the source takes one
        (none does yet). Each names the consequence and the reason-code catalog domain its reason_code comes from.
      properties:
        kind: {type: string, x-extensible-enum: [none, approve]}
        reject:
          type: object
          required: [consequence, reason_domain]
          properties:
            consequence: {type: string, x-extensible-enum: [request_ends]}
            reason_domain: {type: string}
        return:
          type: object
          required: [consequence, reason_domain]
          properties:
            consequence: {type: string, x-extensible-enum: [back_to_drafter]}
            reason_domain: {type: string}
