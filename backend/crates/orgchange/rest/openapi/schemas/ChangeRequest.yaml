type: object
description: BW-17 change request to HR. The requester never decides.
required: [id, kind, subject_type, subject_id, payload, reason_code, requested_by, assignee_role, status, review_required, created_at]
properties:
  id:
    $ref: '#/components/schemas/Uuid'
  kind:
    type: string
    x-extensible-enum: [PROFILE_CORRECTION, IDENTITY_REVIEW, ACCESS_REQUEST, SCOPE_ACTION, OTHER, ACCESS_EXPLANATION, POLICY_QUESTION, EMPLOYEE_VOID, IMPORT_ROLLBACK]
  subject_type:
    type: string
    x-extensible-enum: [EMPLOYEE, USER_ACCOUNT, BRANCH, ORGANIZATION, DATA_IMPORT_RUN]
  subject_id:
    $ref: '#/components/schemas/Uuid'
  subject_name:
    type: [string, 'null']
  subject_number:
    type: [string, 'null']
  payload:
    type: object
    additionalProperties: true
    description: >-
      The request's details. In `changes`, a birth date, address, phone or personal email is the
      reveal mask, never the value; only POST /api/v1/employees/{id}/reveal returns a recorded one.
  reason_code:
    type: string
  note:
    type: [string, 'null']
  requested_by:
    $ref: '#/components/schemas/Uuid'
  assignee_role:
    type: string
    enum: [HR]
  assignee_user_id:
    oneOf:
    - $ref: '#/components/schemas/Uuid'
    - type: 'null'
  status:
    type: string
    enum: [OPEN, APPLIED, DECLINED, WITHDRAWN]
  can_review:
    type: boolean
    description: The viewer meets this open request's assignee and subject-scope rules for apply or decline. The decision command rechecks the current row and policy.
  review_required:
    type: boolean
    description: OTHER requests are reviewed after the fact.
  decided_by:
    oneOf:
    - $ref: '#/components/schemas/Uuid'
    - type: 'null'
  decision_reason_code:
    type: [string, 'null']
  decision_note:
    type: [string, 'null']
  created_at:
    $ref: '#/components/schemas/Timestamp'
  decided_at:
    oneOf:
    - $ref: '#/components/schemas/Timestamp'
    - type: 'null'
