tags:
  - hr
operationId: cancelEmployeeExitCase
summary: Cancel an employee exit report
description: Withdraws a REPORTED case before HR confirmation. The reporter capability (exit_case_report) or exit_case_hr_confirm is required. After HR confirmation, cancellation is refused with 409 exit_cancel_after_hr_confirmation, including scheduled and applied exits; nothing is changed. Reject the case with a reason instead. A cancellation never reverses an effective exit.
  403 own_record_forbidden when the employee is the caller's own record (linked account, or the same person). Nobody records an HR act on their own record, whatever they hold; another holder in scope, or the ops account, records it. The ops account passes only when no other active account holds the act over the employee, and that pass is audited as authz.own_record.break_glass with review_required (people-self-33).
security:
- bearerAuth: []
parameters:
- name: id
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/CloseEmployeeExitCaseRequest'
responses:
  '200':
    description: The closed case (status CANCELLED; closed_by, closed_at and closed_reason set).
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/EmployeeExitCase'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
  '409':
    $ref: '#/components/responses/Conflict'
  '422':
    $ref: '#/components/responses/ValidationError'
