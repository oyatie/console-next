# SPDX-License-Identifier: LicenseRef-Proprietary
tags: [org]
operationId: getApprovalDocument
summary: Read a source-authorized approval document
security: [{bearerAuth: []}]
description: >-
  Cedar approval_document_read uses the same source facts and inbox membership as the list.
  Hidden, absent, unsupported, draft and unrouted documents all return not_found.
  Proposal contains typed source operations and effective_date is a business date; body does not repeat the header.
  This read-only envelope exposes no decisions until the source-command adapter is available.
parameters:
- {name: id, in: path, required: true, schema: {type: string}, description: Canonical source-prefixed document ID from the inbox.}
responses:
  '200':
    description: Visible source document under one consistent snapshot.
    content:
      application/json:
        schema: {$ref: '#/components/schemas/ApprovalDocumentDetail'}
  '401': {$ref: '#/components/responses/Unauthorized'}
  '404': {$ref: '#/components/responses/NotFound'}
  '500':
    description: Sanitized approvals.projection_unavailable; includes a support reference.
    content:
      application/json:
        schema: {$ref: '#/components/schemas/ErrorBody'}
