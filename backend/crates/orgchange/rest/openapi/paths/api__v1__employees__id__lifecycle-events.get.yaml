tags:
  - employees
operationId: listEmployeeLifecycleEvents
summary: List audited employee lifecycle events
description: Tenant-scoped lifecycle ledger for onboarding, offboarding, termination, transfer, promotion, leave and
  contract decisions, including SCHEDULED (effective-dated) events and their outcome (state). Readable with
  employee_directory_read; recording takes employee_directory_manage.
security:
- bearerAuth: []
parameters:
- name: id
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
- name: limit
  in: query
  required: false
  schema:
    type: integer
    format: int64
    minimum: 1
    maximum: 500
    default: 200
- name: cursor
  in: query
  required: false
  schema:
    type: string
  description: The previous page's next_cursor (keyset on created_at, id, newest first); an unknown cursor is 422.
responses:
  '200':
    description: Employee lifecycle events, newest first.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/EmployeeLifecycleEventPage'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
  '422':
    $ref: '#/components/responses/ValidationError'
