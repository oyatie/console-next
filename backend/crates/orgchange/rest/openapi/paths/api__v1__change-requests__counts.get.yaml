tags:
  - employees
operationId: getChangeRequestCounts
summary: Counts of open change requests visible to the caller
description: >-
  Single-scan counts of OPEN change requests across all visible requests (`all`),
  requests assigned directly to the caller (`me`), and unassigned HR role requests (`role`).
security:
- bearerAuth: []
responses:
  '200':
    description: Counts of OPEN change requests per lane.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ChangeRequestCountsResponse'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
