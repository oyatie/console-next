tags:
  - employees
operationId: getEmployeeFacets
summary: Roster chip counts for the employee list filters
description: Counts over the same rows GET /api/v1/employees would list. status is counted without the status filter;
  review without the review and contract filters (one count per flag); total and employment_type with every filter.
security:
- bearerAuth: []
parameters:
- name: company
  in: query
  required: false
  schema:
    type: string
  description: Filter by workbook sheet/company name.
- name: search
  in: query
  required: false
  schema:
    type: string
  description: Case-insensitive name or employee-number typeahead query.
- name: register_review_required
  in: query
  schema:
    type: boolean
  description: Only records with missing statutory register facts.
- name: home_branch_review_required
  in: query
  required: false
  schema:
    type: boolean
  description: Filter to employees whose active authoritative home branch is missing/inactive (true) or usable (false).
- name: identity_review_required
  in: query
  required: false
  schema:
    type: boolean
  description: Filter to employees whose import identity resolution needs review (true) or not (false).
- name: org_unit_id
  in: query
  required: false
  schema:
    $ref: '#/components/schemas/Uuid'
  description: Only employees bound to this OrgUnit (direct members; child units are not included).
- name: legal_entity_id
  in: query
  required: false
  schema:
    $ref: '#/components/schemas/Uuid'
  description: Only employees whose current employment assignment (the last one once exited, the first one
    before the hire date) names this 법인.
- name: workplace_id
  in: query
  required: false
  schema:
    $ref: '#/components/schemas/Uuid'
  description: Only employees whose current employment assignment names this 사업장.
- name: status
  in: query
  required: false
  style: form
  explode: false
  schema:
    type: array
    items:
      type: string
      enum: [ACTIVE, ON_LEAVE, EXITED, UNKNOWN]
  description: One employment status or a comma-separated list (`status=ACTIVE,ON_LEAVE`). Omitted means every
    status, EXITED included.
- name: employee_number
  in: query
  required: false
  style: form
  explode: false
  schema:
    type: array
    maxItems: 500
    items:
      type: string
  description: Exact employee numbers, comma-separated (`employee_number=A-1,A-2`), at most 500 (422 above). Resolves a
    pasted column in one read.
- name: contract_ending_before
  in: query
  required: false
  schema:
    type: string
    format: date
  description: YYYY-MM-DD. Only employees whose current contract ends strictly before this date (e.g. tomorrow with
    status=ACTIVE finds expired contracts of still-active employees). `total` counts the filtered set.
- name: lifecycle_apply_failed
  in: query
  required: false
  schema:
    type: boolean
  description: true lists only employees with a failed_event (a scheduled action that could not apply on its date
    and was not redone); false only those without. `total` counts the filtered set.
responses:
  '200':
    description: The counts.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/EmployeeFacets'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '422':
    $ref: '#/components/responses/ValidationError'
