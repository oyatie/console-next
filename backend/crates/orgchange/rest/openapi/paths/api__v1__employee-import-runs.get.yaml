# SPDX-License-Identifier: LicenseRef-Proprietary
tags:
  - employees
operationId: listEmployeeImportRuns
summary: Recent applied employee imports and their stored results
description: Requires org-wide employee_directory_manage. Counts are read from apply_summary, never the current roster. Results include only completed applies and are keyset-paged by applied_at and id, newest first.
security:
  - bearerAuth: []
parameters:
  - name: limit
    in: query
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
  - name: after
    in: query
    description: The previous page's next_cursor.
    schema:
      type: string
responses:
  '200':
    description: Applied and rolled-back runs in this tenant.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/EmployeeImportRunPage'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '422':
    $ref: '#/components/responses/ValidationError'
