tags:
  - hr
operationId: getEmployeeExitCase
summary: Read one employee exit case
description: A case outside the caller's branch scope is 404, like an absent one.
security:
- bearerAuth: []
parameters:
- name: id
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
responses:
  '200':
    description: The exit case.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/EmployeeExitCase'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
