tags:
- org
operationId: draftCreateOrgUnit
summary: Draft an org change that creates one OrgUnit
description: Creates a DRAFT org change (kind NEW) with one CREATE_ORG_UNIT op. The unit exists only after the change
  is approved and effectuated. Unknown or foreign parentId is 404.
security:
- bearerAuth: []
parameters:
- name: Idempotency-Key
  in: header
  required: true
  schema:
    type: string
    minLength: 16
    maxLength: 200
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/CreateOrgUnitRequest'
responses:
  '200':
    description: Idempotent replay of the existing draft.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/OrgChangeDetail'
  '201':
    description: Draft org change created.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/OrgChangeDetail'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
  '409':
    $ref: '#/components/responses/Conflict'
  '422':
    $ref: '#/components/responses/ValidationError'
  '503':
    $ref: '#/components/responses/ServiceUnavailable'
