tags:
  - employees
operationId: getEmployeeRegisterFacts
summary: The worker register items HR holds for one employee
description: >-
  MR-23. Sex, address, history and career, exit reason and other necessary matters
  (Labor Standards Act §41, Enforcement Decree §20). Org-wide employee_directory_manage (the
  items are not shown to a directory reader); each read leaves an access log
  row. null = not entered. `updated_at` is the employee's version for the
  PATCH /employees/{id} that corrects them.
security:
- bearerAuth: []
parameters:
- name: id
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
responses:
  '200':
    description: The register items.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/EmployeeRegisterFacts'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
