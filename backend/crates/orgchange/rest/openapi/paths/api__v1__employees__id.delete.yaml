tags:
  - employees
operationId: setupDeleteEmployee
summary: Delete a mistaken registration during SETUP (MR-26)
description: >-
  Before go-live only (409 phase_not_setup after it; use
  POST /api/v1/employees/{id}/void). Org-wide employee_directory_manage.
  The record is voided and tombstoned in the same transaction: it leaves
  every read (lists, facets, export, org chart, detail 404), its employee number is
  freed, its personal data (name, contact, birth date, pay, the
  correction ledger's values, the person's name history) is destroyed,
  and the ids, dates and void facts stay as the tombstone listed by
  GET /api/v1/employees/voided. Scheduled personnel orders are cancelled and the
  legal entity · workplace assignment is withdrawn. An EXITED person within the
  worker register period (exit date + retention.labor.employee_register years,
  Labor Standards Act §42, Enforcement Decree §22②1) needs register_kept = true (409
  exited_register_confirmation_required). Audited as
  employee.setup_delete with ids, employee number and the reason only.
security:
- bearerAuth: []
parameters:
- name: id
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/SetupDeleteEmployeeRequest'
responses:
  '200':
    description: The registration is void and tombstoned.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/EmployeeVoidOutcome'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
  '409':
    description: phase_not_setup, exited_register_confirmation_required, or a stale expected_updated_at.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
  '422':
    $ref: '#/components/responses/ValidationError'
