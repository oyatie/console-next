tags:
  - employees
operationId: getBulkEmployeeCorrection
summary: Read a committed bulk 정정 job (MR-27)
description: Field names and counts; the values are in the ledger rows that name the job.
security:
- bearerAuth: []
parameters:
- name: id
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
responses:
  '200':
    description: The job.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/BulkEmployeeCorrectionJob'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
