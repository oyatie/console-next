tags:
  - employees
operationId: createEmployeeLifecycleEvent
summary: Record an employee lifecycle transition
description: >-
  Mutates the employee status/company/org-unit/position only through an audited event. State rules (409
  invalid_transition): no event on an EXITED employee; LEAVE_OF_ABSENCE only from ACTIVE (to ON_LEAVE);
  RETURN_FROM_LEAVE only from ON_LEAVE (to ACTIVE); ONBOARD/TRANSFER/PROMOTE not while ON_LEAVE;
  CONTRACT_RENEWAL keeps the current status and requires employment_type CONTRACT. Exits are never recorded
  here: OFFBOARD/TERMINATE are 422 — an employee leaves only through an exit case, whose HR confirmation
  records TERMINATE and whose rejection records the compensating EXIT_REVERSAL. No act needs an
  acknowledgement (decisions #3, A13). TRANSFER, LEAVE_OF_ABSENCE and RETURN_FROM_LEAVE wait
  for 운영 시작: 409 phase_not_operating while the tenant is in SETUP (first-run §2). A TRANSFER that changes
  to_company is 409 entity_change_needs_group_transfer: another 법인 is a 전적, never a transfer (E-S3b).
  A TRANSFER to a unit or 사업장 of another 법인 is 422 transfer_cross_entity naming the target in
  error.refusals [{field, code, value}] (TR-33, decisions #30); nothing is written.
  A change that alters nothing is 422 lifecycle_noop (TRANSFER to the current unit within the
  same company, or with no target; PROMOTE to the current position). An effective_date after today (KST)
  schedules the event (state SCHEDULED; 발령 효력 예정) for TRANSFER, PROMOTE, LEAVE_OF_ABSENCE,
  RETURN_FROM_LEAVE and CONTRACT_RENEWAL (ONBOARD is 422): the same rules run now against the employee as
  they will stand on that date (the current head with every earlier SCHEDULED event applied), nothing about
  the employee changes, and a SCHEDULED event of the same type on the same date is replaced (CANCELLED with
  superseded_by; one per type per employee per date). On its date the server re-validates it against the
  live employee and applies it (APPLIED, employee updated, employee.lifecycle.apply audit) or records the
  refusal (APPLY_FAILED with failure_code/failure_reason). Withdraw one before its date with POST
  /api/v1/employees/{id}/lifecycle-events/{event_id}/cancel. A state refusal caused by an earlier SCHEDULED
  event (not the live employee) is 409 lifecycle_scheduled_state naming it. Every event, immediate or
  scheduled, must leave the employee's later SCHEDULED events valid: otherwise 409 lifecycle_schedule_conflict
  names each one in error.refusals and nothing is recorded. The employee detail's allowed_events lists the
  events these rules admit right now; allowed_scheduled_events those schedulable after the last SCHEDULED event.
  403 own_record_forbidden when the employee is the caller's own record (linked account, or the same person). Nobody records an HR act on their own record, whatever they hold; another holder in scope, or the ops account, records it. The ops account passes only when no other active account holds the act over the employee, and that pass is audited as authz.own_record.break_glass with review_required (people-self-33).
security:
- bearerAuth: []
parameters:
- name: id
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
- name: Idempotency-Key
  in: header
  required: true
  description: 16..200 characters. An exact replay returns 200 with the original body; the same key with a
    different body is 409 conflict.
  schema:
    type: string
    minLength: 16
    maxLength: 200
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/CreateEmployeeLifecycleEventRequest'
responses:
  '200':
    description: Recorded lifecycle event (also the exact Idempotency-Key replay).
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/EmployeeLifecycleEvent'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
  '409':
    description: Conflicts with the employee's state or schedule. lifecycle_schedule_conflict names, in
      error.refusals, every SCHEDULED event of the employee the change would make fail on its date; nothing was
      recorded.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/LifecycleScheduleConflictBody'
  '422':
    $ref: '#/components/responses/ValidationError'
