x-console-authz: {"permission": "EmployeeDirectoryRead", "scope": "hr"}
tags:
  - employees
operationId: listJobTitles
summary: The tenant's classification catalogs (BW-13, MR-25)
description: The tenant's five typed lists (kind GRADE 직급, TITLE 직위, POSITION 직책, JOB 직무, JOB_FAMILY
  직군), by kind, most senior first (grade_rank descending, unranked last), including deactivated ones (active
  false) so history keeps resolving. No entries are seeded. Takes employee_directory_read.
security:
- bearerAuth: []
parameters:
- name: kind
  in: query
  required: false
  description: Only this list (an unknown kind is refused on the wire as 422 validation).
  schema:
    $ref: '#/components/schemas/JobTitleKind'
responses:
  '200':
    description: The catalog.
    content:
      application/json:
        schema:
          type: object
          required: [items, can_manage]
          properties:
            can_manage:
              type: boolean
              description: BE-EMP-UI. The caller may add or change entries (Cedar job_title_manage); draw the
                inline 「+ 추가」 only when true.
            items:
              type: array
              items:
                type: object
                required: [id, kind, label, grade_rank, active]
                properties:
                  id:
                    $ref: '#/components/schemas/Uuid'
                  kind:
                    $ref: '#/components/schemas/JobTitleKind'
                  label:
                    type: string
                  grade_rank:
                    type: [integer, 'null']
                    description: Higher = more senior; null = unranked.
                  active:
                    type: boolean
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
