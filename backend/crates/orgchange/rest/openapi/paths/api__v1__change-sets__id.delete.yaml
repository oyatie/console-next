tags:
  - employees
operationId: discardChangeSet
summary: Discard the caller's change set (BW-38)
description: The draft becomes DISCARDED and its lines are never recorded. Repeating it is a no-op; a COMMITTED
  set is 409 invalid_transition.
security:
- bearerAuth: []
parameters:
- name: id
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
responses:
  '204':
    description: Discarded.
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
  '409':
    $ref: '#/components/responses/Conflict'
