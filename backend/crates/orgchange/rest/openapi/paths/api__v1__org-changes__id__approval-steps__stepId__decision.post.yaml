tags:
- org
operationId: decideOrgChangeApprovalStep
summary: Decide one approval step
description: >-
  IN_APPROVAL only. Cedar checks live tenant-wide approval authority and distinct natural persons
  in the locked decision transaction; the drafter and any person who decided another step cannot decide.
  Steps decide strictly in order and a rejection ends the request as REJECTED.
  CANCELLED returns 409 lifecycle.refuse.withdrawn before checking expected_version;
  a mismatch returns 409 lifecycle.refuse.stale_version with error.details.current_version.
  Missing or expired approval authority returns 403 org_change.refuse.missing_grant, before document-version checks.
  through_step always returns 409 lifecycle.refuse.merge_not_allowed. Refusals write no business state.
security:
- bearerAuth: []
parameters:
- name: id
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
- name: stepId
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/OrgChangeDecisionRequest'
responses:
  '200':
    description: Decision recorded.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/OrgChangeDetail'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
  '409':
    description: State conflict, separation of duties, merge attempt, withdrawn request, or stale document version.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
  '422':
    $ref: '#/components/responses/ValidationError'
  '503':
    $ref: '#/components/responses/ServiceUnavailable'
