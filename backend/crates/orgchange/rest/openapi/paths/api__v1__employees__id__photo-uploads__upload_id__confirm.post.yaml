tags:
  - employees
operationId: confirmEmployeePhotoUpload
summary: Confirm a 사진 upload once the PUT is done
description: >-
  MR-34. Org-wide employee_directory_manage. Checks that the object is in
  storage at the declared size (409 `photo_upload_missing`, 409
  `photo_upload_size_mismatch`). Confirming twice is a no-op.
security:
- bearerAuth: []
parameters:
- name: id
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
- name: upload_id
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
responses:
  '200':
    description: The confirmed upload.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/EmployeePhotoUpload'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
  '409':
    description: The object is missing or not the declared size.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
  '503':
    description: Object storage is not configured (`photo_storage_unavailable`).
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
