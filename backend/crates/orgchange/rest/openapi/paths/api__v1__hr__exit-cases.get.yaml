x-console-authz: {"permission": "EmployeeDirectoryRead", "scope": "capability"}
tags:
  - hr
operationId: listEmployeeExitCases
summary: List employee exit cases in the caller's branch scope
security:
- bearerAuth: []
parameters:
- name: employee_id
  in: query
  required: false
  schema:
    $ref: '#/components/schemas/Uuid'
- name: status
  in: query
  required: false
  description: One status or a comma-separated list (status=REPORTED,HR_CONFIRMED); an unknown status is 422.
  schema:
    type: string
- name: search
  in: query
  required: false
  description: Part of the employee's name or employee number (case-insensitive).
  schema:
    type: string
- name: limit
  in: query
  required: false
  schema:
    type: integer
    format: int64
    minimum: 1
    maximum: 200
    default: 50
- name: offset
  in: query
  required: false
  schema:
    type: integer
    format: int64
    minimum: 0
responses:
  '200':
    description: Exit cases, most recently updated first.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/EmployeeExitCasePage'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '422':
    $ref: '#/components/responses/ValidationError'
