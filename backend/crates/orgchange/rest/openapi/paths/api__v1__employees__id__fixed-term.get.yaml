tags:
  - employees
operationId: getEmployeeFixedTerm
summary: Cumulative fixed-term service (BW-12, 기간제법 §4①)
description: Service as of today (KST) from the live contract history (employee_contracts), else the profile's
  contract window, else the hire date (basis HIRE_DATE_FALLBACK, which needs a review). 육아휴직 is not counted
  (남녀고용평등법 §19⑤). applies is false for an employee who is neither CONTRACT nor has a fixed-term contract
  row; the other fields are then null. Takes org-wide employee_directory_read.
security:
- bearerAuth: []
parameters:
- name: id
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
- name: contract_end_date
  in: query
  required: false
  description: Proposed renewal end; only unexpired, unconsumed recorded or approved exceptions for this exact payload are offered.
  schema:
    type: string
    format: date
responses:
  '200':
    description: The fixed-term service.
    content:
      application/json:
        schema:
          type: object
          required: [applies, cumulative_days, two_year_date, basis]
          properties:
            available_exceptions:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [id, ground_code, basis, note]
                properties:
                  id:
                    $ref: '#/components/schemas/Uuid'
                  ground_code:
                    type: string
                    enum: [PROJECT_COMPLETION, ABSENCE_COVER, STUDY_OR_TRAINING, OLDER_WORKER, PROFESSIONAL, GOVERNMENT_JOB_PROGRAM, DECREE_LISTED]
                  basis:
                    type: string
                    description: Provision from the registered FixedTermExemption ground.
                  note:
                    type: [string, 'null']
            rule:
              oneOf:
              - $ref: '#/components/schemas/LegalRule'
              - type: 'null'
            applies:
              type: boolean
            cumulative_days:
              type: [integer, 'null']
            two_year_date:
              type: [string, 'null']
              format: date
              description: The last day inside the limit, assuming uninterrupted service after the current
                contract.
            basis:
              type: [string, 'null']
              enum: [CONTRACT_HISTORY, HIRE_DATE_FALLBACK, null]
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
