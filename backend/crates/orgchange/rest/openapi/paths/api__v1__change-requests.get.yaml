tags:
  - employees
operationId: listChangeRequests
summary: List change requests
description: >-
  BW-17. HR sees requests about subjects in its directory management scope.
  A caller also sees requests it filed or is named on. `assignee=me` lists the requests named to the
  caller (an explanation request to answer); `assignee=role` is HR-only.
  A correction carries the values it asks for, so an HR page with
  PROFILE_CORRECTION rows leaves one employee.list_read access log row
  naming the employees they are about, never the values.
security:
- bearerAuth: []
parameters:
- name: id
  in: query
  required: false
  description: Select one visible request by ID. A missing or inaccessible request returns an empty page.
  schema: {type: string, format: uuid}
- name: assignee
  in: query
  required: false
  schema:
    type: string
    enum: [me, role]
  description: me = named to the caller; role = open to any HR person.
- name: requester
  in: query
  required: false
  schema:
    type: string
    enum: [me]
  description: me = only the requests the caller filed ("waiting").
- name: status
  in: query
  required: false
  schema:
    type: string
    enum: [OPEN, APPLIED, DECLINED, WITHDRAWN]
- name: limit
  in: query
  required: false
  schema:
    type: integer
    format: int64
- name: offset
  in: query
  required: false
  schema:
    type: integer
    format: int64
responses:
  '200':
    description: One page of change requests, newest first.
    content:
      application/json:
        schema:
          type: object
          required: [items, total, limit, offset]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ChangeRequest'
            total:
              type: integer
              format: int64
            limit:
              type: integer
              format: int64
            offset:
              type: integer
              format: int64
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '422':
    $ref: '#/components/responses/ValidationError'
