# SPDX-License-Identifier: LicenseRef-Proprietary
tags: [org]
operationId: listApprovalDocuments
summary: List visible approval documents
security: [{bearerAuth: []}]
description: >-
  Projects canonical org-change records. Cedar approval_document_list filters every box, count, facet and focus
  under one snapshot. Assigned upcoming and reference relationships are not stored by this source.
  Search and source apply to counts before descending created-at/UUID keyset paging.
parameters:
- {name: box, in: query, required: true, schema: {type: string, enum: [pending, upcoming, requested, reference, completed]}}
- {name: q, in: query, schema: {type: string}}
- {name: source, in: query, schema: {type: string}}
- {name: focus, in: query, schema: {type: string}, description: Canonical document ID; hidden and missing documents both return null.}
- {name: cursor, in: query, schema: {type: string}, description: Opaque next-page position.}
- {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
responses:
  '200':
    description: Authorized page and counts.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ApprovalDocumentPage'
  '422': {$ref: '#/components/responses/ValidationError'}
  '401': {$ref: '#/components/responses/Unauthorized'}
  '503': {$ref: '#/components/responses/ServiceUnavailable'}
