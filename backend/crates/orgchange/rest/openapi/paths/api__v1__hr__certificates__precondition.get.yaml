# SPDX-License-Identifier: LicenseRef-Proprietary
tags: [employees]
operationId: getCertificatePrecondition
summary: Read certificate setup readiness for one employee
description: The certificate_issue Cedar action uses canonical live person and access facts. Returns no settings or seal payload.
security:
  - bearerAuth: []
parameters:
  - in: query
    name: employee_id
    required: true
    schema:
      $ref: '#/components/schemas/Uuid'
responses:
  '200':
    description: Settings readiness only; issuance rechecks the facts in its transaction.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/CertificatePrecondition'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    description: Employee absent or belongs to another tenant.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
