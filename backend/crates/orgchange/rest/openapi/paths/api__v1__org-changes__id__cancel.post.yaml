tags:
- org
operationId: cancelOrgChange
summary: Cancel a draft or a scheduled change
description: >-
  DRAFT or PRECHECKED, or APPROVED before its 시행일 (예약 취소). Under approval.policy.org_structure = route an
  approved change is cancelled only by a caller holding org_change_apply (403 org_change_scheduled_locked);
  a change in approval resolves through the chain, never a cancel.
security:
- bearerAuth: []
parameters:
- name: id
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/CancelOrgChangeRequest'
responses:
  '200':
    description: Cancelled.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/OrgChangeDetail'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
  '409':
    $ref: '#/components/responses/Conflict'
  '422':
    $ref: '#/components/responses/ValidationError'
  '503':
    $ref: '#/components/responses/ServiceUnavailable'
