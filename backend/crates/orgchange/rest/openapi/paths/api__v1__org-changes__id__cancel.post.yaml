tags:
- org
operationId: cancelOrgChange
summary: Cancel a draft, withdraw a submitted change, or cancel a scheduled change
description: >-
  DRAFT or PRECHECKED, or APPROVED before its 시행일 (예약 취소). Under approval.policy.org_structure = route an
  approved change is cancelled only by a caller holding org_change_apply (403 org_change_scheduled_locked);
  IN_APPROVAL can be withdrawn only by its drafter, including after their grant ends
  (403 org_change.refuse.not_drafter for another caller with draft authority).
  Create, edit, preflight, submit and draft cancellation share the same scoped Cedar draft decision,
  retaining legacy-role compatibility. Missing draft authority returns 404 org_change.refuse.missing_grant
  before any scheduled-lock refusal, with the same body as an unknown id.
  Withdrawal preserves the stored chain and
  prior decisions; later decisions refuse with lifecycle.refuse.withdrawn.
security:
- bearerAuth: []
parameters:
- name: id
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/CancelOrgChangeRequest'
responses:
  '200':
    description: Cancelled.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/OrgChangeDetail'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
  '409':
    $ref: '#/components/responses/Conflict'
  '422':
    $ref: '#/components/responses/ValidationError'
  '503':
    $ref: '#/components/responses/ServiceUnavailable'
