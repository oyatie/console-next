tags:
  - employees
operationId: getEmployeePersonalFacts
summary: The personal details extras HR holds for one employee
description: >-
  MR-34. Name in Chinese characters and English name, nationality, personal email, emergency contacts, photo and group hire date.
  Org-wide employee_directory_manage; each read leaves an access log row.
  null = not entered. `photo.url` is a presigned GET valid for 5 minutes (null
  when object storage is not configured). `updated_at` is the employee's
  version for the PATCH /employees/{id} that corrects them.
security:
- bearerAuth: []
parameters:
- name: id
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
responses:
  '200':
    description: The personal details extras.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/EmployeePersonalFacts'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
