tags:
  - employees
operationId: listEmployeeImportUnplaced
summary: The 미배치 queue — current people without a 사업장 or without the 부서 their file named
description: 'BE-MIG (walkthrough W03, spec E8) — every current person with no 사업장 (reason no_place, or
  workplace_unknown when their 부서 sits under no open 사업장), or placed at a 사업장 but without the 부서 their
  import file named (unit_unknown, source_org_unit is the file''s text). count is the whole queue (the roster
  chip); items are keyset-paged by creation. run_id narrows it to the people
  one import inserted. 403 without org-wide employee_directory_manage; 422 for a cursor this list did not issue.'
security:
- bearerAuth: []
parameters:
- name: run_id
  in: query
  required: false
  schema:
    $ref: '#/components/schemas/Uuid'
- name: after
  in: query
  required: false
  description: The previous page's next_cursor.
  schema:
    type: string
- name: limit
  in: query
  required: false
  schema:
    type: integer
    minimum: 1
    maximum: 500
    default: 100
responses:
  '200':
    description: The queue, counted.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/EmployeeImportUnplacedPage'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '422':
    $ref: '#/components/responses/ValidationError'
