tags:
  - employees
operationId: applyEmployeeImport
summary: Apply a dry-run employee import run, bound to its dry run
description: 'BW-10 7: applies the plan of the latest dry run, named by dry_run_digest. The run is re-planned against
  the live roster with the stored decisions; any difference is 409 rows_changed_since_preview listing the rows
  (error.refusals [{source_key, sheet, row, outcome_before, outcome_now}]); a digest that is not the latest dry
  run''s is 409 dry_run_digest_mismatch; a row still refused or unresolved is 422 import_unresolved. Existing
  people only get the fields import may write (업무, 직위, 근무지, an empty 생년월일): never name, status, 퇴직일,
  부서 or 법인. New people are created ACTIVE, PRE_HIRE (future 입사일, ONBOARD scheduled) or EXITED (former
  employees, marked migrated). A replay of the APPLIED run with the same digest returns the stored report.
  Preserved rows remain raw-ledger evidence only.

  BE-MIG W11 (decisions #27, #28) — with Prefer respond-async every refusal above is still immediate, plus 422
  import_row_limit (current-people rows over import.apply.max_rows, former employees apart, refusals [{max, rows}]) and 409
  apply_in_progress (a job of this run with another digest is running); then a run that finishes within 2 s answers
  its 200 report (or its refusal), a longer one 202 with the job (the same digest again gets the same job; an applied
  and settled run gets its 200 report; RFC 7240). The job settles in chunks of 100 rows,
  each one transaction with a data_import.apply.progress audit on the run (the import_run realtime event);
  read it with GET. A job whose driver died is resumed by the schedule loop, or fails apply_interrupted when
  it stopped before writing (send it again). 503 import_apply_busy with Retry-After when the server already
  runs its apply drivers. Without the header the same job runs inline and the report is returned (200); 409
  apply_in_progress while another driver runs it. Either way the driver outlives the request: a dropped connection or
  a request timeout never stops an apply half way (read the run with GET).'
security:
- bearerAuth: []
parameters:
- name: run_id
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
- name: Prefer
  in: header
  required: false
  description: 'W11: respond-async starts the apply as a job (202).'
  schema:
    type: string
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/EmployeeImportApplyRequest'
responses:
  '200':
    description: Applied import counts by company.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/EmployeeImportReport'
  '202':
    description: 'W11: the apply job, started (or already running with this digest).'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/EmployeeImportApplyJob'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
  '409':
    $ref: '#/components/responses/Conflict'
  '422':
    $ref: '#/components/responses/ValidationError'
  '503':
    description: import_apply_busy — the server runs its apply drivers already; retry after Retry-After seconds.
    headers:
      Retry-After:
        schema:
          type: integer
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
