tags:
  - employees
operationId: listEmployeeRecordSheet
summary: The live entries of one personnel card section across the tenant (sheet export)
description: One row per live entry with the bound employee of the lowest employee number, its entry id and version, in
  entry id order. The rows go back into the import sheet with entry_id and expected_version to correct or
  void entries in bulk. Takes org-wide employee_directory_manage and, as a download, org-wide
  excel_download. A restricted section (discipline,
  disability, veteran) is refused with 409 record_restricted_export_unavailable until the per-export
  approval tier exists. Each page is a download, so export_purpose is required and the page is logged
  (excel_export_logs and an employee.export access log event naming its employees and the row count);
  a refusal is logged as employee.export_refused, naming the section.
security:
- bearerAuth: []
parameters:
- name: section
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/PersonRecordSectionSegment'
- name: after
  in: query
  required: false
  schema:
    $ref: '#/components/schemas/Uuid'
- name: limit
  in: query
  required: false
  schema:
    type: integer
    format: int64
    minimum: 1
    maximum: 1000
- name: export_purpose
  in: query
  required: false
  schema:
    type: string
    enum: [AUDIT_RESPONSE, INTERNAL_REVIEW, DISPUTE_RESPONSE, DATA_SUBJECT_REQUEST, OTHER]
  description: The download purpose (public notice 2023-6 §8②). Missing or unknown is 422 export_purpose_required.
responses:
  '200':
    description: One page of the sheet.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/PersonRecordSheet'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
  '422':
    $ref: '#/components/responses/ValidationError'
