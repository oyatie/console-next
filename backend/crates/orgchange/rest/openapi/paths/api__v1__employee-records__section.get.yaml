tags:
  - employees
operationId: listEmployeeRecordSheet
summary: The live entries of one 인사카드 section across the tenant (sheet export)
description: One row per live entry with the bound employee of the lowest 사번, its entry id and version, in
  entry id order. The rows go back into the import sheet with entry_id and expected_version to correct or
  void entries in bulk. Takes org-wide employee_directory_manage. A restricted section (discipline,
  disability, veteran) is refused with 409 record_restricted_export_unavailable until the per-export
  결재 tier exists.
security:
- bearerAuth: []
parameters:
- name: section
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/PersonRecordSectionSegment'
- name: after
  in: query
  required: false
  schema:
    $ref: '#/components/schemas/Uuid'
- name: limit
  in: query
  required: false
  schema:
    type: integer
    format: int64
    minimum: 1
    maximum: 1000
responses:
  '200':
    description: One page of the sheet.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/PersonRecordSheet'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
