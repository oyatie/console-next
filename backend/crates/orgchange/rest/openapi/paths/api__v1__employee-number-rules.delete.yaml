tags:
  - employees
operationId: removeEmployeeNumberRule
summary: Remove the rule of a scope (IMPORT-2)
security:
- bearerAuth: []
parameters:
- name: scope_kind
  in: query
  required: true
  schema:
    type: string
    enum: [TENANT, LEGAL_ENTITY, WORKPLACE]
- name: scope_id
  in: query
  required: false
  schema:
    $ref: '#/components/schemas/Uuid'
responses:
  '204':
    description: Removed.
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
