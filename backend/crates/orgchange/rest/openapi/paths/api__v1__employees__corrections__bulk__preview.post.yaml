tags:
  - employees
operationId: previewBulkEmployeeCorrection
summary: Preview a bulk 정정 of scalar employee fields (MR-27)
description: >-
  Grid or 「필터와 일치하는 n명 모두」. Send either selection + changes (one set of values for every
  employee the server selection matches; status absent selects everyone but EXITED) or rows (each
  employee with its own values and optional expected_updated_at pin). Nothing is written and no row is
  locked. Every selected employee is returned in id order with outcome CHANGE, PENDING (a high-risk
  field goes to a second person), UNCHANGED (every value already recorded) or REFUSED with the failed
  precondition (stale_record, exit_date_needs_exit, employee_number_in_use, employee_merged,
  employee_correction_sole_holder_refused, a field's validation, ...), and the exact counts.
  preview_digest binds the commit; preview_id is the job id and the sole holder's step-up object.
  Needs employee_directory_manage org-wide.
security:
- bearerAuth: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/BulkEmployeeCorrectionRequest'
responses:
  '200':
    description: The preview.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/BulkEmployeeCorrectionPreview'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '409':
    description: A shared value names a field corrected elsewhere (employee_correction_unavailable).
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
  '422':
    description: Invalid request; bulk_selection_too_large carries error.refusals [{selected, max}].
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
