# SPDX-License-Identifier: LicenseRef-Proprietary
x-console-authz: {"permission": "EmployeeDirectoryRead", "scope": "hr"}
tags:
- employees
operationId: getPeopleDataHealth
summary: Tenant- and branch-scoped people data-health overview
description: Returns batched statutory register completeness, identity document coverage, workplace and department placement counts, boolean-only bank account readiness, identity review counts, failed lifecycle action counts, bounded zero-PII drilldown items, and EmployeeDirectoryManage-gated latest import status.
security:
- bearerAuth: []
parameters:
- name: category
  in: query
  required: false
  schema:
    type: string
    enum:
    - birth
    - job
    - hire
    - contractEnd
    - sex
    - address
    - career
    - rrn_missing
    - unplaced
    - department_missing
    - bank_account_missing
    - identity_review
    - failed_action
    - register_incomplete
  description: Filter drilldown items to employees missing the specified category.
- name: limit
  in: query
  required: false
  schema:
    type: integer
    minimum: 1
    maximum: 50
    default: 20
  description: Maximum number of drilldown items returned (1..=50).
responses:
  '200':
    description: People data-health metrics and bounded zero-PII drilldown items.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/PeopleDataHealthResponse'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '422':
    $ref: '#/components/responses/ValidationError'
