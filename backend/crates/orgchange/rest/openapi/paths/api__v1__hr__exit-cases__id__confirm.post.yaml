tags:
  - hr
operationId: confirmEmployeeExitCase
summary: Confirm an employee exit case for HR/HQ review
description: >-
  HR requires an exit_reason_code from the case or body (422 exit_reason_required). A body code replaces
  the reported reason. Involuntary reasons are refused with 409 exit_protected_period when the statutory
  exit date (effective_exit_date + one day) is protected. Reasons marked notice_required also require
  written dismissal_notice delivery facts (422 notice_evidence_missing). HQ refuses both fields (422 validation).
  Scheduled exits recheck protection and notice before effect; refusals become APPLY_FAILED with the stable code.
  HR tier (hq_confirmation=false) moves REPORTED to HR_CONFIRMED and records the TERMINATE lifecycle event
  that exits the employee; it requires all four signoffs (422 lifecycle_signoff_required naming the first
  missing one). HQ tier (hq_confirmation=true) moves HR_CONFIRMED to HQ_CONFIRMED and must be a
  different actor than the HR confirmer (403). With a complete settlement_input an HQ-confirmed case becomes
  SETTLEMENT_READY. Any other starting state is 409 invalid_transition; see EmployeeExitCaseStatus. A case whose effective_exit_date is after today (KST) is confirmed ahead: the TERMINATE event is SCHEDULED (exit_event_state) and exits the employee on that date; rejection before then withdraws it (no EXIT_REVERSAL). Like any lifecycle event, the TERMINATE must leave the employee's later SCHEDULED events valid, which an exit never does: 409 lifecycle_schedule_conflict (error.refusals names each pending event) until they are cancelled.
  403 own_record_forbidden when the employee is the caller's own record (linked account, or the same person). Nobody records an HR act on their own record, whatever they hold; another holder in scope, or the ops account, records it. The ops account passes only when no other active account holds the act over the employee, and that pass is audited as authz.own_record.break_glass with review_required (people-self-33).
security:
- bearerAuth: []
parameters:
- name: id
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/ConfirmEmployeeExitCaseRequest'
responses:
  '200':
    description: Employee exit case after confirmation.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/EmployeeExitCase'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
  '409':
    description: Invalid transition, exit_protected_period naming protected periods, or lifecycle_schedule_conflict naming the employee's pending SCHEDULED events.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/LifecycleScheduleConflictBody'
  '422':
    $ref: '#/components/responses/ValidationError'
