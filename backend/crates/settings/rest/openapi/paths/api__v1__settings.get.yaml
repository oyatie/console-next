operationId: listSettings
summary: List permitted settings resolved now
description: Cedar settings::view permission at the requested tenant, legal entity or workplace exposes the registry,
  including definitions, effective values, sources and scheduled rows. Other active members receive only the client-required
  settings (idle timeout, approval policies, contract-warning and deadline-warning days, onboarding receipt duration and
  period-unlock duration) through settings_runtime_read. Monitoring, retention and sole-holder settings require settings::view.
tags:
- Settings
security:
- bearerAuth: []
parameters:
- name: entity
  in: query
  required: false
  description: Legal entity or workplace to resolve for; omitted = tenant-wide.
  schema:
    $ref: '#/components/schemas/Uuid'
responses:
  '200':
    description: Permitted keys, resolved at the requested scope.
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required: [items, can_change]
          properties:
            can_change:
              type: boolean
              description: Whether the caller can manage settings at the requested scope.
            items:
              type: array
              items:
                $ref: '#/components/schemas/SettingEntry'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '422':
    $ref: '#/components/responses/ValidationError'
  '503':
    $ref: '#/components/responses/ServiceUnavailable'
