operationId: changeSetting
summary: Change one setting
description: Appends an effective-dated override row. The value must be of the key's kind and inside its range; it is
  never back-dated; a loosening takes effect no earlier than 24 hours later unless the tenant is onboarding. Cedar
  decides who may change what (a loosening needs a fresh step-up).
tags:
- Settings
security:
- bearerAuth: []
parameters:
- name: dry_run
  in: query
  description: Validate and authorize without writing overrides or idempotency claims. Successful previews write no audit event; a 403 refusal is audited. Missing step-up is reported in the plan.
  schema:
    type: boolean
    default: false
- name: key
  in: path
  required: true
  schema:
    type: string
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/SettingChangeRequest'
responses:
  '200':
    description: Change plan; nothing written.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/SettingChangePlan'
  '201':
    description: Override recorded.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/SettingChange'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '409':
    description: setting_loosening_too_soon (error.earliest_effective_from), setting_effective_from_taken (write only),
      idempotency_key_reused, command_processing, command_applied or command_settled (write admission).
    content:
      application/json:
        schema:
          type: object
          required: [error]
          properties:
            error:
              type: object
              required: [code, message]
              properties:
                code:
                  type: string
                message:
                  type: string
                earliest_effective_from:
                  $ref: '#/components/schemas/Timestamp'
  '422':
    $ref: '#/components/responses/ValidationError'
  '503':
    $ref: '#/components/responses/ServiceUnavailable'
