# SPDX-License-Identifier: LicenseRef-Proprietary
x-console-authz: {"permissions": ["settings:view", "attendance:view"], "scope": "any"}
tags: [settings]
operationId: listOvertimeRuleAttestations
summary: List overtime recognition work-rule confirmations
description: Requires settings view or attendance view at the requested scope.
security:
  - bearerAuth: []
parameters:
  - in: query
    name: scope_entity_id
    required: false
    schema:
      $ref: '#/components/schemas/Uuid'
responses:
  '200':
    description: Recorded overtime rule confirmations
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required: [items, can_record]
          properties:
            can_record:
              type: boolean
              description: Whether the caller may record a work-rule confirmation for the requested scope.
            items:
              type: array
              items:
                $ref: '#/components/schemas/OvertimeRuleAttestation'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
