type: object
additionalProperties: false
required: [key, kind, default, looser_when, governance, legal_basis, value, version, effective_from, scheduled, source, chain]
properties:
  key:
    type: string
  kind:
    type: object
    required: [type]
    properties:
      type:
        type: string
        enum: [int, bool, code]
      unit:
        type: string
        enum: [business_days, days, hours, minutes, months, years, percent, mebibytes, count]
      min:
        type: integer
        format: int64
        nullable: true
      max:
        type: integer
        format: int64
        nullable: true
      allowed:
        type: array
        description: Allowed codes, strictest first.
        items:
          type: string
  default:
    allOf:
    - $ref: '#/components/schemas/SettingValue'
    nullable: true
    description: Null for a tenant fact, which has no default.
  looser_when:
    type: string
    enum: [higher, lower, neutral]
  governance:
    type: string
    enum: [tenant, fixed, platform_only, read_only]
  legal_basis:
    type: object
    nullable: true
    required: [authority, title, url]
    properties:
      authority:
        type: string
      title:
        type: string
      url:
        type: string
  value:
    allOf:
    - $ref: '#/components/schemas/SettingValue'
    nullable: true
    description: Null for a tenant fact not declared yet.
  version:
    description: '"code_default", or {"override": <row id>}; null when value is null.'
    nullable: true
    allOf: [{$ref: '#/components/schemas/SettingVersionId'}]
  effective_from:
    allOf:
    - $ref: '#/components/schemas/Timestamp'
    nullable: true
  scheduled:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, scope_entity_id, value, effective_from]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        scope_entity_id:
          allOf:
          - $ref: '#/components/schemas/Uuid'
          nullable: true
        value:
          $ref: '#/components/schemas/SettingValue'
        effective_from:
          $ref: '#/components/schemas/Timestamp'
  source:
    type: object
    additionalProperties: false
    required: [layer, scope_entity_id]
    properties:
      layer:
        type: string
        enum: [code_default, platform, tenant, legal_entity, workplace]
      scope_entity_id:
        allOf: [{$ref: '#/components/schemas/Uuid'}]
        nullable: true
  chain:
    type: array
    description: Most specific scope first, followed by tenant and code default; only in-force values.
    items:
      type: object
      additionalProperties: false
      required: [layer, scope_entity_id, value, effective_from, deciding]
      properties:
        layer:
          type: string
          enum: [code_default, platform, tenant, legal_entity, workplace]
        scope_entity_id:
          allOf: [{$ref: '#/components/schemas/Uuid'}]
          nullable: true
        value:
          allOf: [{$ref: '#/components/schemas/SettingValue'}]
          nullable: true
        effective_from:
          allOf: [{$ref: '#/components/schemas/Timestamp'}]
          nullable: true
        deciding:
          type: boolean
