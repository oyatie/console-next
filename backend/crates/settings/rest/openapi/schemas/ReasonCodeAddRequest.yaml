type: object
additionalProperties: false
required: [domain, label_ko, requires_note]
properties:
  domain:
    type: string
  label_ko:
    type: string
    minLength: 1
    maxLength: 60
  label_en:
    type: string
    nullable: true
    minLength: 1
    maxLength: 60
  requires_note:
    type: boolean
  involuntary:
    type: boolean
    default: false
    description: Only exit_reason may be involuntary. Invalid classes are 422 reason_class_invalid.
  notice_required:
    type: boolean
    default: false
    description: Only exit_reason; requires involuntary=true.
  sort:
    type: integer
    format: int32
    nullable: true
