type: object
additionalProperties: false
required: [source, domains, total, other, other_rate, codes]
properties:
  source:
    type: string
    description: The stored column, as table.column.
  domains:
    type: array
    items:
      type: string
  total:
    type: integer
    format: int64
  other:
    type: integer
    format: int64
  other_rate:
    type: number
    format: double
    nullable: true
    description: other / total; null when total is 0.
  codes:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [code, count]
      properties:
        code:
          type: string
        count:
          type: integer
          format: int64
