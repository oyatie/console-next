type: object
additionalProperties: false
required: [code, system, requires_note, involuntary, notice_required, active, label_ko, label_en]
properties:
  code:
    type: string
  system:
    type: boolean
    description: A code-defined system code (label from the frontend catalog) rather than a tenant code.
  requires_note:
    type: boolean
  involuntary:
    type: boolean
    description: Dismissal-like protected-period class, derived from the reason reference.
  notice_required:
    type: boolean
    description: Written dismissal notice required; implies involuntary.
  active:
    type: boolean
  label_ko:
    type: string
    nullable: true
    description: Tenant codes only.
  label_en:
    type: string
    nullable: true
