tags:
- finance-gl
operationId: listVouchers
summary: List general-ledger vouchers (tenant-scoped; optional branch/status filter)
security:
- bearerAuth: []
parameters:
- name: after
  in: query
  description: Cursor from the preceding X-Next-Cursor response header.
  schema: {type: string, format: uuid}
- name: branch_id
  in: query
  required: false
  schema:
    $ref: '#/components/schemas/Uuid'
- name: status
  in: query
  required: false
  schema:
    $ref: '#/components/schemas/VoucherStatus'
responses:
  '200':
    description: Vouchers visible to the caller.
    headers:
      X-Next-Cursor:
        description: Continuation cursor when more rows are available.
        schema: {type: string, format: uuid}
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '#/components/schemas/VoucherSummary'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
