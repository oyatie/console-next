tags:
- finance-gl
operationId: accountDrill
summary: Account drill — voucher lines for an account with voucher/source links
security:
- bearerAuth: []
parameters:
- name: after
  in: query
  description: Cursor from the preceding X-Next-Cursor response header.
  schema: {type: string, format: uuid}
- name: account_code
  in: path
  required: true
  schema:
    type: string
responses:
  '200':
    description: Account entries.
    headers:
      X-Next-Cursor:
        description: Continuation cursor when more rows are available.
        schema: {type: string, format: uuid}
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '#/components/schemas/AccountDrillEntry'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
