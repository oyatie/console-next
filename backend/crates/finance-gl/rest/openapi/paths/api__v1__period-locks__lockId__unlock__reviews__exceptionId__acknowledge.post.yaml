# SPDX-License-Identifier: LicenseRef-Proprietary
tags: [period-locks]
operationId: acknowledgePeriodUnlockReview
summary: Acknowledge a consumed sole-holder unlock exception
description: Cedar rechecks current close entitlement and requires an independent reviewer when available.
security:
- bearerAuth: []
parameters:
- name: lockId
  in: path
  required: true
  schema: { type: string, format: uuid }
- name: exceptionId
  in: path
  required: true
  schema: { type: string, format: uuid }
responses:
  '200':
    description: Review acknowledged; repeated acknowledgement returns the same receipt.
    content:
      application/json:
        schema:
          type: object
          required: [id, status]
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [REVIEWED] }
  '401':
    description: No session.
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
