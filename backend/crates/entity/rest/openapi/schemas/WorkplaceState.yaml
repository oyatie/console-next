type: object
required:
- version
- effective_from
- before_first_record
- name
- is_construction_site
- status
- change_mode
properties:
  version:
    type: integer
  effective_from:
    type: string
    format: date
  before_first_record:
    type: boolean
    description: Today is before the first record takes effect (e.g. before the opening date); this is that first record.
  name:
    type: string
  same_address_as_registration:
    type: boolean
    description: The address follows the linked registration at the requested read point. Absent on older servers.
  address:
    anyOf:
    - $ref: '#/components/schemas/KrAddress'
    - type: 'null'
  mail_address:
    anyOf:
    - $ref: '#/components/schemas/KrAddress'
    - type: 'null'
  opened_on:
    type:
    - string
    - 'null'
    format: date
  representative_name:
    type:
    - string
    - 'null'
  main_product:
    type:
    - string
    - 'null'
  phone:
    anyOf:
    - $ref: '#/components/schemas/FormattedValue'
    - type: 'null'
  fax:
    anyOf:
    - $ref: '#/components/schemas/FormattedValue'
    - type: 'null'
  mobile:
    anyOf:
    - $ref: '#/components/schemas/FormattedValue'
    - type: 'null'
  email:
    type:
    - string
    - 'null'
  is_construction_site:
    type: boolean
  is_abstract:
    type: boolean
  not_registered_reason:
    anyOf:
    - $ref: '#/components/schemas/CodeRef'
    - type: 'null'
  status:
    $ref: '#/components/schemas/OperatingStatus'
  status_since:
    type:
    - string
    - 'null'
    format: date
  status_until:
    description: The business suspension's expected end as reported (SUSPENDED only; a plan, not a clock).
    type:
    - string
    - 'null'
    format: date
  withholding_mode:
    anyOf:
    - $ref: '#/components/schemas/WithholdingMode'
    - type: 'null'
  bulk_filed_on:
    type:
    - string
    - 'null'
    format: date
  independent_lsa_unit:
    type:
    - boolean
    - 'null'
  independent_lsa_evidence:
    type:
    - string
    - 'null'
    maxLength: 500
    description: Why this workplace is its own Labor Standards Act unit; required while independent_lsa_unit is true, so a revise resends it.
  change_mode:
    $ref: '#/components/schemas/EntityChangeMode'
