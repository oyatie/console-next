type: object
required:
- id
- kind
- undoes
- undone_by
- undoable
- units
- actor_id
- created_at
properties:
  id:
    type: string
    format: uuid
  kind:
    type: string
    enum:
    - APPLY
    - UNDO
  undoes:
    type:
    - string
    - 'null'
    format: uuid
  undone_by:
    type:
    - string
    - 'null'
    format: uuid
  undoable:
    type: boolean
  units:
    type: array
    items:
      $ref: '#/components/schemas/OrgSetupUnit'
  actor_id:
    type: string
    format: uuid
  actor_name:
    type:
    - string
    - 'null'
  actions:
    type: array
    items:
      type: string
    description: Canonical audit actions recorded by this batch.
  unit_names:
    type: array
    items:
      type: string
    description: Unit names at the revisions written by this batch.
  change_mode:
    type:
    - string
    - 'null'
  created_at:
    type: string
    format: date-time
