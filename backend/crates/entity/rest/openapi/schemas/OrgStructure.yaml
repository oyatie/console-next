type: object
description: All → legal entity → workplace → department (one department kind, any depth; decision 18).
required:
- tenant_name
- phase
- entities
- unplaced
properties:
  tenant_name:
    type: string
  phase:
    type: string
    enum:
    - SETUP
    - OPERATING
  entities:
    type: array
    items:
      $ref: '#/components/schemas/OrgStructureNode'
  unplaced:
    type: array
    items:
      $ref: '#/components/schemas/OrgStructureNode'
  entity_unknown_headcount:
    type: integer
    format: int64
    description: '"Legal entity not set": people who have not left and have no legal entity today. Only for a tenant-wide caller; absent
      for a scoped one.'
  as_of:
    type: string
    format: date
  known_at:
    type: string
    nullable: true
  read_only:
    type: boolean
