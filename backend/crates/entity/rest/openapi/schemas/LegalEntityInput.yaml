type: object
description: Create (or the full state of a revision of) a 법인 / 개인사업자. CORPORATION also requires crn and head_office_address.
required:
- biz_kind
- name
- representation_mode
- representatives
properties:
  english_name:
    type: [string, 'null']
    maxLength: 200
    description: Optional 영문명 - Latin letters, digits, spaces and & . , - ' ( ) only (english_name_not_latin). Omitted keeps it; null clears it.
  biz_kind:
    $ref: '#/components/schemas/EntityBizKind'
  name:
    type: string
    maxLength: 200
    description: 법인명 / 상호 as printed.
  display_name:
    type:
    - string
    - 'null'
    maxLength: 40
  representation_mode:
    $ref: '#/components/schemas/EntityRepresentationMode'
  representatives:
    type: array
    items:
      type: string
      maxLength: 100
  additional_representatives:
    type: integer
    minimum: 0
    maximum: 50
    description: Printed as 외 n명.
  crn:
    type:
    - string
    - 'null'
    pattern: ^[0-9]{6}-?[0-9]{7}$
    x-console-format: crn
    description: 법인등록번호.
  head_office_address:
    anyOf:
    - $ref: '#/components/schemas/KrAddress'
    - type: 'null'
  incorporated_on:
    type:
    - string
    - 'null'
    format: date
  fiscal_year_end_month:
    type:
    - integer
    - 'null'
    minimum: 1
    maximum: 12
  capital_won:
    type:
    - integer
    - 'null'
    format: int64
    minimum: 0
  directors:
    type:
    - array
    - 'null'
    items:
      $ref: '#/components/schemas/EntityDirectorInput'
    description: 임원 in printed order. Omitted or null on a revise keeps the current ones; [] removes them all.
  vat_unit_mode:
    anyOf:
    - $ref: '#/components/schemas/VatUnitMode'
    - type: 'null'
    description: Asked only once two registrations exist; derived otherwise.
  main_ksic:
    anyOf:
    - $ref: '#/components/schemas/CodeInput'
    - type: 'null'
  main_phone:
    type:
    - string
    - 'null'
    x-console-format: phone_kr
    description: Phone; Korean domestic or +E.164 in, E.164 stored.
  priority_support:
    anyOf:
    - $ref: '#/components/schemas/PrioritySupport'
    - type: 'null'
  priority_support_basis:
    anyOf:
    - $ref: '#/components/schemas/PrioritySupportBasis'
    - type: 'null'
  large_group_member:
    type:
    - boolean
    - 'null'
  founding:
    type:
    - boolean
    - 'null'
    description: 설립 중 (create only; a 법인사업자 before its 설립등기, so with no 법인등록번호 yet). On a revise the record decides it; entering the 법인등록번호 ends it.
  opened_on:
    type:
    - string
    - 'null'
    format: date
    description: 개업연월일 of the 사업자등록증 typed with it (create only); the record's first revision starts there when no 설립일 (incorporated_on) is known.
