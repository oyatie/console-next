type: object
description: Create (or the full state of a revision of) a corporation / sole proprietor. CORPORATION also requires crn and head_office_address.
required:
- biz_kind
- name
- representation_mode
- representatives
properties:
  english_name:
    type: [string, 'null']
    maxLength: 200
    description: Optional English name - Latin letters, digits, spaces and & . , - ' ( ) only (english_name_not_latin). Omitted keeps it; null clears it.
  biz_kind:
    $ref: '#/components/schemas/EntityBizKind'
  name:
    type: string
    maxLength: 200
    description: Legal entity name / trade name as printed.
  display_name:
    type:
    - string
    - 'null'
    maxLength: 40
  representation_mode:
    $ref: '#/components/schemas/EntityRepresentationMode'
  representatives:
    type: array
    items:
      type: string
      maxLength: 100
  additional_representatives:
    type: integer
    minimum: 0
    maximum: 50
    description: Printed as "and n others".
  crn:
    type:
    - string
    - 'null'
    pattern: ^[0-9]{6}-?[0-9]{7}$
    x-console-format: crn
    description: Corporate registration number.
  head_office_address:
    anyOf:
    - $ref: '#/components/schemas/KrAddress'
    - type: 'null'
  incorporated_on:
    type:
    - string
    - 'null'
    format: date
  fiscal_year_end_month:
    type:
    - integer
    - 'null'
    minimum: 1
    maximum: 12
  capital_won:
    type:
    - integer
    - 'null'
    format: int64
    minimum: 0
  directors:
    type:
    - array
    - 'null'
    items:
      $ref: '#/components/schemas/EntityDirectorInput'
    description: Executives in printed order. Omitted or null on a revise keeps the current ones; [] removes them all.
  vat_unit_mode:
    anyOf:
    - $ref: '#/components/schemas/VatUnitMode'
    - type: 'null'
    description: Asked only once two registrations exist; derived otherwise.
  main_ksic:
    anyOf:
    - $ref: '#/components/schemas/CodeInput'
    - type: 'null'
  main_phone:
    type:
    - string
    - 'null'
    x-console-format: phone_kr
    description: Phone; Korean domestic or +E.164 in, E.164 stored.
  priority_support:
    anyOf:
    - $ref: '#/components/schemas/PrioritySupport'
    - type: 'null'
  priority_support_basis:
    anyOf:
    - $ref: '#/components/schemas/PrioritySupportBasis'
    - type: 'null'
  large_group_member:
    type:
    - boolean
    - 'null'
  founding:
    type:
    - boolean
    - 'null'
    description: Being incorporated (create only; a corporate business before its incorporation registration, so with no corporate registration number yet). On a revise the record decides it; entering the corporate registration number ends it.
  opened_on:
    type:
    - string
    - 'null'
    format: date
    description: Business start date of the business registration certificate typed with it (create only); the record's first revision starts there when no incorporation date (incorporated_on) is known.
