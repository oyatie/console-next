type: object
description: One of workplace_id or parent_org_unit_id.
required:
- name
properties:
  name:
    type: string
    maxLength: 120
  kind:
    type: string
    deprecated: true
    description: Retired (decision 18, one department kind); accepted and ignored.
    enum:
    - DEPARTMENT
    - TEAM
  workplace_id:
    type:
    - string
    - 'null'
    format: uuid
    description: The workplace the department sits in directly.
  parent_org_unit_id:
    type:
    - string
    - 'null'
    format: uuid
    description: The department (or workplace unit) it sits under.
