type: object
required:
- ops
properties:
  dry_run:
    type: boolean
    default: false
  preview_digest:
    type: string
    description: The apply's binding to its dry run (required unless dry_run).
  effective_from:
    type: string
    format: date
    description: Default for REVISE ops without their own.
  reason_code:
    type: string
    description: Default for REVISE ops without their own.
  ops:
    type: array
    minItems: 1
    maxItems: 1000
    items:
      $ref: '#/components/schemas/EntitySetupOp'
