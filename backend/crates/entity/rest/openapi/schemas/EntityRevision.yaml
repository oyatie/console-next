type: object
required:
- version
- effective_from
- recorded_at
- change_mode
- changes
properties:
  actor_kind: {oneOf: [{$ref: '#/components/schemas/ActorKind'}, {type: 'null'}]}
  command_id: {type: [string, 'null'], format: uuid}
  version:
    type: integer
  effective_from:
    type: string
    format: date
  recorded_at:
    type: string
    format: date-time
  actor_name:
    type:
    - string
    - 'null'
  change_mode:
    type: string
    enum:
    - SETUP
    - GOVERNED
    - SOLE_HOLDER
    - MIGRATION
  reason_code:
    type:
    - string
    - 'null'
  changes:
    type: array
    items:
      $ref: '#/components/schemas/EntityFieldChange'
  evidence_document_id:
    type:
    - string
    - 'null'
    format: uuid
    description: The kept 사업자등록증 a registration revision was recorded from (등록증 재발급·정정); null
      otherwise.
