type: object
required:
- is_main
- sector
- item
properties:
  is_main:
    type: boolean
  sector:
    type: string
    maxLength: 100
    description: Business type as printed
  item:
    type: string
    maxLength: 200
    description: Business item as printed
  nts_code:
    type:
    - string
    - 'null'
    pattern: ^[0-9]{6}$
  ksic:
    anyOf:
    - $ref: '#/components/schemas/CodeInput'
    - type: 'null'
