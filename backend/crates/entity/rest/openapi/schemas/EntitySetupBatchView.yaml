type: object
required:
- id
- kind
- change_mode
- records
- created_at
- undoable
properties:
  id:
    type: string
    format: uuid
    description: Batch id, or the accepted command id when registration_action is present.
  kind:
    type: string
    enum:
    - APPLY
    - UNDO
  undoes:
    type:
    - string
    - 'null'
    format: uuid
  undone_by:
    type:
    - string
    - 'null'
    format: uuid
  change_mode:
    type: string
  records:
    type: integer
  created_at:
    type: string
    format: date-time
  undoable:
    type: boolean
  actor_id:
    type:
    - string
    - 'null'
    format: uuid
  actor_name:
    type:
    - string
    - 'null'
  actions:
    type: array
    items:
      type: string
    description: Operations recorded in the batch receipt.
  target_names:
    type: array
    items:
      type: string
    description: Names at the revisions recorded by the receipt.
  registration_action:
    type:
    - string
    - 'null'
    description: Direct registration command action; such receipts cannot be undone as batches.
