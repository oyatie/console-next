type: object
description: Where the workplace's withholding tax is filed, derived from Income Tax Act §7①3·4 with its basis.
required:
- kind
properties:
  kind:
    type: string
    enum:
    - SELF_UNIT
    - WORKPLACE
    - ENTITY_HEAD_OFFICE
    - UNDECIDED
  workplace_id:
    type: string
    format: uuid
    description: WORKPLACE only.
  basis:
    type: string
    description: Statutory basis code, e.g. income_tax_act_7_1_3.
  remedy:
    type: string
    description: 'UNDECIDED only: the fix.'
