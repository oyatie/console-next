type: object
required:
- ops
properties:
  ops:
    type: array
    minItems: 1
    maxItems: 1000
    items:
      $ref: '#/components/schemas/OrgSetupOp'
  effective_date:
    type: string
    format: date
    description: >-
      The day every change of the batch takes effect; today (KST) when absent. Refused on effective_date, nothing
      written: org_setup_date_future (setup applies at once; a change that waits for its day is an org change),
      org_setup_date_before_parent (a unit dated before the first record of the unit or 사업장 it goes under),
      org_setup_date_before_current (a change dated before the unit's current record).
