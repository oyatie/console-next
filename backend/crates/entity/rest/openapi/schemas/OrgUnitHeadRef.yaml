type: object
description: A department's head as of today (dated; may belong to another unit).
required:
- employee_id
- name
- since
- concurrent
properties:
  employee_id:
    type: string
    format: uuid
  name:
    type:
    - string
    - 'null'
  since:
    type:
    - string
    - 'null'
    format: date
  concurrent:
    type: boolean
    description: The "(concurrent)" marker — the head belongs to another unit, or heads another unit too.
