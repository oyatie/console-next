type: object
required:
- kind
- id
- name
- headcount
- direct_headcount
- dispatched_headcount
- chips
- children
properties:
  kind:
    type: string
    enum:
    - LEGAL_ENTITY
    - WORKPLACE
    - SITE
    - DEPARTMENT
  id:
    type: string
    format: uuid
  name:
    type: string
  version:
    type: integer
    format: int64
    description: 'SITE/DEPARTMENT: the current version, sent back as expected_version.'
  org_unit_id:
    type: string
    format: uuid
    description: 'WORKPLACE: the workplace''s own unit (register people there with no department).'
  workplace_kind:
    type: string
    description: 'WORKPLACE: its kind code (decisions #18), when chosen.'
  code:
    type: string
    description: 'WORKPLACE: its workplace code; DEPARTMENT: its department code — when set.'
  head:
    $ref: '#/components/schemas/OrgUnitHeadRef'
  headcount:
    type: integer
    format: int64
    description: 'Headcount: people who have not left, everything below included. LEGAL_ENTITY includes its unplaced (direct_headcount)
      since this field was added; WORKPLACE and LEGAL_ENTITY count today''s assignments, SITE and DEPARTMENT count
      members.'
  direct_headcount:
    type: integer
    format: int64
    description: 'People on this node and on no child: DEPARTMENT its own members, WORKPLACE directly under the workplace (its own unit),
      LEGAL_ENTITY unplaced (a legal entity but no workplace).'
  dispatched_headcount:
    type: integer
    format: int64
    description: Of headcount, people employed as DISPATCHED_IN or OUTSOURCED_ON_SITE (the "n dispatched · partner included" chip).
  chips:
    type: array
    items:
      type: string
      enum:
      - needs_confirmation
      - suspended
      - closed
      - registration_missing
      - unverified
  children:
    type: array
    description: 'In order: display order first (PUT /api/v1/org-structure/order), then name (departments) or creation (workplaces).'
    items:
      $ref: '#/components/schemas/OrgStructureNode'
  scheduled_by:
    $ref: '#/components/schemas/StructureScheduledBy'
  changed_after:
    type: boolean
