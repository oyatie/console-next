allOf:
- $ref: '#/components/schemas/RegistrationInput'
- type: object
  properties:
    document_id:
      type:
      - string
      - 'null'
      format: uuid
      description: The kept 사업자등록증 this registration is typed from, attached in the same transaction and named
        as the first revision's evidence (422 document_not_found, document_not_certificate,
        document_attached_elsewhere, document_not_new).
    check_preview:
      type: object
      required: [command_id, acknowledged]
      properties:
        command_id:
          type: string
          format: uuid
        acknowledged:
          type: boolean
        status_since:
          type: [string, 'null']
