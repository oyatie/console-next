type: object
description: Number of regular workers (Enforcement Decree of the Labor Standards Act §7-2). Derived, never typed; HOLD until a labor attorney releases the method
  (BW-35), so no value is shown, only the live roster count.
required:
- status
- basis
- missing
- live_headcount
properties:
  status:
    type: string
    enum:
    - HOLD
  value:
    type:
    - integer
    - 'null'
  basis:
    type: string
    enum:
    - LSA_DECREE_7_2
  missing:
    type: array
    items:
      type: string
      enum:
      - labor_attorney_review
      - statutory_rule_rows
      - operating_day_calendar
  live_headcount:
    type: integer
    format: int64
