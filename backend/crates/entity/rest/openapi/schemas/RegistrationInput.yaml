type: object
description: One business registration certificate. brn, or brn_pending_reason when the number is not issued yet.
required:
- opened_on
- business_address
- business_types
- unit_taxation
- tax_office_label
- tax_type
properties:
  trade_name:
    type: [string, 'null']
    maxLength: 200
    description: 'Sole proprietor: the trade name printed in item ① of the business registration certificate; ignored for a corporation. Absent on create defaults to the entity name; absent on revise preserves the stored value.'
  classification_reason:
    type: [string, 'null']
    maxLength: 1000
    description: Explicit exception reason for registration classification or primary head-office requirement.
  brn:
    type:
    - string
    - 'null'
    pattern: ^[0-9]{3}-?[0-9]{2}-?[0-9]{5}$
    x-console-format: brn
    description: Business registration number; formatted or digits in, canonical digits out.
  brn_pending_reason:
    anyOf:
    - $ref: '#/components/schemas/BrnPendingReason'
    - type: 'null'
  opened_on:
    type: string
    format: date
  business_address:
    $ref: '#/components/schemas/KrAddress'
  business_types:
    type: array
    items:
      $ref: '#/components/schemas/EntityBusinessTypeInput'
  production_factor:
    type:
    - string
    - 'null'
  issue_reason_kind:
    anyOf:
    - $ref: '#/components/schemas/EntityIssueReasonKind'
    - type: 'null'
  issue_reason_sub:
    anyOf:
    - $ref: '#/components/schemas/EntityCorrectionReason'
    - type: 'null'
  issue_reason_as_printed:
    type:
    - string
    - 'null'
  co_owners:
    type: array
    items:
      type: string
      maxLength: 100
  liquor_license_no:
    type:
    - string
    - 'null'
  unit_taxation:
    type: boolean
    description: Whether the business applies business-unit taxation (⑩); no default.
  e_invoice_email:
    type:
    - string
    - 'null'
    format: email
    maxLength: 254
  cert_issued_on:
    type:
    - string
    - 'null'
    format: date
  tax_office_code:
    type:
    - string
    - 'null'
  tax_office_label:
    type: string
    maxLength: 60
  tax_type:
    $ref: '#/components/schemas/NtsTaxType'
