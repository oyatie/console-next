type: object
required:
- version
- effective_from
- before_first_record
- trade_name
- business_types
- status
- change_mode
properties:
  classification_reason:
    type: [string, 'null']
    maxLength: 1000
    description: Explicit exception reason for registration classification or primary head-office requirement.
  version:
    type: integer
  effective_from:
    type: string
    format: date
  before_first_record:
    type: boolean
    description: Today is before the first record takes effect (e.g. before 개설일); this is that first record.
  trade_name:
    type: string
    readOnly: true
    description: "INDIVIDUAL: the certificate's own 상호; otherwise the entity's 법인명 (derived). Legacy NULL falls back to the entity name."
  opened_on:
    type:
    - string
    - 'null'
    format: date
  business_address:
    anyOf:
    - $ref: '#/components/schemas/KrAddress'
    - type: 'null'
  business_types:
    type: array
    items:
      $ref: '#/components/schemas/EntityBusinessType'
  unit_taxation:
    type:
    - boolean
    - 'null'
  tax_type:
    anyOf:
    - $ref: '#/components/schemas/NtsTaxType'
    - type: 'null'
  tax_office_code:
    type:
    - string
    - 'null'
  tax_office_label:
    type:
    - string
    - 'null'
  issue_reason_kind:
    type:
    - string
    - 'null'
  issue_reason_sub:
    type:
    - string
    - 'null'
  issue_reason_as_printed:
    type:
    - string
    - 'null'
  cert_issued_on:
    type:
    - string
    - 'null'
    format: date
  e_invoice_email:
    type:
    - string
    - 'null'
  liquor_license_no:
    type:
    - string
    - 'null'
  production_factor:
    type:
    - string
    - 'null'
  co_owners:
    type:
    - array
    - 'null'
    items:
      type: string
  status:
    $ref: '#/components/schemas/OperatingStatus'
  status_since:
    type:
    - string
    - 'null'
    format: date
  status_until:
    description: 휴업's expected end as reported (SUSPENDED only; a plan, not a clock).
    type:
    - string
    - 'null'
    format: date
  change_mode:
    $ref: '#/components/schemas/EntityChangeMode'
