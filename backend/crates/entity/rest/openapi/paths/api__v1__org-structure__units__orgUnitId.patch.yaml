tags:
- entity
operationId: renameSetupOrgUnit
summary: Rename and/or move a 부서 during setup
description: A batch of one or two ops (undoable by its batch_id). A move to another 사업장 corrects its people's
  사업장 placement too. Send expected_version from the tree; stale is 409 stale_revision.
security:
- bearerAuth: []
parameters:
- name: Idempotency-Key
  in: header
  required: true
  description: A UUID per user intent. A retry with the same key and request replays the first result; the same
    key with another request is 409 idempotency_key_reused.
  schema:
    type: string
    format: uuid
- name: orgUnitId
  in: path
  required: true
  schema:
    type: string
    format: uuid
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/RenameSetupOrgUnitRequest'
responses:
  '200':
    description: Changed.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/SetupOrgUnitResult'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    description: Not permitted.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
  '422':
    description: 'Field issues: errors[{field, code}].'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
  '409':
    description: Refused with a stable code and reasons[] naming the remedy (e.g. phase_not_setup → submit_org_change).
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
  '404':
    description: Not found in this tenant.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
