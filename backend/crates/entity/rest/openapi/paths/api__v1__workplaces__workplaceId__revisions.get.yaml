tags:
- entity
operationId: listWorkplaceRevisions
summary: Dated history of a workplace and its four-social-insurance relations (fields insurance.<INSURER>.<field>)
security:
- bearerAuth: []
parameters:
- name: workplaceId
  in: path
  required: true
  schema:
    type: string
    format: uuid
responses:
  '200':
    description: Revisions, newest first; restricted names (representative, executives, joint business operators) and their changes only for callers who may change them.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/EntityRevisionList'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    description: Not permitted.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
  '404':
    description: Not found in this tenant.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
