tags:
- entity
operationId: setOrgUnitDetails
summary: Set a 부서's 부서장 and 부서 코드 now (either phase)
description: CRUD. The full new values (null clears). After 운영 시작 applied directly and recorded GOVERNED while approval.policy.org_structure
  is none; under route 409 org_change_routed (submit an org change). Audited org_unit.setup_details.
security:
- bearerAuth: []
parameters:
- name: Idempotency-Key
  in: header
  required: true
  description: A UUID per user intent. A retry with the same key and request replays the first result; the same
    key with another request is 409 idempotency_key_reused.
  schema:
    type: string
    format: uuid
- name: orgUnitId
  in: path
  required: true
  schema:
    type: string
    format: uuid
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/OrgUnitDetailsRequest'
responses:
  '200':
    description: Applied.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/SetupOrgUnitResult'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    description: Cedar org_unit_manage denies (a tenant-wide org_change_apply holder is allowed).
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
  '404':
    description: Not found in this tenant.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
  '409':
    description: stale_revision, site_is_a_workplace, org_change_routed, org_unit_change_open; reasons[] names the remedy.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
  '422':
    description: 'Field issues: errors[{field, code}].'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
