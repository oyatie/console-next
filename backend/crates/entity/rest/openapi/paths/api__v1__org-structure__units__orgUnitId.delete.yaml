tags:
- entity
operationId: dissolveSetupOrgUnit
summary: Dissolve a 부서 and the 부서 under it during setup
description: Refused (org_unit_has_members, remedy move_people_first) while anyone who has not left is placed in
  it or under it. Undoable by its batch_id.
security:
- bearerAuth: []
parameters:
- name: Idempotency-Key
  in: header
  required: true
  description: A UUID per user intent. A retry with the same key and request replays the first result; the same
    key with another request is 409 idempotency_key_reused.
  schema:
    type: string
    format: uuid
- name: orgUnitId
  in: path
  required: true
  schema:
    type: string
    format: uuid
- name: expected_version
  in: query
  required: false
  description: The version read from the tree; stale is 409 stale_revision.
  schema:
    type: integer
    format: int32
    minimum: 1
responses:
  '200':
    description: Dissolved.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/SetupOrgUnitResult'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    description: Not permitted.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
  '409':
    description: Refused with a stable code and reasons[] naming the remedy (e.g. phase_not_setup → submit_org_change).
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
  '404':
    description: Not found in this tenant.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
  '503':
    description: Org-unit writes are not wired.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
