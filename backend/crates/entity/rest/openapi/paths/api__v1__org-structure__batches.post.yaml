tags:
- entity
operationId: applyOrgSetupBatch
summary: Create, rename, move and dissolve 부서 in one transaction during setup
description: SETUP only (after 운영 시작 phase_not_setup with remedy submit_org_change). One 부서 kind (decision
  18) — the level follows from the parent. Every op on an existing unit carries expected_version; a stale one
  is 409 stale_revision naming the op (errors[].field = ops[i].expected_version) and nothing is applied. A move
  to another 사업장 corrects its people's 사업장 placement too. The receipt's batch_id can be undone.
security:
- bearerAuth: []
parameters:
- name: Idempotency-Key
  in: header
  required: true
  description: A UUID per user intent. A retry with the same key and request replays the first result; the same
    key with another request is 409 idempotency_key_reused.
  schema:
    type: string
    format: uuid
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/OrgSetupBatchRequest'
responses:
  '201':
    description: Applied.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/OrgSetupReceipt'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    description: Not permitted.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
  '422':
    description: 'Field issues: errors[{field, code}].'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
  '409':
    description: 'Per-op refusals name the op in errors[].field (ops[i].…): stale_revision (current_version set), org_unit_has_members, site_is_a_workplace, phase_not_setup → submit_org_change.'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
  '404':
    description: Not found in this tenant.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
  '503':
    description: Org-unit writes are not wired.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
