tags:
- entity
operationId: getEntityDocumentContent
summary: The kept original's bytes (entity administrators only; every read is audited; private, no-store)
security:
- bearerAuth: []
parameters:
- name: id
  in: path
  required: true
  schema:
    type: string
    format: uuid
responses:
  '200':
    description: The original as uploaded.
    headers:
      Cache-Control:
        schema:
          type: string
          enum:
          - private, no-store
    content:
      application/pdf:
        schema:
          type: string
          format: binary
      image/jpeg:
        schema:
          type: string
          format: binary
      image/png:
        schema:
          type: string
          format: binary
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    description: Not permitted.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
  '404':
    description: Not found in this tenant.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
