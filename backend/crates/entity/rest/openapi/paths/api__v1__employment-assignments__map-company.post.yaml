tags:
- entity
operationId: mapCompanyText
summary: Map every unmapped employee with one company text
security:
- bearerAuth: []
parameters:
- name: Idempotency-Key
  in: header
  required: true
  description: A UUID per user intent. A retry with the same key and request replays the first result; the same
    key with another request is 409 idempotency_key_reused.
  schema:
    type: string
    format: uuid
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/MapCompanyRequest'
responses:
  '200':
    description: How many were mapped.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/MapCompanyResult'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    description: Not permitted.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
  '422':
    description: 'Field issues: errors[{field, code}].'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
  '409':
    description: Refused with a stable code and reasons[] naming the remedy (e.g. phase_not_setup → submit_org_change).
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
