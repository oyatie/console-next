# SPDX-License-Identifier: LicenseRef-Proprietary
tags: [entity]
operationId: listEntityIdentifierCorrections
summary: Read the identifier-correction register and its proposed evidence
security:
- bearerAuth: []
parameters:
- name: awaiting
  in: query
  description: Return only work this viewer can decide, apply, or review; uses the decision route's eligibility facts.
  schema: { type: string, enum: [me] }
- name: entity_id
  in: query
  schema: { type: string, format: uuid }
- name: offset
  in: query
  schema: { type: integer, format: int64, minimum: 0, default: 0 }
responses:
  '200':
    description: Correction cases ordered by post-review due date, then newest creation and ID; status and permissions are projected at read time.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/IdentifierCorrectionCasePage'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    description: Organization-wide entity or structure management access required.
  '404':
    description: No correction in this tenant matches the ID.
