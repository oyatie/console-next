tags:
- entity
operationId: getEntityDocument
summary: One kept document's record (no bytes)
security:
- bearerAuth: []
parameters:
- name: id
  in: path
  required: true
  schema:
    type: string
    format: uuid
responses:
  '200':
    description: The document.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/EntityDocument'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    description: Not permitted.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
  '404':
    description: Not found in this tenant.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
