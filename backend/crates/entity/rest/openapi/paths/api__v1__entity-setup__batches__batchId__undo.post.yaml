tags:
- entity
operationId: undoEntitySetupBatch
summary: Undo a bulk 법인 · 사업장 batch during SETUP (voids what it created, restores what it revised) (MR-29)
security:
- bearerAuth: []
parameters:
- name: Idempotency-Key
  in: header
  required: true
  description: A UUID per user intent. A retry with the same key replays the undo receipt.
  schema:
    type: string
    format: uuid
- name: batchId
  in: path
  required: true
  schema:
    type: string
    format: uuid
responses:
  '200':
    description: The UNDO receipt.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/EntitySetupBatchView'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    description: Not permitted (legal_entity_manage on every record of the batch).
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
  '404':
    description: entity_setup_batch_not_found.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
  '409':
    description: 'phase_not_setup, batch_not_undoable, batch_already_undone, undo_conflict (remedy
      undo_later_batches_first: a record or a 대표 / 본점 role changed after the batch), or record_in_use.'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
