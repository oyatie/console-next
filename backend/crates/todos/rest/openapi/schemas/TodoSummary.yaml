type: object
required:
- id
- owner_user_id
- text
- scopes
- links
- done
- created_at
- updated_at
- done_at
properties:
  id:
    $ref: '#/components/schemas/Uuid'
  owner_user_id:
    $ref: '#/components/schemas/Uuid'
  text:
    type: string
  scopes:
    type: array
    items:
      $ref: '#/components/schemas/TodoRef'
  links:
    type: array
    items:
      $ref: '#/components/schemas/TodoRef'
  done:
    type: boolean
  created_at:
    $ref: '#/components/schemas/Timestamp'
  updated_at:
    $ref: '#/components/schemas/Timestamp'
  done_at:
    type:
    - string
    - 'null'
    format: date-time
    description: When the todo was first marked done; null while open.
  assigned_by_user_id:
    $ref: '#/components/schemas/Uuid'
    description: The account that asked for this todo. Absent on the owner's own todo, as are due_on, returned_at and return_note.
  due_on:
    type: string
    format: date
    description: The day the requester asked for.
  returned_at:
    $ref: '#/components/schemas/Timestamp'
    description: When the owner sent the request back.
  return_note:
    type: string
    description: The line the owner wrote when sending it back.
