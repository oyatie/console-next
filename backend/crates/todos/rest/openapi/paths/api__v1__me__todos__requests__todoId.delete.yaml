# SPDX-License-Identifier: LicenseRef-Proprietary
tags:
  - me
operationId: withdrawMyTodoRequest
summary: Withdraw an open request the caller made
description: >-
  Deletes the request and its text. 404 when the id is not a request the
  caller made; 409 todo_closed once it is done or returned. Afterwards the
  assignee's done or return on it is a 404. Audited as todo.withdraw.
security:
- bearerAuth: []
parameters:
- name: todoId
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
responses:
  '204':
    description: The request was withdrawn.
  '401':
    $ref: '#/components/responses/Unauthorized'
  '404':
    $ref: '#/components/responses/NotFound'
  '409':
    $ref: '#/components/responses/Conflict'
  '503':
    description: JWT verification is not configured.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
