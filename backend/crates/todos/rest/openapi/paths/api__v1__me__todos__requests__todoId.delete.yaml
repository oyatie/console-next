# SPDX-License-Identifier: LicenseRef-Proprietary
tags:
  - me
operationId: withdrawMyTodoRequest
summary: Withdraw a request the caller made, or clear one sent back
description: >-
  Deletes the request, open or sent back, with its text and return note.
  Saved outcomes of earlier calls that returned it, the ask among them, are
  kept for the command-outcome retention period, as for any deleted todo, and
  a retry of such a call does not show it again. 404 when the id is not a
  request the caller made; 409 todo_closed once it is done. Afterwards the
  assignee's done or return on it is a 404. Audited as todo.withdraw.
security:
- bearerAuth: []
parameters:
- name: todoId
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
responses:
  '204':
    description: The request was withdrawn or cleared.
  '401':
    $ref: '#/components/responses/Unauthorized'
  '404':
    $ref: '#/components/responses/NotFound'
  '409':
    $ref: '#/components/responses/Conflict'
  '503':
    description: JWT verification is not configured.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
