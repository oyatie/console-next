x-console-authz: {"permission": "pay:edit", "scope": "tenant"}
tags:
- payroll
operationId: getEmployeePayslipDraft
summary: Payslip draft with the four social insurances for one employee and period (audited read)
description: >
  Read-only. Computes National Pension, National Health Insurance, long-term care and Employment Insurance from the contract
  wage in force on `payDate`. Every figure carries its instrument, article
  and effective date.


  The period's real attendance is read and GATES the draft; it drives no
  figure. Nothing here is prorated by attendance. Recorded working days
  short of the period's working days — including zero attendance records — or a
  CLOCK_IN count that does not match its CLOCK_OUT count adds
  `ATTENDANCE_INCOMPLETE` (with the counts) to `blockers[]` and forces
  `issuable: false`. A draft must not read as a full month on a month
  nobody evidenced.


  ASSERTS NO LEGAL COMPLIANCE. Withholding (income tax and local income tax) is deliberately
  NOT computed: `not_computed[]` names Annex 2 of the Enforcement Decree of the Income Tax Act as the
  instrument that would supply it, `net_pay_won` is null, and `issuable` is
  false. A deduction this engine did not compute is never emitted as a zero.


  Industrial accident insurance appears with `employer_only: true` and a null employee amount
  (Insurance Premium Collection Act Article 13(5)), so its absence from the deduction total is stated
  rather than silent. Its `total_won`, `basis_won`, `rate_num` and
  `rate_den` are null too, not 0: the rate by business type lives in Ministry of Employment and Labor Notice
  No. 2025-91's un-ingested annexed form, so the employer figures are unknown rather
  than zero.


  Where a rounding unit is not settled by any instrument read, the engine
  computes every candidate and emits the won only if they agree; otherwise
  the component carries `blocked_by` with the open question id and the
  totals are null. Returns 200 in that case, not 409, so the caller can
  see which question blocked which line.
security:
- bearerAuth: []
parameters:
- name: employeeId
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
- name: period
  in: query
  required: true
  description: Pay calculation period, `YYYY-MM`.
  schema:
    type: string
    pattern: '^[0-9]{4}-[0-9]{2}$'
- name: pay_date
  in: query
  required: false
  description: >
    Pay date. Defaults to the period end. A SEPARATE input from the period on
    purpose: the pay date selects both the rate row and the standard monthly income
    band, so a June period paid in July must not reuse the June band.
  schema:
    type: string
    format: date
responses:
  '200':
    description: >
      The draft, including blockers. Also returned when the draft is not
      issuable — the blocker list is the payload.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/PayrollPayslipDraft'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
  '422':
    $ref: '#/components/responses/ValidationError'
