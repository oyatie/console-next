# SPDX-License-Identifier: LicenseRef-Proprietary
x-console-authz: {"permission": "pay:edit", "scope": "entity"}
tags: [payroll]
operationId: createPayrollRun
summary: Create the next payroll run derived from pay-group rules
security:
- bearerAuth: []
parameters:
- name: Idempotency-Key
  in: header
  required: false
  description: Optional retry key. The same key and body replay the original 201 response; a different body returns 409.
  schema: {type: string, minLength: 16, maxLength: 200}
requestBody:
  required: true
  content:
    application/json:
      schema: {$ref: '#/components/schemas/CreatePayrollRun'}
responses:
  '201':
    description: The created run with its immutable derived schedule snapshot, or that original result on a same-key retry under current Cedar access.
    content:
      application/json:
        schema: {$ref: '#/components/schemas/PayrollRunSummary'}
  '401': {$ref: '#/components/responses/Unauthorized'}
  '403': {description: Cedar refuses pay-group edit or sensitive edit clearance. Unknown and foreign groups also refuse.}
  '409': {description: phase_not_operating during tenant setup; regular_run_exists for an occupied regular group/month; idempotency_key_reused for a changed body; command_processing or command_applied for an unavailable replay.}
  '422': {description: run_kind_unsupported for non-REGULAR kinds; Missing, malformed or extra fields, an invalid run kind, or invalid_request_key.}
  '503': {description: holiday_calendar_missing when the applicable calendar is unavailable; or unavailable Cedar facts.}
