# SPDX-License-Identifier: LicenseRef-Proprietary
type: object
required: [legal_entity_id, name, pay_date_rule, base_period, variable_period, proration, channel, sensitive, pay_basis_allowed]
properties:
  legal_entity_id: {type: string, format: uuid}
  name: {type: string, minLength: 1, maxLength: 40}
  pay_date_rule:
    type: object
    additionalProperties: false
    required: [day, month_offset, non_business_day]
    properties:
      day:
        oneOf:
        - {type: integer, minimum: 1, maximum: 31}
        - {type: string, enum: [LAST_DAY]}
      month_offset: {type: integer, enum: [0, 1]}
      non_business_day: {type: string, enum: [PREVIOUS, NEXT]}
  base_period: {$ref: '#/components/schemas/PayGroupPeriodRule'}
  variable_period: {$ref: '#/components/schemas/PayGroupPeriodRule'}
  proration: {type: string, enum: [CALENDAR_DAYS, SCHEDULED_WORKDAYS]}
  channel: {type: string, enum: [ATTESTATION_ONLY, FILE_GENERIC]}
  sensitive: {type: boolean}
  pay_basis_allowed:
    type: array
    minItems: 1
    maxItems: 2
    uniqueItems: true
    items: {type: string, enum: [MONTHLY, HOURLY]}
