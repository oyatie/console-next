type: object
description: >
  The document that actually sets a number. The version anchor is the promulgation number
  (statute) or issuance number (public notice) together with `enforced_on` — never a `flSeq`
  file handle, three of which serve byte-identical Annex 2 content.
required: [name_ko, article_ko, promulgation_ko, enforced_on, url, retrieved_on]
properties:
  name_ko: { type: string, description: Name of the statute or administrative rule. }
  article_ko:
    type: string
    description: The article carrying the number, quoted tightly enough to diff.
  promulgation_ko: { type: string, description: Promulgation number (statute) or issuance number (public notice). }
  enforced_on:
    type: string
    format: date
    description: >
      Effective date of the text quoted in `article_ko` — not the promulgation
      date, and not the latest promulgated slice.
  url: { type: string }
  retrieved_on: { type: string, format: date }
