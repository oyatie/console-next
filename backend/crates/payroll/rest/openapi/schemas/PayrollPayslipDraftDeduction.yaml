type: object
description: >
  One deduction component, carrying its own basis, rate and instrument so the
  payslip is recomputable under Labor Standards Act Article 42. An amount this engine did
  not compute is null, never 0.
required:
- code
- label_ko
- basis_kind
- basis_won
- rate_num
- rate_den
- total_won
- employee_won
- employer_only
- blocked_by
- total_rounding
- employee_rounding
- instrument
- share_instrument
- provenance_ko
properties:
  code:
    type: string
    enum: [NationalPension, HealthInsurance, LongTermCare, EmploymentUnemployment, IndustrialAccident]
  label_ko: { type: string }
  basis_kind:
    type: string
    enum: [MonthlyStandardIncome, MonthlyRemuneration, HealthInsurancePremium, IndustryTariff]
    description: >
      Long-term care's basis is HealthInsurancePremium — the COMPUTED health insurance premium
      under Long-Term Care Insurance Act Article 9(1), not the monthly remuneration.
  basis_won:
    type: [integer, 'null']
    format: int64
    description: >
      Null for industrial accident insurance only: its rate by business type and the basis that rate applies
      to are per-employer figures from an un-ingested annexed form.
  rate_num:
    type: [integer, 'null']
    format: int64
    description: Integer numerator, never a decimal. Null for industrial accident insurance, with `rate_den`.
  rate_den: { type: [integer, 'null'], format: int64 }
  total_won:
    type: [integer, 'null']
    format: int64
    description: >
      Null for industrial accident insurance (the employer premium is unknown, not zero) and null for
      any component whose rounding unit is unsettled — see `blocked_by`.
  employee_won:
    type: [integer, 'null']
    format: int64
    description: Always null when `employer_only` is true — industrial accident insurance has no employee line.
  employer_only:
    type: boolean
    description: >
      True for industrial accident insurance alone (Insurance Premium Collection Act Article 13(5)). The absence of an employee
      line is STATED here rather than left silent.
  blocked_by:
    type: [string, 'null']
    description: The unresolved question id that withheld this amount, if any.
  total_rounding: { type: string }
  employee_rounding: { type: string }
  instrument: { $ref: '#/components/schemas/PayrollStatutoryInstrument' }
  share_instrument:
    oneOf: [{ $ref: '#/components/schemas/PayrollStatutoryInstrument' }, { type: 'null' }]
    description: The instrument setting the bearer split, when it is a different one.
  provenance_ko:
    type: string
    description: What is actually established about this row, so a reviewer is never told more than was verified.
