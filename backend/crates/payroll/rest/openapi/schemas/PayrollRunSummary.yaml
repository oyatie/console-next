type: object
required:
- id
- legal_entity_id
- pay_group_id
- kind
- attribution_month
- pay_date
- period_start
- period_end
- variable_period_start
- variable_period_end
- source_label
- status
- calculation_enabled
- created_at
- updated_at
properties:
  id:
    $ref: '#/components/schemas/Uuid'
  legal_entity_id:
    oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
  pay_group_id:
    oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
  kind:
    oneOf: [{$ref: '#/components/schemas/PayrollRunKind'}, {type: 'null'}]
  attribution_month:
    type: [string, 'null']
    pattern: '^\d{4}-(0[1-9]|1[0-2])$'
  pay_date:
    type: [string, 'null']
    format: date
  period_start:
    type: string
    format: date
  period_end:
    type: string
    format: date
  variable_period_start:
    type: [string, 'null']
    format: date
  variable_period_end:
    type: [string, 'null']
    format: date
  source_label:
    type: string
  status:
    type: string
    enum: [STAGED, BLOCKED_LEGAL_GATE, READY_FOR_REVIEW, ATTENDANCE_CLOSED, CALCULATING, CALCULATED, SUBMITTED, REJECTED, APPROVED, DISBURSEMENT_SCHEDULED, PAID, ISSUED, VOID]
  calculation_enabled:
    type: boolean
  created_by:
    type:
    - string
    - 'null'
    format: uuid
  approved_by:
    type:
    - string
    - 'null'
    format: uuid
  approved_at:
    type:
    - string
    - 'null'
    format: date-time
  close_receipt:
    type:
    - object
    - 'null'
    description: Attestation receipt written by the attendance close — the preflight checks, the attesting user, and the attestation time.
  submitted_by:
    type:
    - string
    - 'null'
    format: uuid
  submitted_at:
    type:
    - string
    - 'null'
    format: date-time
  decided_by:
    type:
    - string
    - 'null'
    format: uuid
    description: Maker-checker counterparty; a DB CHECK forbids it from equalling submitted_by.
  decided_at:
    type:
    - string
    - 'null'
    format: date-time
  decision_reason:
    type:
    - string
    - 'null'
  approval_ref:
    type:
    - string
    - 'null'
    format: uuid
    description: Reserved for the future AP- workflow-engine object; never written today.
  created_at:
    $ref: '#/components/schemas/Timestamp'
  updated_at:
    $ref: '#/components/schemas/Timestamp'
