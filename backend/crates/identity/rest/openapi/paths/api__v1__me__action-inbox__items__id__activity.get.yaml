# SPDX-License-Identifier: LicenseRef-Proprietary
tags:
  - me
operationId: listMyActionInboxItemActivity
summary: 활동 내역 - what happened to one of my inbox items
description: >-
  The record column's 활동 내역 for an item in the caller's 업무함. The item is resolved through
  the caller's own sources, the same read as the list, so another person's item, an unknown id
  and a malformed id answer the same 404 inbox_item_not_found. Rows are the audit events on the
  item and on its subject, newest first, at most 50: what happened (a verb from a closed set,
  other for anything else), who did it (absent for system events) and when. Audit snapshots are
  never served. 503 when the inbox sources cannot be read.
security:
- bearerAuth: []
parameters:
- name: id
  in: path
  required: true
  description: The item id as the list serves it (kind:uuid).
  schema:
    type: string
responses:
  '200':
    description: The item's activity, newest first.
    content:
      application/json:
        schema:
          type: object
          required: [items]
          properties:
            items:
              type: array
              maxItems: 50
              items:
                type: object
                required: [verb, occurred_at]
                properties:
                  verb:
                    type: string
                    x-extensible-enum: [create, submit, approve, reject, decide, apply, withdraw, cancel, update, confirm, other]
                  actor_name:
                    type: string
                    description: The acting account's display name; absent for system events.
                  occurred_at:
                    type: string
                    format: date-time
  '401':
    $ref: '#/components/responses/Unauthorized'
  '404':
    $ref: '#/components/responses/NotFound'
  '503':
    $ref: '#/components/responses/ServiceUnavailable'
