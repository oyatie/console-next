tags:
- access
operationId: listOpsUsage
summary: The ops usage log — one row per request the ops account made
description: Needs audit and access log view (`audit` × `view`) over the whole tenant, or ops. Newest first.
security:
- bearerAuth: []
parameters:
- name: before
  in: query
  required: false
  schema:
    $ref: '#/components/schemas/Timestamp'
- name: limit
  in: query
  required: false
  schema:
    type: integer
    minimum: 1
    maximum: 200
    default: 50
responses:
  '200':
    description: Usage rows.
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '#/components/schemas/OpsUsageEntry'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
