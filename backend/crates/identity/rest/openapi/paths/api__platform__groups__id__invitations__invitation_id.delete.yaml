# SPDX-License-Identifier: LicenseRef-Proprietary
tags:
- platform
operationId: cancelPlatformGroupInvitation
summary: Cancel a pending group join invitation
description: Cancels a pending group join invitation and records an audit event on the target organization.
security:
- bearerAuth: []
parameters:
- name: id
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
- name: invitation_id
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
responses:
  '204':
    description: Pending group join invitation cancelled.
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
