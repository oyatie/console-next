# SPDX-License-Identifier: LicenseRef-Proprietary
tags: [access]
operationId: getAccessLogReview
summary: Read the monthly tenant access-log review state without exposing frozen chunks
description: Requires tenant-wide Cedar audit::view. Records access_log.review_read before returning.
security:
- bearerAuth: []
parameters:
- name: period
  in: path
  required: true
  schema:
    type: string
    pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
responses:
  '200':
    description: Current monthly review projection.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/AccessLogReview'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    description: access_denied or scope_tenant_wide_only.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
  '422':
    $ref: '#/components/responses/ValidationError'
  '503':
    $ref: '#/components/responses/ServiceUnavailable'
