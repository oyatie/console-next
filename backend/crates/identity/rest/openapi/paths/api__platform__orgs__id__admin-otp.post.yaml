tags:
  - platform
operationId: reissuePlatformOrgAdminOtp
summary: Reissue the tenant admin's one-time code (platform vendor tier)
description: Recovery for a lost or expired onboarding code while the tenant is still onboarding. Mints a fresh
  one-time code for the tenant's first active SUPER_ADMIN (the earliest-created one), revoking any code still open
  so only the new one redeems. Returned exactly once; audited to the tenant as platform.tenant.admin_otp.reissue
  (never the code). Platform token with tenant-onboarding authority required. The caller must have an enrolled
  passkey (403 passkey_required) and send a fresh `step_up` assertion of it (ceremony from `passkey/login/start`);
  without one, or with an assertion that fails or belongs to someone else, it returns 401 and no code is minted. 404 when the tenant or an active SUPER_ADMIN does not exist; 409
  admin_already_enrolled once any SUPER_ADMIN of the tenant holds or ever registered a passkey (the tenant then
  recovers through its own credential reset), and 409 conflict when the tenant or the admin account is not active.
security:
- bearerAuth: []
parameters:
- name: id
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/PlatformOrgAdminOtpReissueRequest'
responses:
  '200':
    description: The replacement one-time code; deliver out-of-band and do not log it.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/PlatformOrgAdminOtpReissueResponse'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
  '409':
    $ref: '#/components/responses/Conflict'
  '503':
    $ref: '#/components/responses/ServiceUnavailable'
