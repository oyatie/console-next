# SPDX-License-Identifier: LicenseRef-Proprietary
tags:
  - platform
operationId: listPlatformOperators
summary: List platform operators (platform vendor tier)
description: Lists all platform-tier SUPER_ADMIN operators with passkey and invitation status. Audited as platform.operator.list.
security:
- bearerAuth: []
responses:
  '200':
    description: Platform operators visible to the platform tier.
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '#/components/schemas/PlatformOperatorSummary'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '503':
    $ref: '#/components/responses/ServiceUnavailable'
