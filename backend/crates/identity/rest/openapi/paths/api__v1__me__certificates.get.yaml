# SPDX-License-Identifier: LicenseRef-Proprietary
tags: [me]
operationId: listMyCertificates
summary: List certificates issued for the authenticated employee
security:
- bearerAuth: []
parameters:
- name: limit
  in: query
  required: false
  schema:
    type: integer
    format: int64
    minimum: 1
- name: cursor
  in: query
  required: false
  schema:
    type: string
responses:
  '200':
    description: Keyset page of the employee's certificates.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/CertificatePage'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    description: Forbidden for unlinked users.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
