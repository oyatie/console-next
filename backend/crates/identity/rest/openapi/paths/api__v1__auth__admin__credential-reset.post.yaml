tags:
  - auth
operationId: resetUserCredentials
summary: Reset a user's credentials for account recovery (admin)
description: Account-recovery escape hatch for a user who lost their only passkey. Revokes ALL of the target user's
  passkeys AND mints a fresh single-use sign-in one-time code, atomically and audited. Authz-gated to ADMIN / SUPER_ADMIN
  within the caller's own org and branch scope (same rules as issuing an admin one-time code); a non-SUPER_ADMIN caller
  cannot reset a privileged user, and a user in another org is not resettable. After the reset the old passkeys fail
  login and the returned code redeems for a first sign-in. The code is returned once; only its hash is stored.
  Requires an enrolled passkey; a caller without one (an OTP-only session) is refused with 403 and error code
  `passkey_required`. A missing, inactive, or out-of-scope target is a generic 403. `step_up` (the caller's fresh
  assertion of one of their own passkeys, ceremony from `passkey/login/start`) is required (without it, or with
  someone else's, 401). The reset also revokes every refresh-token family of the target, so sessions the old
  passkeys created stop working (access 401, refresh 401). Every audit row names the resetting admin as actor.
  Each caller may make 10 credential resets per minute (429 too_many_requests).
  The caller's own account is never reset (409 `last_sign_in_path`, governance-02) since the reset would delete the passkeys
  of the session asking, and the only ops holder would lock its tenant out. One's own passkeys are added and removed
  under the caller's account (a new one on another device first; the last one stays). Nothing is revoked or minted.
security:
- bearerAuth: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/AdminCredentialResetRequest'
responses:
  '200':
    description: The fresh one-time code and its expiry.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/AdminCredentialResetResponse'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '409':
    $ref: '#/components/responses/Conflict'
  '429':
    $ref: '#/components/responses/TooManyRequests'
