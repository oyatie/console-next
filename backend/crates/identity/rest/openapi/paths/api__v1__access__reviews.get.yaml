# SPDX-License-Identifier: LicenseRef-Proprietary
x-console-authz: {"permission": "access:view", "scope": "tenant"}
tags: [access]
operationId: listAccessReviews
summary: List quarterly periodic access review cycles
description: Lists active, completed, and upcoming quarterly access review cycles for the tenant.
security:
- bearerAuth: []
responses:
  '200':
    description: Periodic access review cycles.
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '#/components/schemas/AccessReviewSummary'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '503':
    $ref: '#/components/responses/ServiceUnavailable'
