tags:
- access
operationId: listAccessRoleVersions
summary: Every version of a role, newest first (kept ≥ 3 years)
security:
- bearerAuth: []
parameters:
- name: roleId
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
responses:
  '200':
    description: Versions.
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '#/components/schemas/AccessRoleVersion'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
