tags:
  - platform
operationId: approveSupportOperator
summary: approve support operator
description: >-
  Tenant-approved, two-operator, device-bound passkey support access. Support tokens are roleless, read-only and
  audience-bound to the tenant origin. Limits resolve from support.request_expiry and support.max_duration. The
  metadata-only operator list omits all ticket, reason text, tenant identity, decisions and tenant payloads.
security:
  - bearerAuth: []
responses:
  '200':
    description: Current support session state.
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
            state:
              type: string
          required:
            - id
            - state
  '401':
    description: >-
      Support refusal with a stable code; step-up, separation of duties, consent, expiry, scope and read-only gates fail
      closed.
    content:
      application/problem+json:
        schema:
          $ref: '#/components/schemas/SupportRefusal'
  '403':
    description: >-
      Support refusal with a stable code; step-up, separation of duties, consent, expiry, scope and read-only gates fail
      closed.
    content:
      application/problem+json:
        schema:
          $ref: '#/components/schemas/SupportRefusal'
  '404':
    description: >-
      Support refusal with a stable code; step-up, separation of duties, consent, expiry, scope and read-only gates fail
      closed.
    content:
      application/problem+json:
        schema:
          $ref: '#/components/schemas/SupportRefusal'
  '409':
    description: >-
      Support refusal with a stable code; step-up, separation of duties, consent, expiry, scope and read-only gates fail
      closed.
    content:
      application/problem+json:
        schema:
          $ref: '#/components/schemas/SupportRefusal'
  '422':
    description: >-
      Support refusal with a stable code; step-up, separation of duties, consent, expiry, scope and read-only gates fail
      closed.
    content:
      application/problem+json:
        schema:
          $ref: '#/components/schemas/SupportRefusal'
  '500':
    description: >-
      Support refusal with a stable code; step-up, separation of duties, consent, expiry, scope and read-only gates fail
      closed.
    content:
      application/problem+json:
        schema:
          $ref: '#/components/schemas/SupportRefusal'
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/SupportOperatorDecision'
