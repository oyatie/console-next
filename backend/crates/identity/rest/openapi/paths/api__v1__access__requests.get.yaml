tags:
- access
operationId: listAccessRequests
summary: Access requests — the open requests (access management holders) or the caller's own
description: A holder of access management view (or ops) sees every open request; any other account sees the requests it filed.
  Newest first, at most 200.
security:
- bearerAuth: []
responses:
  '200':
    description: Requests.
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '#/components/schemas/AccessRequest'
  '401':
    $ref: '#/components/responses/Unauthorized'
