# SPDX-License-Identifier: LicenseRef-Proprietary
type: object
required:
- domain
- levels
properties:
  domain:
    type: string
    enum:
    - org
    - hr_basic
    - appointment
    - exit
    - attendance
    - pay
    - bank
    - evaluation
    - discipline
    - sensitive
    - documents
    - notice
    - access
    - audit
    - settings
    - exceptions
    - retention
    - tenant
    - support_access

  levels:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: '#/components/schemas/AccessLevel'
