type: object
description: Current required first-login privacy/terms consent status.
required:
- policy_version
- privacy
- terms
- accepted
properties:
  policy_version:
    type: string
    description: Current required privacy/terms notice version.
  accepted:
    type: boolean
    description: True when the authenticated user has accepted the current version.
  accepted_at:
    type: string
    format: date-time
    nullable: true
    description: UTC timestamp of the latest acceptance for the current version.
  privacy:
    type: object
    required: [version, sha256]
    properties:
      version:
        type: string
      sha256:
        type: string
  terms:
    type: object
    required: [version, sha256]
    properties:
      version:
        type: string
      sha256:
        type: string
