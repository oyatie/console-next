type: object
required:
- access_token
- token_type
- refresh_expires_at
- requires_passkey_setup
properties:
  privacy_consent_accepted:
    type: boolean
    description: Current required document acceptance for this session, checked on issuance and refresh. Absent means consent is required.
  access_token:
    type: string
  refresh_token:
    type: string
    nullable: true
    description: The opaque rotating refresh token in the body transport (mobile). It is null in the cookie transport
      (web), where the token is set as an HttpOnly `console_refresh` cookie and must never reach web JS.
  token_type:
    type: string
  refresh_expires_at:
    $ref: '#/components/schemas/Timestamp'
  requires_passkey_setup:
    type: boolean
    description: True when the signed-in user has no passkey yet and should enroll one in initial settings.
  otp_expires_at:
    $ref: '#/components/schemas/Timestamp'
  otp_reusable:
    type: boolean
    description: True for first-sign-in codes valid until passkey registration or expiry; false for single-use recovery codes.
