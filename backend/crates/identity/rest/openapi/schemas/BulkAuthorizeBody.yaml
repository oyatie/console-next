type: object
required: [subject, checks]
properties:
  subject: { $ref: '#/components/schemas/PolicySimSubject' }
  checks:
    type: array
    maxItems: 200
    description: The encoded subject repeated across all checks must fit the policy bulk evaluation work limit (2 MiB). Over-limit requests are rejected without recording decisions.
    items:
      type: object
      required: [action, resource]
      properties:
        action: { type: string }
        resource: { $ref: '#/components/schemas/PolicySimResource' }
        purpose: { type: string, nullable: true }
        field: { type: string, nullable: true }
