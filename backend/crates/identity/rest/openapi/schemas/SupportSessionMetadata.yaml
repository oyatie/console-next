# SPDX-License-Identifier: LicenseRef-Proprietary
type: object
properties:
  id:
    type: string
    format: uuid
  org_id:
    type: string
    format: uuid
  operator_ref:
    type: string
    format: uuid
  state:
    type: string
  requested_at:
    type: string
    format: date-time
  expires_at:
    type:
      - string
      - 'null'
    format: date-time
  request_expires_at:
    type: string
    format: date-time
  requested_duration_seconds:
    type: integer
  scope:
    type: array
    items:
      type: string
  operator_approver_ref:
    type:
      - string
      - 'null'
    format: uuid
  tenant_approved:
    type: boolean
required:
  - id
  - org_id
  - operator_ref
  - state
  - requested_at
  - expires_at
