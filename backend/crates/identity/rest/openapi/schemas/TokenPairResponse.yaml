type: object
required:
- access_token
- token_type
- refresh_expires_at
- requires_passkey_setup
properties:
  privacy_consent_accepted:
    type: boolean
    description: Current required document acceptance for this session, checked on issuance and refresh. Absent means consent is required.
  passkey_profile:
    type: object
    description: Current verified account labels, returned only after successful passkey authentication.
    required: [user_id, name, display_name]
    properties:
      user_id:
        $ref: '#/components/schemas/Uuid'
      name:
        type: string
      display_name:
        type: string
  access_token:
    type: string
  refresh_token:
    type: string
    nullable: true
    description: The opaque rotating refresh token in the body transport (mobile). It is null in the cookie transport
      (web), where the token is set as an HttpOnly `console_refresh` cookie and must never reach web JS.
  token_type:
    type: string
    enum:
    - Bearer
  refresh_expires_at:
    $ref: '#/components/schemas/Timestamp'
  requires_passkey_setup:
    type: boolean
    description: True when the refreshed session belongs to an OTP-signed-in user who still has no passkey. Web clients
      must keep routing this session to initial passkey enrollment after a reload; passkey-authenticated sessions return
      false.
