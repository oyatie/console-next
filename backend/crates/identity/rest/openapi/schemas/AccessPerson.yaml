# SPDX-License-Identifier: LicenseRef-Proprietary
type: object
additionalProperties: false
description: Access-screen account labels and state. Contact details and unrelated HR facts are excluded.
required:
- id
- display_name
- employee_id
- employee_name
- employee_number
- employee_company
- employee_org_unit
- employee_link_status
- roles
- branch_ids
- is_active
- is_tenant_ops
- has_passkey
- account_status
properties:
  id:
    $ref: '#/components/schemas/Uuid'
  display_name:
    type: string
  sign_in_id:
    type: [string, 'null']
    description: Account login label used to distinguish unlinked accounts; not a contact address.
  employee_id:
    type: [string, 'null']
    format: uuid
  employee_name:
    type: [string, 'null']
  employee_number:
    type: [string, 'null']
  employee_company:
    type: [string, 'null']
  employee_org_unit:
    type: [string, 'null']
  employee_link_status:
    type: string
    enum: [LINKED, UNLINKED]
  roles:
    type: array
    items:
      type: string
  branch_ids:
    type: array
    items:
      $ref: '#/components/schemas/Uuid'
  is_active:
    type: boolean
  is_tenant_ops:
    type: boolean
  has_passkey:
    type: boolean
  account_status:
    $ref: '#/components/schemas/AccountStatus'
