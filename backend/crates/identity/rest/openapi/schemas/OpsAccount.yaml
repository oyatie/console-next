type: object
required:
- account_id
- display_name
- max_holders
- holders
properties:
  account_id:
    $ref: '#/components/schemas/Uuid'
  display_name:
    type: string
  max_holders:
    type: integer
    minimum: 1
    maximum: 2
  holders:
    type: array
    minItems: 1
    maxItems: 2
    items:
      $ref: '#/components/schemas/OpsHolderSummary'
