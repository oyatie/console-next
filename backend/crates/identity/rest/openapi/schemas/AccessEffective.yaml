type: object
required:
- account_id
- is_ops
- phase
- as_of
- entries
properties:
  decisions:
    type: object
    description: Server Cedar decisions for tenant-wide commands. Missing decisions never admit a command.
    additionalProperties: false
    properties:
      bulk_appointment:
        type: boolean
        description: Either hr_basic edit or appointment edit over the tenant, decided by the bulk_appointment Cedar action.
  account_id:
    $ref: '#/components/schemas/Uuid'
  is_ops:
    type: boolean
    description: The ops account holds everything by platform policy (break-glass, logged); it has no entries.
  phase:
    type: string
    enum:
    - SETUP
    - OPERATING
  as_of:
    $ref: '#/components/schemas/Timestamp'
  entries:
    type: array
    description: One row per grant × domain × level, Cedar-checked; ENFORCED rows are what counts now.
    items:
      $ref: '#/components/schemas/AccessEffectiveEntry'
