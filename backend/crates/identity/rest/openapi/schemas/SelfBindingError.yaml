type: object
required: [error]
properties:
  error:
    type: object
    required: [code, message]
    properties:
      code:
        type: string
        enum:
          - step_up_required
          - step_up_failed
          - account_link.refuse.solo_ineligible
          - account_link.refuse.employee_taken
          - account_link.refuse.not_own_record
          - account_link.refuse.withdraw_ineligible
          - account_link.refuse.review_stale
          - account_link.refuse.review_ineligible
          - account_link.refuse.identity_unbound
          - passkey_step_up_required
          - not_found
          - unauthorized
          - unavailable
          - internal
      message:
        type: string
