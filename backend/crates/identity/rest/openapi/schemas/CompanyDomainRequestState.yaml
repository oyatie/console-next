# SPDX-License-Identifier: LicenseRef-Proprietary
type: object
additionalProperties: false
required: [pending_domain]
properties:
  pending_domain:
    type: [string, 'null']
  requested_by:
    type: [string, 'null']
    format: uuid
  requested_by_name:
    type: [string, 'null']
  requested_at:
    type: [string, 'null']
    format: date-time
  current_domain:
    type: [string, 'null']
  account_count:
    type: integer
    format: int64
  domain_aliases:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [slug, retired_at, alias_until]
      properties:
        slug:
          type: string
        retired_at:
          type: [string, 'null']
          format: date-time
        alias_until:
          type: [string, 'null']
          format: date-time
