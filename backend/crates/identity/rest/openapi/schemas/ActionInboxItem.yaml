type: object
description: >-
  One unified actionable item. Field names mirror the overview prototype's
  items[] shape. Source-partial fields (site/who/due/submitted) are absent
  when the originating source does not carry them.
required:
- id
- kind
- urg
- ref
- title
- dueTone
- links
- done
- lane
- days_remaining
properties:
  id:
    type: string
    description: '"{kind}:{uuid}" — source-namespaced so ids never collide.'
  kind:
    type: string
    enum:
    - approval
    - dispatch
    - work
    - support
    - payroll
    - governance
    - org_change
    - org_change_approve
    - org_change_draft
    - org_change_apply
    - org_change_waiting
    - org_change_scheduled
    - org_change_rejected
    - org_change_settle
    - hr_exit
    - hr_exit_confirm
    - hr_exit_confirm_hq
    - hr_exit_settle
    - hr_lifecycle
    - lifecycle_apply_failed
    - hr_request
    - register_review
    - insurance_filing
    - identity_review
    - home_branch_review
    - contract_renewal
    - period_unlock
    - grant_notice
    - account_security
    - setup_entity
    - setup_workplace
    - setup_org
    - setup_approval
    - setup_people
    - setup_passkey
    - setup_employees
    - setup_roles
    - setup_golive
  urg:
    type: string
    enum:
    - now
    - today
    - wait
  ref:
    type: string
    description: >-
      Source reference (work order request_no, ticket id, or the workflow
      run/object id). Not a canonical AP-/CS- object code.
  title:
    type: string
  site:
    type: string
  who:
    type: string
  due:
    $ref: '#/components/schemas/Timestamp'
  dueTone:
    type: string
    enum:
    - danger
    - warn
    - neutral
  submitted:
    $ref: '#/components/schemas/Timestamp'
  links:
    type: array
    items:
      $ref: '#/components/schemas/ActionInboxLink'
  done:
    type: boolean
  lane:
    type: string
    enum: [turn, waiting, scheduled]
    description: Server-owned lane based on the actor and current action state.
  days_remaining:
    type: [integer, 'null']
    description: Calendar days remaining in the source deadline's timezone, computed from the database clock.
  context:
    type: object
    description: Source-owned facts for the row's command and informed grant confirmation.
    properties:
      command:
        type: [string, 'null']
        enum: [approve, effectuate, null]
      drafter:
        type: string
      reason:
        type: string
      command_id:
        type: [string, 'null']
      grants:
        type: array
        items:
          $ref: '#/components/schemas/AccessEffectiveEntry'
      is_ops:
        type: boolean
