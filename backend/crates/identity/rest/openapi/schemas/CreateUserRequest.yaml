type: object
required:
- display_name
properties:
  display_name:
    type: string
  employee_id:
    type:
    - string
    - 'null'
    format: uuid
  phone:
    type:
    - string
    - 'null'
  team:
    $ref: '#/components/schemas/Team'
  roles:
    type: array
    maxItems: 0
    description: Retired (no preset roles, decision 19). Anything but an empty list is refused with 422
      preset_role_refused; access comes from tenant roles granted under /access/grants.
    items:
      type: string
  branch_ids:
    type: array
    maxItems: 0
    description: Retired with the roles. Anything but an empty list is refused with 422 branch_membership_refused.
    items:
      $ref: '#/components/schemas/Uuid'
  sign_in_id:
    type:
    - string
    - 'null'
    description: 'The 아이디 (the part before `@`) HR sets at invite (decisions #33). Absent or empty takes the
      default (the linked 사번, else `u` + hex). 422 sign_in_id_invalid by the rule, 409 sign_in_id_taken when
      anyone in the tenant holds or held it.'
