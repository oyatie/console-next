tags:
  - collaboration
operationId: listCollaborationCalendarEvents
summary: List tenant-scoped collaboration calendar events
description: |
  Lists active internal events visible to this tenant member over the given range. Personal events belong to the creator,
  department events to authorized branches and team events to team members. Creators can inspect their own events.
  Follow next_cursor with the original range to read subsequent pages in stable order at the first page's snapshot time.
security:
- bearerAuth: []
parameters:
- name: from
  in: query
  required: false
  schema:
    $ref: '#/components/schemas/Timestamp'
- name: to
  in: query
  required: false
  schema:
    $ref: '#/components/schemas/Timestamp'
- name: cursor
  in: query
  description: Opaque continuation returned by the preceding page for this range.
  schema: { type: string }
- name: limit
  in: query
  required: false
  schema:
    type: integer
    format: int64
    minimum: 1
    maximum: 100
    default: 30
responses:
  '200':
    description: Calendar events visible to the caller.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/CalendarEventListResponse'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '422':
    $ref: '#/components/responses/ValidationError'
