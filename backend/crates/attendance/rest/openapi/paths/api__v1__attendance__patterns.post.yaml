requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AttendancePatternInput' } } } }
responses:
  '201': { description: Added, content: { application/json: { schema: { $ref: '#/components/schemas/AttendancePattern' } } } }
  '401': { $ref: '#/components/responses/Unauthorized' }
  '403': { $ref: '#/components/responses/Forbidden' }
  '409': { $ref: '#/components/responses/Conflict' }
  '422': { $ref: '#/components/responses/ValidationError' }
