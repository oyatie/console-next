tags: [attendance]
operationId: listAttendanceCrews
summary: Crews of the caller's workplace with members on a date
security: [{ bearerAuth: [] }]
parameters:
  - { name: workplace_id, in: query, required: false, schema: { $ref: '#/components/schemas/Uuid' } }
  - { name: date, in: query, required: false, schema: { type: string, format: date } }
responses:
  '200': { description: Crews, content: { application/json: { schema: { $ref: '#/components/schemas/AttendanceCrewList' } } } }
  '401': { $ref: '#/components/responses/Unauthorized' }
  '403': { $ref: '#/components/responses/Forbidden' }
