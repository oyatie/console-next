tags: [attendance]
operationId: readAttendanceScheduleCalendar
summary: One scope's month with the deciding layer per day, the layer stack and the month's holidays
security: [{ bearerAuth: [] }]
parameters:
  - { name: scope_kind, in: query, required: true, schema: { $ref: '#/components/schemas/AttendanceScopeKind' } }
  - { name: scope_id, in: query, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
  - { name: month, in: query, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }
responses:
  '200': { description: Calendar, content: { application/json: { schema: { $ref: '#/components/schemas/AttendanceScheduleCalendar' } } } }
  '401': { $ref: '#/components/responses/Unauthorized' }
  '403': { $ref: '#/components/responses/Forbidden' }
  '404': { $ref: '#/components/responses/NotFound' }
  '422': { $ref: '#/components/responses/ValidationError' }
