tags: [attendance]
operationId: undoAttendanceBatch
summary: 일괄 취소 — the whole save stops counting, until its month closes; the entries stay as history
security: [{ bearerAuth: [] }]
parameters:
  - { name: batch_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AttendanceReasonInput' } } } }
responses:
  '200': { description: Undone, content: { application/json: { schema: { $ref: '#/components/schemas/AttendanceSaveReceipt' } } } }
  '401': { $ref: '#/components/responses/Unauthorized' }
  '403': { $ref: '#/components/responses/Forbidden' }
  '404': { $ref: '#/components/responses/NotFound' }
  '409': { $ref: '#/components/responses/Conflict' }
  '422': { $ref: '#/components/responses/ValidationError' }
