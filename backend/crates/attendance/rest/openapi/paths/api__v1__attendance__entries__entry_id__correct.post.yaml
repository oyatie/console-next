tags: [attendance]
operationId: correctAttendanceEntry
summary: 정정 — a new value replaces the entry with a reason and its 근거; both values stay in the history
security: [{ bearerAuth: [] }]
parameters:
  - { name: entry_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
  - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 200 } }
requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AttendanceCorrectInput' } } } }
responses:
  '201': { description: Corrected, content: { application/json: { schema: { $ref: '#/components/schemas/AttendanceSaveReceipt' } } } }
  '401': { $ref: '#/components/responses/Unauthorized' }
  '403': { $ref: '#/components/responses/Forbidden' }
  '404': { $ref: '#/components/responses/NotFound' }
  '409': { $ref: '#/components/responses/Conflict' }
  '422': { $ref: '#/components/responses/ValidationError' }
