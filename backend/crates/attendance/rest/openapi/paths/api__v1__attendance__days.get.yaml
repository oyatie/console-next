x-console-authz: {"permission": "EmployeeDirectoryRead", "scope": "entity", "engine": "cedar"}
tags: [attendance]
operationId: readAttendanceDayBoard
summary: One day's board (daily · compact) — the partition ledger, then workplace › department groups with issue rows first
description: Cedar EmployeeDirectoryRead on the tenant, legal entity or workplace admits this read; department-only grants do not. Explicit filters and each person's dated workplace are authorized in the same fact snapshot.
security: [{ bearerAuth: [] }]
parameters:
  - { name: date, in: query, required: true, schema: { type: string, format: date } }
  - { name: workplace_id, in: query, required: false, schema: { $ref: '#/components/schemas/Uuid' } }
  - { name: unit_id, in: query, required: false, description: open this department group (all its rows), schema: { $ref: '#/components/schemas/Uuid' } }
  - { name: issues_only, in: query, required: false, schema: { type: boolean } }
  - { name: no_schedule_only, in: query, required: false, description: show only people without a resolved schedule; counts remain for the whole scope, schema: { type: boolean } }
  - { name: mark, in: query, required: false, description: only rows carrying this issue kind; aggregates remain for the entire authorized day scope, schema: { $ref: '#/components/schemas/AttendanceMark' } }
  - { name: cursor, in: query, required: false, description: exclusive employee UUID keyset cursor, schema: { $ref: '#/components/schemas/Uuid' } }
  - { name: limit, in: query, required: false, description: bound returned rows; omitted preserves the unpaged board, schema: { type: integer, minimum: 1, maximum: 200 } }
  - { name: rows, in: query, required: false, description: return every row without folding normal people; existing filters still apply, schema: { type: string, enum: [all] } }
responses:
  '200': { description: Board, content: { application/json: { schema: { $ref: '#/components/schemas/AttendanceDayBoard' } } } }
  '400': { $ref: '#/components/responses/BadRequest' }
  '401': { $ref: '#/components/responses/Unauthorized' }
  '403': { $ref: '#/components/responses/Forbidden' }
  '404': { $ref: '#/components/responses/NotFound' }
  '422': { $ref: '#/components/responses/ValidationError' }
