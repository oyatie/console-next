properties: { employee_id: { $ref: '#/components/schemas/Uuid' }, name: { type: string }, team: { type: string, nullable: true }, week_start: { type: string, format: date }, current_hours: { type: number }, projected_hours: { type: number }, recognized_hours: { type: number, nullable: true, description: "Sum of grid-recognized worked minutes in hours, regardless of approval. Null when there are no live entries, or a live entry is incomplete, unplaced or lacks a schedule. Missing days are not included." }, overtime_hours: { type: number, nullable: true, description: "Sum of worked minutes outside the schedule in hours, regardless of approval. Null under the same conditions as recognized_hours." }, tone: { type: string, enum: [OK, WARN, DANGER, UNKNOWN], description: "UNKNOWN: cannot be determined — no statutory working-hours register on file" }, acked: { type: boolean }, acked_at: { type: string, format: date-time, nullable: true } }
