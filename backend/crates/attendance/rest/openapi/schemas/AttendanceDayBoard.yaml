type: object
required: [date, judged, ledger, marks, groups]
# Additive fields stay optional for N-1 board fixtures; the server always returns them.
properties:
  issue_groups:
    type: array
    description: Requested-day issue counts before row filters or pagination; earliest_date is the oldest matching issue in the authorized scope within that calendar month, through the requested day, including people who left earlier in the month.
    items:
      type: object
      required: [kind, count, earliest_date]
      properties:
        kind: { $ref: '#/components/schemas/AttendanceMark' }
        count: { type: integer, format: int64 }
        earliest_date: { type: string, format: date }
  next_cursor: { type: [string, 'null'], format: uuid }
  date: { type: string, format: date }
  judged: { type: boolean }
  ledger: { $ref: '#/components/schemas/AttendanceLedger' }
  marks: { $ref: '#/components/schemas/AttendanceMarkCounts' }
  groups: { type: array, items: { $ref: '#/components/schemas/AttendanceBoardGroup' } }
