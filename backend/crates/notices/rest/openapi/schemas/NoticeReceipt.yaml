type: object
required:
- recipient_user_id
- display_name
- acknowledged_at
properties:
  recipient_user_id:
    $ref: '#/components/schemas/Uuid'
  display_name:
    type: string
  acknowledged_at:
    type:
    - string
    - 'null'
    format: date-time
    description: Receipt acknowledgement timestamp; null while the recipient is outstanding.
