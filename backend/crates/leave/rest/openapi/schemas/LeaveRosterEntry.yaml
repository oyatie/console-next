type: object
description: One employee's annual-leave balance row.
required:
- employee_id
- name
- team
- grant
- used
- left
- tone
properties:
  employee_id:
    $ref: '#/components/schemas/Uuid'
  name:
    type: string
  team:
    type:
    - string
    - 'null'
  grant:
    type: number
    format: double
  used:
    type: number
    format: double
  left:
    type: number
    format: double
  tone:
    type: string
    description: Bar color / promotion bucket — one of ok, promote, low.
    enum: [ok, promote, low]
