type: object
required:
- decision
properties:
  decision:
    type: string
    enum: [approve, time_change]
    description: >-
      Labor Standards Act §60: refusal is not representable. `time_change` opens the
      §60⑤ timing-change consultation; `return`/`reject` are rejected with 422.
  comment:
    type: string
    description: Mandatory for time_change; optional for approve.
