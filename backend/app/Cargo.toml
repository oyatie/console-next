[package]
name = "console-app"
version = "0.1.0"
description = "Composition root binary for the maintenance FSM backend."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "console-app"

[[bin]]
name = "console-app"
path = "src/main.rs"

# Cedar/PBAC parity evidence: read-only aggregation of recorded shadow parity
# observations (`authz.cedar_pbac_parity` audit rows) into per-site agree/disagree
# totals + concrete divergent cases. Promotion gate reads this; no REST surface.
[[bin]]
name = "console-cedar-parity-report"
path = "src/bin/console_cedar_parity_report.rs"

[lib]
name = "console_app"
path = "src/lib.rs"

[features]
# Enables the inline PostgreSQL integration suite. This is intentionally inert
# by default so normal unit tests need no database topology.
test-postgres = []
# E2E-only HTTP fixture API. Never enable in a deployable binary.
e2e-test-support = []
# Local role-switch dev-auth endpoint. NOT in `default` (nor in `mvp` or `full`)
# and MUST NEVER be added to one — `console-gate-dev-auth-absence` asserts this
# via `cargo metadata` and is wired into CI as a blocking gate.
dev-auth = ["console-platform-auth-rest/dev-auth"]

# --- Build profiles: the MVP binary and the full build (docs/ops/mvp-build.md) ---
# `default` is the MVP the release image ships (Org + HR, decisions #19/#21/#22):
# every module below that `mvp` does not list is compiled out of it, and its
# routes and loops answer 404 / do not run. `full` turns every module on: INTEG, the pgtest sweeps,
# openapi_drift and the E2E-of-everything build with it. Each module feature
# gates one `mount_<module>` (routes/*.rs) and its loops. Promoting a module
# into `mvp` is a reviewed change that passes the promotion checklist in
# docs/ops/mvp-build.md. Migrations are never gated: one schema for every build.
default = ["mvp"]
# The modules in the MVP besides the always-on Org + HR core. 근태 is in the MVP
# (decision #22; HR logs it in the pilot) although the web does not call it yet.
mvp = ["attendance"]
full = [
  # People
  "attendance", "leave", "recruiting", "evaluation", "benefit", "payroll",
  # Governance and the ontology engine
  "compliance", "integrity", "docs", "ontology", "governance",
  # Finance and business
  "financial", "sales", "reporting", "consulting", "finance-gl", "analytics-quant",
  # Field operations, maintenance and assets
  "dispatch", "logistics", "inventory", "equipment", "inspection", "registry", "workorder", "facilities", "production",
  # Communication
  "support", "messenger", "notifications", "inbox", "todos", "mail", "notices",
  # Workflow studio and the workspace
  "workspace", "office",
]
attendance = ["dep:console-attendance-adapter-postgres", "dep:console-attendance-rest"]
leave = ["dep:console-leave-rest"]
recruiting = ["dep:console-recruiting-adapter-postgres", "dep:console-recruiting-application", "dep:console-recruiting-domain", "dep:console-recruiting-rest"]
evaluation = ["dep:console-evaluation-adapter-postgres", "dep:console-evaluation-rest"]
benefit = ["dep:console-benefit-adapter-postgres", "dep:console-benefit-rest"]
payroll = ["dep:console-payroll-adapter-postgres", "dep:console-payroll-rest"]
compliance = ["dep:console-compliance-rest"]
integrity = ["dep:console-integrity"]
docs = ["dep:console-docs-adapter-postgres", "dep:console-docs-rest"]
ontology = ["dep:console-ontology-rest", "dep:console-registry-adapter-postgres", "dep:console-registry-application", "dep:console-registry-domain", "dep:console-payroll-adapter-postgres"]
governance = ["dep:console-governance-rest"]
financial = ["dep:console-financial-adapter-postgres", "dep:console-financial-rest"]
sales = ["dep:console-sales-adapter-postgres", "dep:console-sales-rest"]
reporting = ["dep:console-reporting-adapter-postgres", "dep:console-reporting-rest"]
consulting = ["dep:console-consulting-rest"]
finance-gl = ["dep:console-finance-gl-adapter-postgres", "dep:console-finance-gl-rest"]
analytics-quant = ["dep:console-analytics-quant-rest"]
dispatch = ["dep:console-dispatch-adapter-postgres", "dep:console-dispatch-rest", "dep:console-dispatch-worker"]
logistics = ["dep:console-logistics-adapter-postgres", "dep:console-logistics-rest"]
inventory = ["dep:console-inventory-adapter-postgres", "dep:console-inventory-rest"]
equipment = ["dep:console-equipment-adapter-postgres", "dep:console-equipment-rest"]
inspection = ["dep:console-inspection-adapter-postgres", "dep:console-inspection-rest"]
registry = ["dep:console-registry-adapter-postgres", "dep:console-registry-application", "dep:console-registry-domain", "dep:console-registry-rest"]
workorder = ["dep:console-workorder-adapter-postgres", "dep:console-workorder-application", "dep:console-workorder-rest", "dep:console-workflow-domain", "dep:console-workflow-runtime-adapter-postgres", "dep:console-payroll-adapter-postgres"]
facilities = ["dep:console-facilities-rest"]
production = ["dep:console-production-rest"]
support = ["dep:console-support-adapter-postgres", "dep:console-support-application", "dep:console-support-domain", "dep:console-support-rest"]
messenger = ["dep:console-messenger-rest"]
notifications = ["dep:console-notifications-rest"]
inbox = ["dep:console-inbox-rest"]
todos = ["dep:console-todos-adapter-postgres", "dep:console-todos-rest"]
mail = ["dep:console-comms-adapter-imap", "dep:console-comms-adapter-postgres", "dep:console-comms-application", "dep:console-comms-rest"]
notices = ["dep:console-notices-adapter-postgres", "dep:console-notices-rest"]
workspace = ["dep:console-workflow-domain", "dep:console-workflow-runtime", "dep:console-workflow-runtime-adapter-postgres", "dep:console-dispatch-adapter-postgres", "dep:console-support-adapter-postgres", "dep:console-workorder-adapter-postgres", "dep:console-workorder-application", "dep:console-payroll-adapter-postgres", "dep:console-todos-adapter-postgres", "dep:croner", "dep:chrono-tz"]
office = []

