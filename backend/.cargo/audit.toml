# cargo-audit (RUSTSEC) configuration, read from backend/.
# This ignore list must equal the one in backend/deny.toml. Every line reads
#   "ID", # expires YYYY-MM-DD: reason
# and scripts/check-audit-ignores.mjs fails on drift, a missing reason, or an
# expired entry. Fuller rationale for each ID sits beside it in deny.toml.
[advisories]
ignore = [
  "RUSTSEC-2023-0071", # expires 2027-01-07: rsa is lockfile-only via sqlx 0.8 optional MySQL metadata and absent from the all-target build graph; no fixed release
  "RUSTSEC-2024-0436", # expires 2027-01-07: paste is unmaintained, not vulnerable; build-time proc-macro via umya-spreadsheet, no runtime surface
  "RUSTSEC-2026-0441", # expires 2027-02-05: pin-utils is unmaintained, not vulnerable; via async-imap (comms IMAP adapter, not in MVP), 0.12 still depends on it
]
