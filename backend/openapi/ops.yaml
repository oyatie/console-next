      allOf: [{"$ref": "#/components/schemas/Observation"}, {"properties": {"value": {"anyOf": [{"$ref": "#/components/schemas/Timestamp"}, {"type": "null"}]}}}]
    Promotion:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      type: "string"
      enum: ["Watching", "Blocked", "Ready", "Promoting", "Superseded", "Integration-only"]
    PublicComponent:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      type: "string"
      enum: ["Operational", "Degraded performance", "Partial outage", "Major outage", "Maintenance", "Unknown"]
    Recovery:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      type: "string"
      enum: ["Queued", "Deferred to window", "Running", "Done", "Failed"]
    RefusalCode:
