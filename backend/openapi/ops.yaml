        reason: {"anyOf": [{"$ref": "#/components/schemas/Text"}, {"type": "null"}]}
      description: "Source metadata is itself the evidence envelope. Never-observed sources have null observed_at, age 0 and Unknown with a reason. Only Verified sources are omitted from the home evidence list."
      oneOf:
        - properties: {state: {enum: [Verified, Monitoring]}, observed_at: {$ref: '#/components/schemas/Timestamp'}, reason: {type: 'null'}}
        - properties: {state: {enum: [Stale, Unknown]}, reason: {$ref: '#/components/schemas/Text'}}
    Sources:
