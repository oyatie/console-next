    ObservedDrift:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      allOf: [{"$ref": "#/components/schemas/Observation"}, {"properties": {"value": {"anyOf": [{"$ref": "#/components/schemas/Drift"}, {"type": "null"}]}}}]
    ObservedHealth:
