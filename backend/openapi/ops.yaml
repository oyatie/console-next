        count: {$ref: '#/components/schemas/ObservedCount'}
    Source:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      type: "object"
      required: ["name", "kind", "producer", "interval", "observed_at", "age", "state", "reason"]
      properties:
        name: {"$ref": "#/components/schemas/Text"}
        kind: {"type": "string", "enum": ["alertmanager", "vmalert", "victoriametrics", "bundle", "textfile", "access_jwks", "evaluator"]}
        producer: {"$ref": "#/components/schemas/Text"}
        interval: {"type": "integer", "minimum": 1}
        observed_at: {"anyOf": [{"$ref": "#/components/schemas/Timestamp"}, {"type": "null"}]}
        age: {"type": "integer", "minimum": 0}
