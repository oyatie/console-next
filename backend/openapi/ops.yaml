        - {"type": "object", "required": ["type", "id", "evaluated_at", "group"], "properties": {"type": {"type": "string", "const": "alert.group.changed"}, "id": {"type": "integer", "minimum": 1}, "evaluated_at": {"$ref": "#/components/schemas/Timestamp"}, "group": {"$ref": "#/components/schemas/AlertGroupDetail"}}}
