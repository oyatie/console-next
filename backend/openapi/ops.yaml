openapi: 3.1.0
info:
  # SPDX-License-Identifier: LicenseRef-Proprietary
  title: Console operator cockpit
  version: 0.1.0
  description: Database-free operator reads. Separate host and Access audience from the tenant API. All times UTC Z; links to runbooks and GitHub are plain text.
paths:
  /api/ops/v1/alerts:
    get:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      operationId: "opsAlertGroups"
      summary: "Read AlertGroups"
      x-cedar-action: "read.alerts"
      security: [{"accessJwt": []}]
      description: "Access JWT identity only; cookies ignored. Cedar decides before reading any source or count. No CORS headers or Set-Cookie. Non-GET/HEAD requires configured Origin plus Sec-Fetch-Site: same-origin, otherwise 403 origin_refused; allowed non-GET falls through to 405."
      parameters: [{"in": "query", "name": "state", "required": false, "schema": {"$ref": "#/components/schemas/AlertState"}}, {"in": "query", "name": "severity", "required": false, "schema": {"$ref": "#/components/schemas/Severity"}}, {"in": "query", "name": "component", "required": false, "schema": {"$ref": "#/components/schemas/Text"}}]
      responses: {"200": {"description": "Evaluated evidence; empty collections name what was checked through their envelope.", "headers": {"Cache-Control": {"schema": {"type": "string", "const": "no-store"}}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AlertGroups"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}}
  /api/ops/v1/alerts/{key}:
    get:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      operationId: "opsAlertDetail"
      summary: "Read AlertDetail"
      x-cedar-action: "read.alerts"
      security: [{"accessJwt": []}]
      description: "Access JWT identity only; cookies ignored. Cedar decides before reading any source or count. No CORS headers or Set-Cookie. Non-GET/HEAD requires configured Origin plus Sec-Fetch-Site: same-origin, otherwise 403 origin_refused; allowed non-GET falls through to 405."
      parameters: [{"in": "path", "name": "key", "required": true, "schema": {"$ref": "#/components/schemas/Text"}}]
      responses: {"200": {"description": "Evaluated evidence; empty collections name what was checked through their envelope.", "headers": {"Cache-Control": {"schema": {"type": "string", "const": "no-store"}}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AlertDetail"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}}
  /api/ops/v1/events:
    get:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      operationId: "opsEvent"
      summary: "Read Event"
      x-cedar-action: "read.home"
      security: [{"accessJwt": []}]
      description: "Access JWT identity only; cookies ignored. Cedar decides before reading any source or count. No CORS headers or Set-Cookie. Non-GET/HEAD requires configured Origin plus Sec-Fetch-Site: same-origin, otherwise 403 origin_refused; allowed non-GET falls through to 405."
      parameters: [{"in": "header", "name": "Last-Event-ID", "required": false, "schema": {"type": "string", "pattern": "^[0-9]+$"}}]
      responses: {"200": {"description": "Evaluated evidence; empty collections name what was checked through their envelope.", "headers": {"Cache-Control": {"schema": {"type": "string", "const": "no-store"}}}, "content": {"text/event-stream": {"schema": {"$ref": "#/components/schemas/Event"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}}
  /api/ops/v1/home:
    get:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      operationId: "opsHomeSnapshot"
      summary: "Read HomeSnapshot"
      x-cedar-action: "read.home"
      security: [{"accessJwt": []}]
      description: "Access JWT identity only; cookies ignored. Cedar decides before reading any source or count. No CORS headers or Set-Cookie. Non-GET/HEAD requires configured Origin plus Sec-Fetch-Site: same-origin, otherwise 403 origin_refused; allowed non-GET falls through to 405."
      responses: {"200": {"description": "Evaluated evidence; empty collections name what was checked through their envelope.", "headers": {"Cache-Control": {"schema": {"type": "string", "const": "no-store"}}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HomeSnapshot"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}}
  /api/ops/v1/me:
    get:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      operationId: "opsMe"
      summary: "Read Me"
      x-cedar-action: "read.me"
      security: [{"accessJwt": []}]
      description: "Access JWT identity only; cookies ignored. Cedar decides before reading any source or count. No CORS headers or Set-Cookie. Non-GET/HEAD requires configured Origin plus Sec-Fetch-Site: same-origin, otherwise 403 origin_refused; allowed non-GET falls through to 405."
      responses: {"200": {"description": "Evaluated evidence; empty collections name what was checked through their envelope.", "headers": {"Cache-Control": {"schema": {"type": "string", "const": "no-store"}}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Me"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}}
  /api/ops/v1/running:
    get:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      operationId: "opsRunning"
      summary: "Read Running"
      x-cedar-action: "read.running"
      security: [{"accessJwt": []}]
      description: "Access JWT identity only; cookies ignored. Cedar decides before reading any source or count. No CORS headers or Set-Cookie. Non-GET/HEAD requires configured Origin plus Sec-Fetch-Site: same-origin, otherwise 403 origin_refused; allowed non-GET falls through to 405."
      parameters: [{"in": "query", "name": "group", "required": false, "schema": {"$ref": "#/components/schemas/Text"}}, {"in": "query", "name": "state", "required": false, "schema": {"$ref": "#/components/schemas/Health"}}]
      responses: {"200": {"description": "Evaluated evidence; empty collections name what was checked through their envelope.", "headers": {"Cache-Control": {"schema": {"type": "string", "const": "no-store"}}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Running"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}}
  /api/ops/v1/running/jobs:
    get:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      operationId: "opsJobs"
      summary: "Read Jobs"
      x-cedar-action: "read.running"
      security: [{"accessJwt": []}]
      description: "Access JWT identity only; cookies ignored. Cedar decides before reading any source or count. No CORS headers or Set-Cookie. Non-GET/HEAD requires configured Origin plus Sec-Fetch-Site: same-origin, otherwise 403 origin_refused; allowed non-GET falls through to 405."
      responses: {"200": {"description": "Evaluated evidence; empty collections name what was checked through their envelope.", "headers": {"Cache-Control": {"schema": {"type": "string", "const": "no-store"}}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Jobs"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}}
  /api/ops/v1/silences:
    get:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      operationId: "opsSilences"
      summary: "Read Silences"
      x-cedar-action: "read.alerts"
      security: [{"accessJwt": []}]
      description: "Access JWT identity only; cookies ignored. Cedar decides before reading any source or count. No CORS headers or Set-Cookie. Non-GET/HEAD requires configured Origin plus Sec-Fetch-Site: same-origin, otherwise 403 origin_refused; allowed non-GET falls through to 405."
      responses: {"200": {"description": "Evaluated evidence; empty collections name what was checked through their envelope.", "headers": {"Cache-Control": {"schema": {"type": "string", "const": "no-store"}}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Silences"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}}
  /api/ops/v1/sources:
    get:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      operationId: "opsSources"
      summary: "Read Sources"
      x-cedar-action: "read.sources"
      security: [{"accessJwt": []}]
      description: "Access JWT identity only; cookies ignored. Cedar decides before reading any source or count. No CORS headers or Set-Cookie. Non-GET/HEAD requires configured Origin plus Sec-Fetch-Site: same-origin, otherwise 403 origin_refused; allowed non-GET falls through to 405."
      responses: {"200": {"description": "Evaluated evidence; empty collections name what was checked through their envelope.", "headers": {"Cache-Control": {"schema": {"type": "string", "const": "no-store"}}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Sources"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}}
components:
  securitySchemes:
    accessJwt:
      type: apiKey
      in: header
      name: Cf-Access-Jwt-Assertion
  responses:
    Forbidden:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      description: "OPS_NOT_OPERATOR, OPS_GRANT_NOT_LIVE, OPS_ACTION_DENIED, origin_refused"
      headers: {"Cache-Control": {"schema": {"type": "string", "const": "no-store"}}}
      content: {"application/json": {"schema": {"allOf": [{"$ref": "#/components/schemas/Error"}, {"properties": {"code": {"enum": ["OPS_NOT_OPERATOR", "OPS_GRANT_NOT_LIVE", "OPS_ACTION_DENIED", "origin_refused"]}}}]}}}
    Unauthorized:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      description: "OPS_ACCESS_JWT_MISSING, OPS_ACCESS_JWT_INVALID, OPS_ACCESS_AUD_MISMATCH"
      headers: {"Cache-Control": {"schema": {"type": "string", "const": "no-store"}}}
      content: {"application/json": {"schema": {"allOf": [{"$ref": "#/components/schemas/Error"}, {"properties": {"code": {"enum": ["OPS_ACCESS_JWT_MISSING", "OPS_ACCESS_JWT_INVALID", "OPS_ACCESS_AUD_MISMATCH"]}}}]}}}
  schemas:
    AlertDetail:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      type: "object"
      required: ["evaluated_at", "group"]
      properties:
        evaluated_at: {"$ref": "#/components/schemas/Timestamp"}
        group: {"$ref": "#/components/schemas/AlertGroupDetail"}
    AlertGroup:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      type: "object"
      required: ["key", "alertname", "component", "severity", "state", "since", "members_n", "summary", "value_vs_threshold"]
      properties:
        key: {"$ref": "#/components/schemas/Text"}
        alertname: {"$ref": "#/components/schemas/Text"}
        component: {"$ref": "#/components/schemas/ObservedText"}
        severity: {"$ref": "#/components/schemas/ObservedSeverity"}
        state: {"$ref": "#/components/schemas/ObservedAlertState"}
        since: {"$ref": "#/components/schemas/ObservedTimestamp"}
        members_n: {"$ref": "#/components/schemas/ObservedCount"}
        summary: {"$ref": "#/components/schemas/ObservedText"}
        value_vs_threshold: {"$ref": "#/components/schemas/ValueVsThreshold"}
        lead: {"$ref": "#/components/schemas/ObservedText"}
      description: "Group key is alertname × component; until AS-SCHEMA-LINT instruments component, fall back to alertname × job. Missing component, impact and first_action are Unknown: not instrumented, never fabricated."
    AlertGroupDetail:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      allOf: [{"$ref": "#/components/schemas/AlertGroup"}, {"type": "object", "required": ["impact", "probable_cause", "first_action", "notices", "rule", "members", "changes", "links", "footer_key"], "properties": {"impact": {"$ref": "#/components/schemas/ObservedText"}, "probable_cause": {"$ref": "#/components/schemas/ObservedText"}, "first_action": {"$ref": "#/components/schemas/ObservedText"}, "notices": {"type": "array", "items": {"$ref": "#/components/schemas/ObservedText"}}, "rule": {"$ref": "#/components/schemas/Rule"}, "members": {"type": "array", "items": {"$ref": "#/components/schemas/AlertMember"}}, "changes": {"type": "array", "items": {"$ref": "#/components/schemas/Change"}}, "links": {"type": "array", "items": {"$ref": "#/components/schemas/ObservedText"}}, "footer_key": {"$ref": "#/components/schemas/Text"}}, "description": "Detail order: summary, impact, value and since, probable cause, first action, notices, rule/current value, members, changes in the preceding 2 h, plain-text links, footer key."}]
    AlertGroups:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      type: "object"
      required: ["evaluated_at", "groups", "count"]
      properties:
        evaluated_at: {"$ref": "#/components/schemas/Timestamp"}
        groups: {"type": "array", "items": {"$ref": "#/components/schemas/AlertGroup"}}
        count: {$ref: '#/components/schemas/ObservedCount'}
    AlertMember:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      type: "object"
      required: ["fingerprint", "labels", "state", "since"]
      properties:
        fingerprint: {"$ref": "#/components/schemas/Text"}
        labels: {"type": "object", "additionalProperties": {"$ref": "#/components/schemas/Text"}}
        state: {"$ref": "#/components/schemas/ObservedAlertState"}
        since: {"$ref": "#/components/schemas/ObservedTimestamp"}
    AlertMessage:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      type: "string"
      enum: ["FIRING", "UPDATE", "STILL FIRING", "RESOLVED"]
    AlertState:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      type: "string"
      enum: ["Firing", "Acked", "Silenced", "Inhibited", "Resolved"]
    Budget:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      type: "object"
      required: ["key", "remaining_percent", "burn_1h", "burn_6h", "exhaustion_s", "requests_30d"]
      properties:
        key: {"$ref": "#/components/schemas/Text"}
        remaining_percent: {"$ref": "#/components/schemas/ObservedNumber"}
        burn_1h: {"$ref": "#/components/schemas/ObservedNumber"}
        burn_6h: {"$ref": "#/components/schemas/ObservedNumber"}
        exhaustion_s: {"$ref": "#/components/schemas/ObservedNumber"}
        requests_30d: {"$ref": "#/components/schemas/ObservedCount"}
    Change:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      type: "object"
      required: ["at", "summary"]
      properties:
        at: {"$ref": "#/components/schemas/ObservedTimestamp"}
        summary: {"$ref": "#/components/schemas/ObservedText"}
    Changing:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      type: "object"
      required: ["key", "digest", "colour", "canary_step", "bundle_sha", "preview_candidate", "maintenance_window", "weight_percent", "watch_until", "freeze", "next"]
      properties:
        key: {"$ref": "#/components/schemas/Text"}
        digest: {"$ref": "#/components/schemas/ObservedText"}
        colour: {"$ref": "#/components/schemas/ObservedText"}
        canary_step: {"$ref": "#/components/schemas/ObservedText"}
        bundle_sha: {"$ref": "#/components/schemas/ObservedText"}
        preview_candidate: {"$ref": "#/components/schemas/ObservedText"}
        maintenance_window: {"$ref": "#/components/schemas/ObservedText"}
        weight_percent: {"$ref": "#/components/schemas/ObservedNumber"}
        watch_until: {"$ref": "#/components/schemas/ObservedTimestamp"}
        freeze: {"$ref": "#/components/schemas/ObservedBoolean"}
        next: {"$ref": "#/components/schemas/Link"}
    Component:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      type: "object"
      required: ["key", "group", "host", "health", "drift", "source", "observed_at", "age", "runbook", "membership"]
      properties:
        key: {"$ref": "#/components/schemas/Text"}
        group: {"$ref": "#/components/schemas/Text"}
        host: {"$ref": "#/components/schemas/Text"}
        health: {"$ref": "#/components/schemas/ObservedHealth"}
        drift: {"$ref": "#/components/schemas/ObservedDrift"}
        image: {"$ref": "#/components/schemas/ObservedText"}
        digest: {"$ref": "#/components/schemas/ObservedText"}
        started: {"$ref": "#/components/schemas/ObservedTimestamp"}
        source: {"$ref": "#/components/schemas/Text"}
        observed_at: {"anyOf": [{"$ref": "#/components/schemas/Timestamp"}, {"type": "null"}]}
        age: {"type": "integer", "minimum": 0}
        last_error: {"$ref": "#/components/schemas/ObservedText"}
        runbook: {"$ref": "#/components/schemas/ObservedText"}
        membership: {"type": "string", "enum": ["Declared", "Extra"]}
      description: "Declared but absent is Missing; observed but undeclared is Extra (inventory membership, not a health ladder word). Image, digest, started and last_error, when included, carry their own evidence."
    Cost:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      type: "object"
      required: ["key", "mtd", "lag_s", "billed_skus", "limits"]
      properties:
        key: {"$ref": "#/components/schemas/Text"}
        mtd: {"$ref": "#/components/schemas/ObservedNumber"}
        lag_s: {"$ref": "#/components/schemas/ObservedCount"}
        billed_skus: {"$ref": "#/components/schemas/ObservedCount"}
        limits: {"type": "array", "items": {"$ref": "#/components/schemas/FreeTierMeter"}}
    Credential:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      type: "string"
      enum: ["OK", "Due", "Overdue", "Unknown", "Missing", "Planned"]
    DataSafety:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      type: "object"
      required: ["repository", "rpo_s", "limit_s", "last_base_backup", "last_proven_restore"]
      properties:
        repository: {"$ref": "#/components/schemas/Text"}
        rpo_s: {"$ref": "#/components/schemas/ObservedNumber"}
        limit_s: {"$ref": "#/components/schemas/ObservedNumber"}
        last_base_backup: {"$ref": "#/components/schemas/ObservedTimestamp"}
        last_proven_restore: {"$ref": "#/components/schemas/ObservedTimestamp"}
    Drift:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      type: "string"
      enum: ["Synced", "OutOfSync", "Unknown"]
    Error:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      type: "object"
      required: ["evaluated_at", "support_ref", "code", "message"]
      properties:
        evaluated_at: {"$ref": "#/components/schemas/Timestamp"}
        support_ref: {"$ref": "#/components/schemas/Text"}
        code: {"$ref": "#/components/schemas/RefusalCode"}
        message: {"$ref": "#/components/schemas/Text"}
      additionalProperties: false
    Event:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      oneOf: [{"type": "object", "required": ["type", "id", "evaluated_at", "home"], "properties": {"type": {"type": "string", "const": "home.changed"}, "id": {"type": "integer", "minimum": 1}, "evaluated_at": {"$ref": "#/components/schemas/Timestamp"}, "home": {"$ref": "#/components/schemas/HomeSnapshot"}}}, {"type": "object", "required": ["type", "id", "evaluated_at", "group"], "properties": {"type": {"type": "string", "const": "alert.group.changed"}, "id": {"type": "integer", "minimum": 1}, "evaluated_at": {"$ref": "#/components/schemas/Timestamp"}, "group": {"$ref": "#/components/schemas/AlertGroupDetail"}}}, {"type": "object", "required": ["type", "id", "evaluated_at", "group"], "properties": {"type": {"type": "string", "const": "alert.group.resolved"}, "id": {"type": "integer", "minimum": 1}, "evaluated_at": {"$ref": "#/components/schemas/Timestamp"}, "group": {"$ref": "#/components/schemas/AlertGroupDetail"}}}, {"type": "object", "required": ["type", "id", "evaluated_at", "component"], "properties": {"type": {"type": "string", "const": "component.changed"}, "id": {"type": "integer", "minimum": 1}, "evaluated_at": {"$ref": "#/components/schemas/Timestamp"}, "component": {"$ref": "#/components/schemas/Component"}}}, {"type": "object", "required": ["type", "id", "evaluated_at", "job"], "properties": {"type": {"type": "string", "const": "job.changed"}, "id": {"type": "integer", "minimum": 1}, "evaluated_at": {"$ref": "#/components/schemas/Timestamp"}, "job": {"$ref": "#/components/schemas/Job"}}}, {"type": "object", "required": ["type", "id", "evaluated_at", "source"], "properties": {"type": {"type": "string", "const": "source.changed"}, "id": {"type": "integer", "minimum": 1}, "evaluated_at": {"$ref": "#/components/schemas/Timestamp"}, "source": {"$ref": "#/components/schemas/Source"}}}, {"type": "object", "required": ["type", "id", "evaluated_at"], "properties": {"type": {"type": "string", "const": "heartbeat"}, "id": {"type": "integer", "minimum": 1}, "evaluated_at": {"$ref": "#/components/schemas/Timestamp"}}}, {"type": "object", "required": ["type", "id", "evaluated_at"], "properties": {"type": {"type": "string", "const": "resync"}, "id": {"type": "integer", "minimum": 1}, "evaluated_at": {"$ref": "#/components/schemas/Timestamp"}}}]
      discriminator: {"propertyName": "type"}
      description: "SSE event/data type and monotonic id agree. Filter home by read.home, alert groups by read.alerts, components/jobs by read.running, sources by read.sources. Heartbeat every 15 s. Resume from Last-Event-ID; an evicted sequence emits resync. No event data is delivered to a refused operator."
    Evidence:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      type: "object"
      required: ["counts", "sources"]
      properties:
        counts: {"type": "object", "required": ["Verified", "Monitoring", "Stale", "Unknown"], "properties": {"Verified": {"type": "integer", "minimum": 0}, "Monitoring": {"type": "integer", "minimum": 0}, "Stale": {"type": "integer", "minimum": 0}, "Unknown": {"type": "integer", "minimum": 0}}}
        sources: {"type": "array", "items": {"$ref": "#/components/schemas/Source"}}
    EvidenceState:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      type: "string"
      enum: ["Verified", "Monitoring", "Stale", "Unknown"]
    FreeTierMeter:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      type: "object"
      required: ["key", "used", "limit", "warning_ratio"]
      properties:
        key: {"$ref": "#/components/schemas/Text"}
        used: {"$ref": "#/components/schemas/ObservedNumber"}
        limit: {"$ref": "#/components/schemas/ObservedNumber"}
        warning_ratio: {"$ref": "#/components/schemas/ObservedNumber"}
    Grant:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      type: "object"
      required: ["action", "from", "until"]
      properties:
        action: {"$ref": "#/components/schemas/Text"}
        from: {"$ref": "#/components/schemas/Timestamp"}
        until: {"$ref": "#/components/schemas/Timestamp"}
      additionalProperties: false
    Health:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      type: "string"
      enum: ["Healthy", "Progressing", "Suspended", "Degraded", "Missing", "Unknown"]
    HomeSnapshot:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      type: "object"
      required: ["evaluated_at", "verdict", "worklist", "changing", "budgets", "data_safety", "cost", "evidence"]
      properties:
        evaluated_at: {"$ref": "#/components/schemas/Timestamp"}
        verdict: {"$ref": "#/components/schemas/Verdict"}
        worklist: {"type": "array", "items": {"$ref": "#/components/schemas/WorkItem"}}
        changing: {"type": "array", "items": {"$ref": "#/components/schemas/Changing"}}
        budgets: {"type": "array", "items": {"$ref": "#/components/schemas/Budget"}}
        data_safety: {"type": "array", "items": {"$ref": "#/components/schemas/DataSafety"}}
        cost: {"type": "array", "items": {"$ref": "#/components/schemas/Cost"}}
        evidence: {"$ref": "#/components/schemas/Evidence"}
    Incident:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      type: "string"
      enum: ["Investigating", "Identified", "Monitoring", "Resolved"]
    IncidentSeverity:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      type: "string"
      enum: ["SEV1", "SEV2", "SEV3", "SEV4"]
    Job:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      type: "object"
      required: ["name", "state", "last_run", "last_exit", "budget"]
      properties:
        name: {"$ref": "#/components/schemas/Text"}
        state: {"$ref": "#/components/schemas/ObservedJobState"}
        last_run: {"$ref": "#/components/schemas/ObservedTimestamp"}
        last_exit: {"$ref": "#/components/schemas/ObservedNumber"}
        budget: {"$ref": "#/components/schemas/ObservedNumber"}
        next_run: {"$ref": "#/components/schemas/ObservedTimestamp"}
    JobState:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      type: "string"
      enum: ["Succeeded", "Failed", "Late", "Never reported", "Running"]
    Jobs:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      type: "object"
      required: ["evaluated_at", "jobs", "count"]
      properties:
        evaluated_at: {"$ref": "#/components/schemas/Timestamp"}
        jobs: {"type": "array", "items": {"$ref": "#/components/schemas/Job"}}
        count: {$ref: '#/components/schemas/ObservedCount'}
    Link:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      type: "object"
      required: ["href", "label"]
      properties:
        href: {"type": "string", "pattern": "^/(?!/)"}
        label: {"$ref": "#/components/schemas/Text"}
      additionalProperties: false
      description: "Same-origin cockpit navigation only. Runbook and GitHub URLs are plain-text evidence fields, never external navigation links."
    Live:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      type: "string"
      enum: ["Live", "Paused", "Reconnecting", "Offline"]
    Matcher:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      type: "object"
      required: ["name", "value", "is_regex", "is_equal"]
      properties:
        name: {"$ref": "#/components/schemas/Text"}
