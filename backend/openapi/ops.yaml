openapi: 3.1.0
info:
  # SPDX-License-Identifier: LicenseRef-Proprietary
  title: Console operator cockpit
  version: 0.1.0
  description: Database-free operator reads. Separate host and Access audience from the tenant API. All times UTC Z; links to runbooks and GitHub are plain text.
paths:
  /api/ops/v1/actions:
    get:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      operationId: "opsActions"
      summary: "Read Actions"
      x-cedar-action: "read.running"
      security: [{"accessJwt": []}]
      description: "Returns Cmd hand-off history and pending actions from actions spool."
      responses: {"200": {"description": "Actions list.", "headers": {"Cache-Control": {"schema": {"type": "string", "const": "no-store"}}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ActionsList"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}}
  /api/ops/v1/alerts:
    get:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      operationId: "opsAlertGroups"
      summary: "Read AlertGroups"
      x-cedar-action: "read.alerts"
      security: [{"accessJwt": []}]
      description: "Access JWT identity only; cookies ignored. Cedar decides before reading any source or count. No CORS headers or Set-Cookie. Non-GET/HEAD requires configured Origin plus Sec-Fetch-Site: same-origin, otherwise 403 origin_refused; allowed non-GET falls through to 405."
      parameters: [{"in": "query", "name": "state", "required": false, "schema": {"$ref": "#/components/schemas/AlertState"}}, {"in": "query", "name": "severity", "required": false, "schema": {"$ref": "#/components/schemas/Severity"}}, {"in": "query", "name": "component", "required": false, "schema": {"$ref": "#/components/schemas/Text"}}]
      responses: {"200": {"description": "Evaluated evidence; empty collections name what was checked through their envelope.", "headers": {"Cache-Control": {"schema": {"type": "string", "const": "no-store"}}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AlertGroups"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}}
  /api/ops/v1/alerts/{key}:
    get:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      operationId: "opsAlertDetail"
      summary: "Read AlertDetail"
      x-cedar-action: "read.alerts"
      security: [{"accessJwt": []}]
      description: "Access JWT identity only; cookies ignored. Cedar decides before reading any source or count. No CORS headers or Set-Cookie. Non-GET/HEAD requires configured Origin plus Sec-Fetch-Site: same-origin, otherwise 403 origin_refused; allowed non-GET falls through to 405."
      parameters: [{"in": "path", "name": "key", "required": true, "schema": {"$ref": "#/components/schemas/Text"}}]
      responses: {"200": {"description": "Evaluated evidence; empty collections name what was checked through their envelope.", "headers": {"Cache-Control": {"schema": {"type": "string", "const": "no-store"}}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AlertDetail"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}}
  /api/ops/v1/alerts/{key}/ack:
    post:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      operationId: "opsAlertAck"
      summary: "Acknowledge AlertGroup"
      x-cedar-action: "alert.ack"
      security: [{"accessJwt": []}]
      description: "Access JWT identity only; Cedar decides before reading or writing. Non-GET/HEAD requires configured Origin plus Sec-Fetch-Site: same-origin."
      parameters: [{"in": "path", "name": "key", "required": true, "schema": {"$ref": "#/components/schemas/Text"}}]
      requestBody: {"required": false, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AckRequest"}}}}
      responses: {"200": {"description": "Alert group acknowledged and recorded.", "headers": {"Cache-Control": {"schema": {"type": "string", "const": "no-store"}}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AckResponse"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}}
  /api/ops/v1/changes:
    get:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      operationId: "opsChanges"
      summary: "Read Changes"
      x-cedar-action: "read.running"
      security: [{"accessJwt": []}]
      description: "Returns release gates, timeline, and DORA-5 metrics."
      responses: {"200": {"description": "Changes view.", "headers": {"Cache-Control": {"schema": {"type": "string", "const": "no-store"}}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ChangesView"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}}
  /api/ops/v1/changes/canary:
    post:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      operationId: "opsChangesCanary"
      summary: "Draft Canary Cmd"
      x-cedar-action: "change.request.canary-hold"
      x-cedar-actions: ["change.request.canary-hold", "change.request.canary-promote", "change.request.canary-abort"]
      security: [{"accessJwt": []}]
      description: "Records signed canary hold/promote/abort Cmd hand-off in actions spool."
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CanaryRequest"}}}}
      responses: {"201": {"description": "Cmd hand-off recorded.", "headers": {"Cache-Control": {"schema": {"type": "string", "const": "no-store"}}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CmdResponse"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}}
  /api/ops/v1/changes/freeze:
    post:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      operationId: "opsChangesFreeze"
      summary: "Draft Freeze Cmd"
      x-cedar-action: "change.request.freeze"
      x-cedar-actions: ["change.request.freeze", "change.request.unfreeze"]
      security: [{"accessJwt": []}]
      description: "Records signed freeze/unfreeze Cmd hand-off in actions spool."
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/FreezeRequest"}}}}
      responses: {"201": {"description": "Cmd hand-off recorded.", "headers": {"Cache-Control": {"schema": {"type": "string", "const": "no-store"}}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CmdResponse"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}}
  /api/ops/v1/changes/rollback:
    post:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      operationId: "opsChangesRollback"
      summary: "Draft Rollback Cmd"
      x-cedar-action: "change.request.rollback"
      security: [{"accessJwt": []}]
      description: "Records signed rollback Cmd hand-off in actions spool."
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RollbackRequest"}}}}
      responses: {"201": {"description": "Cmd hand-off recorded.", "headers": {"Cache-Control": {"schema": {"type": "string", "const": "no-store"}}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CmdResponse"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}}
  /api/ops/v1/events:
    get:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      operationId: "opsEvent"
      summary: "Read Event"
      x-cedar-action: "read.home"
      security: [{"accessJwt": []}]
      description: "Access JWT identity only; cookies ignored. Cedar decides before reading any source or count. No CORS headers or Set-Cookie. Non-GET/HEAD requires configured Origin plus Sec-Fetch-Site: same-origin, otherwise 403 origin_refused; allowed non-GET falls through to 405."
      parameters: [{"in": "header", "name": "Last-Event-ID", "required": false, "schema": {"type": "string", "pattern": "^[0-9]+$"}}]
      responses: {"200": {"description": "Evaluated evidence; empty collections name what was checked through their envelope.", "headers": {"Cache-Control": {"schema": {"type": "string", "const": "no-store"}}}, "content": {"text/event-stream": {"schema": {"$ref": "#/components/schemas/Event"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}}
  /api/ops/v1/health:
    get:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      operationId: "opsHealth"
      summary: "Read ServiceHealth"
      x-cedar-action: "read.home"
      security: [{"accessJwt": []}]
      description: "Returns internal SLOs, evidence truth, and external public status feed without blending."
      responses: {"200": {"description": "Service health.", "headers": {"Cache-Control": {"schema": {"type": "string", "const": "no-store"}}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ServiceHealthView"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}}
  /api/ops/v1/home:
    get:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      operationId: "opsHomeSnapshot"
      summary: "Read HomeSnapshot"
      x-cedar-action: "read.home"
      security: [{"accessJwt": []}]
      description: "Access JWT identity only; cookies ignored. Cedar decides before reading any source or count. No CORS headers or Set-Cookie. Non-GET/HEAD requires configured Origin plus Sec-Fetch-Site: same-origin, otherwise 403 origin_refused; allowed non-GET falls through to 405."
      responses: {"200": {"description": "Evaluated evidence; empty collections name what was checked through their envelope.", "headers": {"Cache-Control": {"schema": {"type": "string", "const": "no-store"}}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HomeSnapshot"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}}
  /api/ops/v1/incidents:
    get:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      operationId: "opsIncidentsList"
      summary: "List Incidents"
      x-cedar-action: "read.home"
      security: [{"accessJwt": []}]
      description: "Lists incidents replayed from the incidents spool."
      responses: {"200": {"description": "Incidents list.", "headers": {"Cache-Control": {"schema": {"type": "string", "const": "no-store"}}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/IncidentsList"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}}
    post:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      operationId: "opsIncidentDeclare"
      summary: "Declare Incident"
      x-cedar-action: "incident.write"
      security: [{"accessJwt": []}]
      description: "Declares a new incident in the incidents spool."
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/DeclareIncidentRequest"}}}}
      responses: {"201": {"description": "Incident declared.", "headers": {"Cache-Control": {"schema": {"type": "string", "const": "no-store"}}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/IncidentResponse"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}}
  /api/ops/v1/incidents/{id}:
    get:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      operationId: "opsIncidentDetail"
      summary: "Read Incident"
      x-cedar-action: "read.home"
      security: [{"accessJwt": []}]
      description: "Returns incident detail, timeline, legal clocks, and attached public card."
      parameters: [{"in": "path", "name": "id", "required": true, "schema": {"$ref": "#/components/schemas/Text"}}]
      responses: {"200": {"description": "Incident detail.", "headers": {"Cache-Control": {"schema": {"type": "string", "const": "no-store"}}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/IncidentResponse"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}}
  /api/ops/v1/incidents/{id}/events:
    post:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      operationId: "opsIncidentEvent"
      summary: "Record Incident Event"
      x-cedar-action: "incident.write"
      security: [{"accessJwt": []}]
      description: "Appends an incident mutation with prev/expected_seq optimistic lock and SEV1/2 postmortem gate."
      parameters: [{"in": "path", "name": "id", "required": true, "schema": {"$ref": "#/components/schemas/Text"}}]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/IncidentEventRequest"}}}}
      responses: {"200": {"description": "Incident updated.", "headers": {"Cache-Control": {"schema": {"type": "string", "const": "no-store"}}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/IncidentResponse"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}}
  /api/ops/v1/incidents/{id}/public-draft:
    post:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      operationId: "opsIncidentPublicDraft"
      summary: "Draft Public Status Update"
      x-cedar-action: "incident.publish"
      security: [{"accessJwt": []}]
      description: "Records public update draft and generates tb status publish Cmd hand-off."
      parameters: [{"in": "path", "name": "id", "required": true, "schema": {"$ref": "#/components/schemas/Text"}}]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PublicDraftRequest"}}}}
      responses: {"201": {"description": "Public update draft and Cmd hand-off recorded.", "headers": {"Cache-Control": {"schema": {"type": "string", "const": "no-store"}}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PublicDraftResponse"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}}
  /api/ops/v1/me:
    get:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      operationId: "opsMe"
      summary: "Read Me"
      x-cedar-action: "read.me"
      security: [{"accessJwt": []}]
      description: "Access JWT identity only; cookies ignored. Cedar decides before reading any source or count. No CORS headers or Set-Cookie. Non-GET/HEAD requires configured Origin plus Sec-Fetch-Site: same-origin, otherwise 403 origin_refused; allowed non-GET falls through to 405."
      responses: {"200": {"description": "Evaluated evidence; empty collections name what was checked through their envelope.", "headers": {"Cache-Control": {"schema": {"type": "string", "const": "no-store"}}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Me"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}}
  /api/ops/v1/obligations:
    get:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      operationId: "opsObligationsList"
      summary: "List Obligations"
      x-cedar-action: "obligation.read"
      security: [{"accessJwt": []}]
      description: "Lists operational obligations and launch readiness status; degrades to Unknown on broken record chain."
      parameters: [{"in": "query", "name": "kind", "required": false, "schema": {"$ref": "#/components/schemas/ObligationKind"}}, {"in": "query", "name": "state", "required": false, "schema": {"$ref": "#/components/schemas/ObligationState"}}]
      responses: {"200": {"description": "Obligations list.", "headers": {"Cache-Control": {"schema": {"type": "string", "const": "no-store"}}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ObligationsList"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}}
    post:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      operationId: "opsObligationOpen"
      summary: "Open Obligation"
      x-cedar-action: "obligation.write"
      security: [{"accessJwt": []}]
      description: "Opens a new operational obligation in obligations spool."
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/OpenObligationRequest"}}}}
      responses: {"201": {"description": "Obligation opened.", "headers": {"Cache-Control": {"schema": {"type": "string", "const": "no-store"}}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ObligationWriteResponse"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}}
  /api/ops/v1/obligations/{id}:
    get:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      operationId: "opsObligationDetail"
      summary: "Read Obligation Detail"
      x-cedar-action: "obligation.read"
      security: [{"accessJwt": []}]
      description: "Returns a single operational obligation and its full spool event log."
      parameters: [{"in": "path", "name": "id", "required": true, "schema": {"$ref": "#/components/schemas/Text"}}]
      responses: {"200": {"description": "Obligation detail.", "headers": {"Cache-Control": {"schema": {"type": "string", "const": "no-store"}}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ObligationDetail"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}}
  /api/ops/v1/obligations/{id}/events:
    post:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      operationId: "opsObligationEvent"
      summary: "Append Obligation Event"
      x-cedar-action: "obligation.write"
      security: [{"accessJwt": []}]
      description: "Appends an obligation lifecycle transition to the obligations spool."
      parameters: [{"in": "path", "name": "id", "required": true, "schema": {"$ref": "#/components/schemas/Text"}}]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ObligationEventRequest"}}}}
      responses: {"200": {"description": "Obligation updated.", "headers": {"Cache-Control": {"schema": {"type": "string", "const": "no-store"}}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ObligationWriteResponse"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}}
  /api/ops/v1/oncall:
    get:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      operationId: "opsOncall"
      summary: "Read Oncall"
      x-cedar-action: "read.alerts"
      security: [{"accessJwt": []}]
      description: "Returns on-call schedule configuration and synthetic page test status."
      responses: {"200": {"description": "On-call status.", "headers": {"Cache-Control": {"schema": {"type": "string", "const": "no-store"}}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/OncallView"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}}
  /api/ops/v1/oncall/page-test:
    post:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      operationId: "opsOncallPageTest"
      summary: "Draft Synthetic Page Test Cmd"
      x-cedar-action: "jobs.rerun"
      security: [{"accessJwt": []}]
      description: "Records signed Cmd hand-off for synthetic on-call page test."
      responses: {"201": {"description": "Cmd hand-off recorded.", "headers": {"Cache-Control": {"schema": {"type": "string", "const": "no-store"}}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CmdResponse"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}}
  /api/ops/v1/promote:
    get:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      operationId: "opsPromote"
      summary: "Read Promote"
      x-cedar-action: "read.running"
      security: [{"accessJwt": []}]
      description: "Returns staging promotion candidate, signoffs, feedback queue, and request handoff state."
      responses: {"200": {"description": "Promote view.", "headers": {"Cache-Control": {"schema": {"type": "string", "const": "no-store"}}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PromoteView"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}}
  /api/ops/v1/promote/feedback:
    post:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      operationId: "opsPromoteFeedback"
      summary: "Triage Beta Feedback"
      x-cedar-action: "feedback.triage"
      security: [{"accessJwt": []}]
      description: "Records beta feedback triage disposition in feedback spool."
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/FeedbackRequest"}}}}
      responses: {"201": {"description": "Feedback triage recorded.", "headers": {"Cache-Control": {"schema": {"type": "string", "const": "no-store"}}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/FeedbackResponse"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}}
  /api/ops/v1/promote/request:
    post:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      operationId: "opsPromoteRequest"
      summary: "Draft Promote Cmd"
      x-cedar-action: "change.request.promote"
      security: [{"accessJwt": []}]
      description: "Records signed promote Cmd hand-off in actions spool."
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PromoteRequest"}}}}
      responses: {"201": {"description": "Cmd hand-off recorded.", "headers": {"Cache-Control": {"schema": {"type": "string", "const": "no-store"}}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CmdResponse"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}}
  /api/ops/v1/promote/signoff:
    post:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      operationId: "opsPromoteSignoff"
      summary: "Record Promotion Signoff"
      x-cedar-action: "promotion.signoff"
      security: [{"accessJwt": []}]
      description: "Records signed staging promotion signoff in promote spool."
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/SignoffRequest"}}}}
      responses: {"201": {"description": "Signoff recorded.", "headers": {"Cache-Control": {"schema": {"type": "string", "const": "no-store"}}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/SignoffResponse"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}}
  /api/ops/v1/recovery:
    get:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      operationId: "opsRecovery"
      summary: "Read Recovery"
      x-cedar-action: "recovery.read"
      security: [{"accessJwt": []}]
      description: "Returns backup RPO, base backups, drill records, and RTO Unknown status."
      responses: {"200": {"description": "Recovery view.", "headers": {"Cache-Control": {"schema": {"type": "string", "const": "no-store"}}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RecoveryView"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}}
  /api/ops/v1/recovery/backup:
    post:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      operationId: "opsRecoveryBackup"
      summary: "Draft Backup Cmd"
      x-cedar-action: "change.request.backup-now"
      security: [{"accessJwt": []}]
      description: "Records signed backup-now Cmd hand-off in actions spool."
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/BackupRequest"}}}}
      responses: {"201": {"description": "Cmd hand-off recorded.", "headers": {"Cache-Control": {"schema": {"type": "string", "const": "no-store"}}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CmdResponse"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}}
  /api/ops/v1/recovery/drill:
    post:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      operationId: "opsRecoveryDrill"
      summary: "Draft Recovery Drill Cmd"
      x-cedar-action: "change.request.drill"
      x-cedar-actions: ["change.request.drill", "change.request.drill-at"]
      security: [{"accessJwt": []}]
      description: "Records signed recovery drill Cmd hand-off in actions spool; rejects tenant inputs."
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/DrillRequest"}}}}
      responses: {"201": {"description": "Cmd hand-off recorded.", "headers": {"Cache-Control": {"schema": {"type": "string", "const": "no-store"}}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CmdResponse"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}}
  /api/ops/v1/runbooks:
    get:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      operationId: "opsRunbooks"
      summary: "List Runbooks"
      x-cedar-action: "read.running"
      security: [{"accessJwt": []}]
      description: "Lists markdown runbooks available in the mounted runbooks directory."
