      allOf: [{"$ref": "#/components/schemas/Observation"}, {"properties": {"value": {"anyOf": [{"anyOf": [{"$ref": "#/components/schemas/Health"}, {"$ref": "#/components/schemas/Drift"}, {"$ref": "#/components/schemas/EvidenceState"}, {"$ref": "#/components/schemas/PublicComponent"}, {"$ref": "#/components/schemas/AlertState"}, {"$ref": "#/components/schemas/Severity"}, {"$ref": "#/components/schemas/Incident"}, {"$ref": "#/components/schemas/IncidentSeverity"}, {"$ref": "#/components/schemas/Promotion"}, {"$ref": "#/components/schemas/Credential"}, {"$ref": "#/components/schemas/JobState"}, {"$ref": "#/components/schemas/Recovery"}, {"$ref": "#/components/schemas/TwoPerson"}, {"$ref": "#/components/schemas/Live"}]}, {"type": "null"}]}}}]
    ObservedText:
