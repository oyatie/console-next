      type: "string"
      enum: ["OPS_ACCESS_JWT_MISSING", "OPS_ACCESS_JWT_INVALID", "OPS_ACCESS_AUD_MISMATCH", "OPS_NOT_OPERATOR", "OPS_GRANT_NOT_LIVE", "OPS_ACTION_DENIED", "OPS_CONFIG_INVALID", "origin_refused"]
      description: "OPS_CONFIG_INVALID is a startup refusal (exit 78, file and JSON pointer), never an HTTP response. origin_refused is the whole-router non-GET/HEAD origin guard."
    Release:
