      allOf: [{"$ref": "#/components/schemas/Observation"}, {"properties": {"value": {"anyOf": [{"$ref": "#/components/schemas/Health"}, {"type": "null"}]}}}]
    ObservedJobState:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      allOf: [{"$ref": "#/components/schemas/Observation"}, {"properties": {"value": {"anyOf": [{"$ref": "#/components/schemas/JobState"}, {"type": "null"}]}}}]
    ObservedNumber:
