      properties:
        evaluated_at: {"$ref": "#/components/schemas/Timestamp"}
        operator: {"type": "object", "required": ["person", "display_email"], "properties": {"person": {"type": "string", "format": "uuid"}, "display_email": {"type": "string", "format": "email"}}}
        grants: {"type": "array", "items": {"$ref": "#/components/schemas/Grant"}}
        allowed_actions: {"type": "array", "items": {"$ref": "#/components/schemas/Text"}}
    Observation:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      type: "object"
      required: ["state", "value", "unit", "source", "observed_at", "age_s", "reason"]
      properties:
        state: {"$ref": "#/components/schemas/EvidenceState"}
        value: {}
        unit: {"anyOf": [{"$ref": "#/components/schemas/Text"}, {"type": "null"}]}
        source: {"$ref": "#/components/schemas/Text"}
        observed_at: {"anyOf": [{"$ref": "#/components/schemas/Timestamp"}, {"type": "null"}]}
        age_s: {"type": "integer", "minimum": 0}
        reason: {"anyOf": [{"$ref": "#/components/schemas/Text"}, {"type": "null"}]}
      additionalProperties: false
      description: "Every displayed value carries evidence. Age > 2 × declared interval becomes Unknown, drops the current value and gives reason stale <age>. Unknown renders as Unknown: <reason>; absent series, failed reads and not instrumented are never green."
      oneOf: [{"properties": {"state": {"enum": ["Verified", "Monitoring"]}, "value": {"not": {"type": "null"}}, "observed_at": {"$ref": "#/components/schemas/Timestamp"}, "reason": {"type": "null"}}}, {"properties": {"state": {"const": "Stale"}, "value": {"not": {"type": "null"}}, "observed_at": {"$ref": "#/components/schemas/Timestamp"}, "reason": {"$ref": "#/components/schemas/Text"}}}, {"properties": {"state": {"const": "Unknown"}, "value": {"type": "null"}, "reason": {"$ref": "#/components/schemas/Text"}}}]
    ObservedAlertState:
      # SPDX-License-Identifier: LicenseRef-Proprietary
      allOf: [{"$ref": "#/components/schemas/Observation"}, {"properties": {"value": {"anyOf": [{"$ref": "#/components/schemas/AlertState"}, {"type": "null"}]}}}]
    ObservedBoolean:
