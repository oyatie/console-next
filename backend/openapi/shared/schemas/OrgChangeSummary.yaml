      type: object
      required:
      - id
      - code
      - kind
      - status
      - target
      - effectiveDate
      - reason
      - headcount
      - siteCount
      - teamCount
      - draftedBy
      - draftedByName
      - createdAt
      - updatedAt
      properties:
        commandId:
          $ref: '#/components/schemas/Uuid'
          description: Latest successful command on this request, when recorded in the outcome ledger.
        id:
          $ref: '#/components/schemas/Uuid'
        code:
          type: string
          description: Server-issued display code `OC-YYYY-NNNN`.
        kind:
          $ref: '#/components/schemas/OrgChangeKind'
        status:
          $ref: '#/components/schemas/OrgChangeStatus'
        target:
          $ref: '#/components/schemas/OrgChangeTarget'
        effectiveDate:
          $ref: '#/components/schemas/Date'
        applies_at:
          $ref: '#/components/schemas/Timestamp'
          description: Configured scheduled application instant in UTC; omitted for immediate and terminal changes.
        created_unit_ids:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
          description: Actual canonical unit identifiers returned by the applied creation commands, in proposal order.
        reason:
          type: string
        headcount:
          type: integer
          format: int64
        siteCount:
          type: integer
          format: int64
        teamCount:
          type: integer
          format: int64
        draftedBy:
          $ref: '#/components/schemas/Uuid'
        draftedByName:
          type: [string, 'null']
          description: The drafter's display name, resolved server-side within the tenant; null when unknown.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        supersedesId:
          $ref: '#/components/schemas/Uuid'
