# SPDX-License-Identifier: LicenseRef-Proprietary
type: object
additionalProperties: false
required: [continuity, group_service_start_date, consent_date, consent_evidence_ref]
description: E-S3b group transfer facts. The consent is an attested offline fact with its evidence (Civil Act §657①;
  decisions 3). Continuity is chosen per dimension (severance pay, annual leave, service; design/inter-entity-transfer T2), none
  defaulted; whether continuous employment legally carries over is listed for the labor attorney. A group transfer whose severance pay is SETTLED opens
  the sending legal entity's settlement case (an exit case with exit_reason_code GROUP_TRANSFER, its exit event the group transfer)
  in the same transaction; 409 exit_case_open when the person already has an open exit case.
properties:
  continuity:
    type: string
    enum: [SETTLED, CARRIED]
    description: Severance pay. SETTLED - paid by the sending legal entity. CARRIED - succession (needs succession_evidence_ref). When
      neither annual_leave_continuity nor seniority_continuity is sent, this one choice names all three (SETTLED
      settles annual leave and restarts service; CARRIED carries both), as before T2; naming either requires both.
  annual_leave_continuity:
    type: string
    enum: [SETTLED, CARRIED]
    description: Annual leave. SETTLED - pay for unused annual leave paid by the sending legal entity. CARRIED - the balance and annual-leave year
      carried (needs succession_evidence_ref).
  seniority_continuity:
    type: string
    enum: [RESTART, CARRIED]
    description: Service. RESTART - counted from effective_date. CARRIED - counted from the group hire date (needs
      succession_evidence_ref).
  settlement_case_id:
    $ref: '#/components/schemas/Uuid'
    readOnly: true
    description: The sending legal entity's settlement case the group transfer opened (severance pay SETTLED only).
  group_service_start_date:
    $ref: '#/components/schemas/Date'
    description: Group hire date, carried in either case; on or before effective_date.
  consent_date:
    $ref: '#/components/schemas/Date'
    description: The day the employee consented; on or before effective_date.
  consent_evidence_ref:
    type: string
    minLength: 1
    maxLength: 500
    description: Attachment or document reference for the consent.
  succession_evidence_ref:
    type: string
    minLength: 1
    maxLength: 500
    description: Required when any dimension is CARRIED. The succession agreement's reference.
  from_legal_entity_id:
    $ref: '#/components/schemas/Uuid'
    readOnly: true
  to_legal_entity_id:
    $ref: '#/components/schemas/Uuid'
    readOnly: true
