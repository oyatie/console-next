# cargo-deny supply-chain policy. Complements `cargo audit` (RUSTSEC advisories)
# with license compliance, source restriction, and duplicate/wildcard checks.
# Run: `cargo deny --manifest-path backend/Cargo.toml check`.

[advisories]
version = 2
# Yanked crates and unmaintained/vulnerable advisories fail the check. cargo
# audit already gates RUSTSEC in CI; this keeps the policy self-contained.
yanked = "deny"
# Must equal backend/.cargo/audit.toml; each line carries
# '# expires YYYY-MM-DD: reason' (enforced by scripts/check-audit-ignores.mjs).
ignore = [
  # rsa: retained in Cargo.lock by sqlx 0.8's optional MySQL dependency through
  # apalis-postgres. It is absent from the resolved all-target feature graph,
  # so no RSA implementation is compiled from this crate. No fixed rsa release
  # exists; remove this exception when the jobs stack moves to sqlx 0.9.
  "RUSTSEC-2023-0071", # expires 2027-01-07: rsa is lockfile-only via sqlx 0.8 optional MySQL metadata and absent from the all-target build graph; no fixed release
  # paste: unmaintained (not a vulnerability). Build-time proc-macro pulled
  # transitively by umya-spreadsheet (Excel export); no runtime attack surface.
  "RUSTSEC-2024-0436", # expires 2027-01-07: paste is unmaintained, not vulnerable; build-time proc-macro via umya-spreadsheet, no runtime surface
  "RUSTSEC-2026-0441", # expires 2027-02-05: pin-utils is unmaintained, not vulnerable; via async-imap (comms IMAP adapter, not in MVP), 0.12 still depends on it
  # libsqlite3-sys (C SQLite CVE): retained in Cargo.lock by the optional SQLite
  # driver of sqlx 0.8 (via apalis-postgres) and sqlx 0.9. No workspace crate
  # enables it, so `cargo tree -i libsqlite3-sys --workspace --target all
  # -e normal,build,dev` prints nothing and no SQLite is compiled. The fixed
  # release (>=0.39) is outside sqlx's accepted range; remove this exception
  # when sqlx moves to it.
  "RUSTSEC-2026-0459", # expires 2027-01-09: libsqlite3-sys is lockfile-only via sqlx's optional SQLite driver and absent from the all-target build graph; fixed 0.39 is outside sqlx's range
]

[licenses]
version = 2
# Permissive licenses the dependency tree is allowed to use. Add deliberately,
# never to silence a surprise copyleft dependency.
allow = [
  "MIT",
  # quoted_printable is 0BSD via lettre SMTP; permissive/no-attribution.
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "BSL-1.0",
  "OpenSSL",
  "CDLA-Permissive-2.0",
]
# The workspace crates are LicenseRef-Proprietary; skip first-party members.
private = { ignore = true }

[bans]
# Surface (don't fail on) version skew and wildcard deps — these are advisory
# signals, not hard gates, for a workspace this size.
multiple-versions = "warn"
wildcards = "warn"
# XChaCha credential envelopes remain readable on 0.10.1; 0.11 broke the
# inherited cipher. Upgrade only with pinned old-ciphertext compatibility proof.
deny = [{ name = "chacha20poly1305", version = ">=0.11" }]

[sources]
# Only crates.io. Any unknown registry or git source is a supply-chain risk.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
