# SPDX-License-Identifier: LicenseRef-Proprietary
# Licence gate for the desktop shell (public-readiness L-7), backend/deny.toml's allow list, trimmed to what this graph uses.
# Run: npm run desktop:licenses  (cargo deny check licenses for the Windows target the installer ships)

[graph]
targets = ["x86_64-pc-windows-msvc"]

[licenses]
version = 2
allow = [
  "MIT",
  "0BSD",
  "Apache-2.0",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "Unicode-3.0",
  "CC0-1.0",
]
# The desktop crate itself is LicenseRef-Proprietary.
private = { ignore = true }
