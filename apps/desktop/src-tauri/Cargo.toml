[package]
name = "console-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "LicenseRef-Proprietary"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }
url = "2"

[dependencies]
tauri = { version = "=2.12.2", features = [] }
tauri-plugin-single-instance = { version = "=2.5.3", features = ["deep-link"] }
tauri-plugin-window-state = "=2.5.0"
tauri-plugin-deep-link = "=2.6.2"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-updater = "=2.14.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Already in the tree through the deep-link plugin; reads the policy key.
[target.'cfg(windows)'.dependencies]
windows-registry = "0.100"
