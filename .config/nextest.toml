# ADR-0039 / DN-0005 P3: serial minority for cluster-global mutators.
# Only these filters use max-threads = 1; the rest stay parallel.
#
# The CI release pin and checksum live in .github/workflows/ci.yml.
# Local: install that cargo-nextest release with cargo install --locked, or a compatible newer release.

[test-groups.cluster-global]
max-threads = 1

# Use binary() for whole suites and test() for individual role mutators.
# The old `test(/apalis_adapter/)` form grouped only the tests whose
# own name happened to contain the binary name. Measured 2026-08-18 with
# `cargo nextest show-config test-groups`: apalis_adapter 1 of 4 tests grouped,
# apalis_schema_contract 1 of 1, and leave_migration_expand_contract 0 of 9 -- the
# serial control covered 2 of 14 tests across those binaries while reading as if it
# covered all of them. With binary() the same three report 4/4, 1/1 and 9/9.
[[profile.default.overrides]]
filter = '''
  binary(leave_migration_expand_contract)
  + binary(key_revision_migration_upgrade)
  + binary(attendance_console_migration_contract)
  + binary(apalis_adapter)
  + binary(apalis_schema_contract)
  + binary(apalis_runtime_release)
  + binary(group_of_one_expand_contract)
  + test(=definitions_migrated_by_console_app_are_read_only_for_runtime)
  + test(=placement_migrations_run_as_console_app)
  + test(=owner_only_acl_is_effectively_private_on_postgres18)
  + test(=console_app_may_set_its_own_lock_timeout_default)
  + test(=status_worker_age_is_queue_scoped_read_only_and_missing_is_unknown)
  + test(/status_public_evidence_answers_aggregate_age_only_beside_tenant_data$/)
  + test(/serving_pool_rejects_overrides_and_restores_role_defaults_after_release$/)
  + test(=corrects_stored_phones_and_preserves_revision_history)
'''
test-group = 'cluster-global'
# Roles are cluster-wide; role mutators and console_app migrations must run alone.
threads-required = "num-test-threads"

[profile.ci]
# Hosted: no flake-hide retries. Slow timeout generous for PG.
slow-timeout = { period = "120s", terminate-after = 3 }

# census_binds_to_an_executed_database is EIGHT sequential migrate+enforce
# cycles against a Docker PostgreSQL in one test -- the mutation matrix for the
# canonical-enforcement census. Measured 263s locally and it hit the 360s
# terminate ceiling on a hosted runner the first time every shard ran under
# nextest. That cost is legitimate and serial by construction (each cycle
# re-installs the topology script), so the ceiling is raised for THIS binary
# only. The global 360s stays: it is what catches a genuinely hung test, and
# widening it everywhere to accommodate one known-slow suite would hide hangs
# in the other 153.
[[profile.ci.overrides]]
filter = 'binary(census_executes_against_postgres)'
slow-timeout = { period = "120s", terminate-after = 8 }

# Wall-clock budgets must not measure concurrent migrations.
[[profile.ci.overrides]]
filter = 'test(/budget/)'
threads-required = "num-test-threads"

[profile.ci.junit]
path = "junit.xml"

# Agent inner loop and per-lane targeted runs (tools/lanes/pgtest-nextest.sh, which
# also sets quiet output through env). No retries: a flake is a finding, not noise.
[profile.lane]
retries = 0
slow-timeout = { period = "60s", terminate-after = 5 }
# The 263-319 s census binary is excluded HERE ONLY. The once-per-task full sweep
# runs NEXTEST_PROFILE=ci, which has no default-filter. Never put a default-filter on
# [profile.default]: ci and every custom profile would inherit it and silently drop
# the census (tools/ci/check-nextest-config.mjs enforces this).
default-filter = 'not binary(census_executes_against_postgres)'

[profile.lane.junit]
path = "junit.xml"

# Nightly property/fuzz pass. The proptest suites (binaries `*_properties`; the
# app's `hr::import_properties` module once it is ported to the IMPORT-2 reader)
# run 256 cases each in every other profile, well under a second per suite.
# Here they run 100x that:
#   PROPTEST_CASES=25600 cargo nextest run --profile fuzz \
#     -E 'binary(/_properties$/) + test(/import_properties::/)'
# No default-filter here (check-nextest-config.mjs: lane only), so the filter
# rides on the command line. cargo-fuzz is not used: the toolchain is pinned
# stable (rust-toolchain.toml) and libFuzzer targets need nightly.
[profile.fuzz]
retries = 0
fail-fast = false
slow-timeout = { period = "300s", terminate-after = 4 }
