version: 2
# Let releases settle before version updates; security updates bypass cooldown.
# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference#cooldown
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "@types/node"
        versions: [">=27"]
      # openapi-typescript requires the JavaScript compiler API missing from native TypeScript.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # 2026-11-07: strict-value 1.12.1 supports Stylelint 16–17; revisit when its peer range supports 18.
      - dependency-name: "stylelint"
        versions: ["18.x"]
      # 2026-11-07: ten React Compiler lint failures; revisit after effect-cancellation lint compatibility is proven.
      - dependency-name: "oxlint"
        versions: ["1.91.x"]
      # 2026-11-08: 5.105.2+ loses the /people go-live receipt in phase-band E2E (bisected: 5.105.1 passes).
      # Revisit after receipt rendering and configured expiry pass in Chromium and Firefox.
      - dependency-name: "@tanstack/react-query"
        versions: [">=5.105.2"]
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: cargo
    directories:
      - /backend
      - /backend/fuzz
      - /apps/desktop/src-tauri
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Keep the envelope cipher readable; revisit after the RNG/nonce migration and old-ciphertext proof.
      - dependency-name: "chacha20poly1305"
        versions: [">=0.11"]
      # Stay on the version the Tauri deep-link stack ships; revisit when tauri-plugin-deep-link moves.
      - dependency-name: "windows-registry"
        versions: [">=0.7"]
      # Defer all Apalis updates until the audited migration; see docs/quality/dependencies/dependabot-cargo-315.md.
      - dependency-name: "apalis"
      - dependency-name: "apalis-postgres"
      - dependency-name: "apalis-sql"
      # 2026-11-07: 0.6 replaces the crypto backend and conflicts with our 0.5 proto types.
      # Revisit after a coordinated proto/API migration preserves stored passkeys and passes Chromium auth E2E.
      - dependency-name: "webauthn-rs"
        versions: ["0.6.*"]
      - dependency-name: "webauthn-rs-proto"
        versions: ["0.6.*"]
      - dependency-name: "webauthn-authenticator-rs"
        versions: ["0.6.*"]
    groups:
      cargo:
        patterns: ["*"]
        update-types: ["minor", "patch"]
