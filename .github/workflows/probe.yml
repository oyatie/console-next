# SPDX-License-Identifier: LicenseRef-Proprietary
# External availability probe (console-infra B-06, docs/free-tier.md): the free
# replacement of the OCI Health Checks monitor, which is not Always Free.
# Every 10 minutes a GitHub runner GETs the public site's / (WAF-allowed, not
# cached) and the module entry it names under /assets/, so a pass means the
# Cloudflare edge, the tunnel, the host and the release's assets answer (a page
# whose entry chunk 404s is the 2026-10-08 white screen).
# Failures notify Telegram on a new outage and at most hourly while it lasts.
# Limits, stated:
#   - GitHub runs schedules from the default branch only, best effort (often
#     10-30 min late at busy times), and disables them after 60 days without a
#     commit. Until this file is on dev of a live repo (owner D-07), the OCI
#     dead-man and instance-down alarms are the only host-down signal and NOTHING
#     watches the edge or the tunnel.
#   - One vantage point (a GitHub runner); the edge may challenge runner IPs, so
#     a page with the host healthy is a false positive (console-infra RUNBOOK.md, alarm-probe).
#   - HTTP only; a real browser load of sign-in is the next step (B-06 phase 2).
# Repository secrets: PROBE_URL, CONSOLE_PUBLIC_HOST (egress allow-list).
# Enable only after configuring the secrets: repository variable PROBE_ENABLED=true.
# Repository or environment `probe`: CONSOLE_TELEGRAM_BOT_TOKEN, CONSOLE_TELEGRAM_CHAT_ID.
name: probe
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    if: vars.PROBE_ENABLED == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      actions: read # the previous run's result (page on a new outage only)
    outputs:
      page: ${{ steps.page.outputs.page }}
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: block
          allowed-endpoints: >-
            ${{ secrets.CONSOLE_PUBLIC_HOST }}:443
            api.github.com:443
      - name: GET / and its module entry (edge, tunnel, host, assets)
        env:
          URL: ${{ secrets.PROBE_URL }}
        run: |
          [[ "${URL}" == https://* ]] || { echo "PROBE_URL is not set" >&2; exit 1; }
          get() { curl -fsS --max-time 30 --retry 3 --retry-delay 20 --retry-all-errors "$@"; }
          page="$(get "${URL%/}/")"
          entry="$(grep -o 'src="/assets/[A-Za-z0-9._-]*\.js"' <<<"${page}" | tail -n1 | cut -d'"' -f2)"
          [[ -n "${entry}" ]] || { echo "/ names no /assets/*.js module entry" >&2; exit 1; }
          get -o /dev/null "${URL%/}${entry}"
      - name: Page on a new outage, then hourly
        id: page
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev="$(gh run list -R "${GITHUB_REPOSITORY}" --workflow probe.yml --status completed --limit 1 --json conclusion --jq '.[0].conclusion // "success"')"
          if [[ "${prev}" != failure || "$(date -u +%M)" -lt 10 ]]; then echo "page=true" >>"${GITHUB_OUTPUT}"; fi

  notify:
    needs: probe
    if: failure() && needs.probe.outputs.page == 'true'
    runs-on: ubuntu-24.04-arm
    environment: probe
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443
            api.telegram.org:443
            codeload.github.com:443
            github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci/notify-telegram.sh
          sparse-checkout-cone-mode: false
      - name: Notify the owner (Telegram)
        env:
          CONSOLE_TELEGRAM_BOT_TOKEN: ${{ secrets.CONSOLE_TELEGRAM_BOT_TOKEN }}
          CONSOLE_TELEGRAM_CHAT_ID: ${{ secrets.CONSOLE_TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf 'Run %s.\n' "${RUN_URL}" | scripts/ci/notify-telegram.sh send page page "console probe failed"
