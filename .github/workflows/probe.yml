# SPDX-License-Identifier: LicenseRef-Proprietary
# External availability probe (console-infra B-06, docs/free-tier.md): the free
# replacement of the OCI Health Checks monitor, which is not Always Free.
# Every 10 minutes a GitHub runner GETs the public site's / (WAF-allowed, not
# cached) and the module entry it names under /assets/, so a pass means the
# Cloudflare edge, the tunnel, the host and the release's assets answer (a page
# whose entry chunk 404s is the 2026-10-08 white screen).
# On failure it e-mails the owner through the ONS ticket topic: on a new outage,
# then at most hourly while it lasts, so a long outage stays inside the 1,000
# free ONS e-mails a month.
# Limits, stated:
#   - GitHub runs schedules from the default branch only, best effort (often
#     10-30 min late at busy times), and disables them after 60 days without a
#     commit. Until this file is on dev of a live repo (owner D-07), the OCI
#     dead-man and instance-down alarms are the only host-down signal and NOTHING
#     watches the edge or the tunnel.
#   - One vantage point (a GitHub runner); the edge may challenge runner IPs, so
#     a page with the host healthy is a false positive (console-infra RUNBOOK.md, alarm-probe).
#   - HTTP only; a real browser load of sign-in is the next step (B-06 phase 2).
# Setup (CD-9): repository secret PROBE_URL = https://<public host> (masked in
# logs). Environment `probe` (deployment branches: dev) with console-ci-notify's
# OCI_CONFIG (a [DEFAULT] profile without key_file) and OCI_API_KEY, and
# ONS_TOPIC_ID. console-ci-notify may only publish to the alert topics: no deploy
# key, no registry credential, no console-infra checkout.
name: Production availability
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    name: Probe production availability
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: GET / and its module entry (edge, tunnel, host, assets)
        env:
          URL: ${{ secrets.PROBE_URL }}
        run: |
          [[ "${URL}" == https://* ]] || { echo "PROBE_URL is not set" >&2; exit 1; }
          dir="$(mktemp -d)"
          trap 'rm -rf "$dir"' EXIT
          get() {
            curl -fsS --max-time 20 --retry 2 --retry-max-time 50 --retry-delay 5 --retry-all-errors \
              --output "$2" --write-out '%{http_code} %{content_type}' "$1"
          }
          page_type="$(get "${URL%/}/" "$dir/page")"
          [[ "${page_type%%;*}" == "200 text/html" ]]
          python3 - "$dir/page" > "$dir/entries" <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re, sys
          class ModuleEntries(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'script' and (attrs.get('type') or '').lower() == 'module' and 'src' in attrs:
                      path = attrs['src'] or ''
                      if not re.fullmatch(r'/assets/[A-Za-z0-9._-]+\.js', path):
                          raise ValueError('unexpected module entry path')
                      print(path)
          ModuleEntries().feed(Path(sys.argv[1]).read_text(encoding='utf-8'))
          PY
          [[ -s "$dir/entries" ]] || { echo 'No JavaScript module entry on /' >&2; exit 1; }
          while IFS= read -r entry; do
            asset_type="$(get "${URL%/}${entry}" "$dir/asset")"
            case "${asset_type%%;*}" in
              '200 text/javascript'|'200 application/javascript') ;;
              *) echo 'Entry did not return a JavaScript asset' >&2; exit 1 ;;
            esac
            grep -q '[^[:space:]]' "$dir/asset"
            node --check --input-type=module < "$dir/asset"
          done < "$dir/entries"

  notify:
    name: Report availability failure
    needs: probe
    if: failure() && needs.probe.result == 'failure'
    runs-on: ubuntu-24.04-arm
    environment: probe
    timeout-minutes: 10
    permissions:
      actions: read # Previous completed probe used for outage deduplication.
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      # The official OCI CLI image, pinned by digest (multi-arch index of tag 20261007).
      - name: Page on a new outage, then hourly
        id: page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The listing's status filter can omit a finished run.
          prev="$(gh run list -R "${GITHUB_REPOSITORY}" --workflow probe.yml --json status,conclusion \
            --jq 'map(select(.status == "completed"))[0].conclusion // "success"')"
          if [[ "${prev}" != failure || "$(date -u +%M)" == 0[0-9] ]]; then echo "page=true" >>"${GITHUB_OUTPUT}"; fi
      - name: Notify the owner (ONS, console-ci-notify)
        if: steps.page.outputs.page == 'true'
        env:
          OCI_CONFIG: ${{ secrets.OCI_CONFIG }}
          OCI_API_KEY: ${{ secrets.OCI_API_KEY }}
          ONS_TOPIC_ID: ${{ secrets.ONS_TOPIC_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          umask 077
          d="${RUNNER_TEMP}/oci"; mkdir -p "${d}"
          printf '%s\n' "${OCI_API_KEY}" >"${d}/key.pem"
          printf '%s\nkey_file=/oci/key.pem\n' "${OCI_CONFIG}" >"${d}/config"
          docker run --rm --user "$(id -u):$(id -g)" -v "${d}:/oci:ro" -e OCI_CLI_CONFIG_FILE=/oci/config \
            -e OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True \
            ghcr.io/oracle/oci-cli:20261007@sha256:48884d8710d30356cac71c7aa678873a97c53c594fefdf2724c80270f3ca563b \
            ons message publish --auth api_key --topic-id "${ONS_TOPIC_ID}" --title "console probe failed" \
            --body "GET / or its module entry under /assets/ failed from a GitHub runner (edge, tunnel, host or release assets). console-infra RUNBOOK.md, alarm-probe. ${RUN_URL}" >/dev/null
          rm -rf "${d}"
