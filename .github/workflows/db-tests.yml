# SPDX-License-Identifier: LicenseRef-Proprietary
# Long PostgreSQL tests run on dev, nightly and gate-changing pull requests.
# merge_group stays disabled until test execution fits within the 60-minute queue timeout.
name: db-tests
on:
  pull_request:
    paths:
      - .github/workflows/db-tests.yml
      - scripts/backend-tests.mjs
      - deploy/dev/postgres-init.sh
      - .config/nextest.toml
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      alert_dry_run:
        description: Rehearse the failure alert without publishing a notification
        type: boolean
        default: false
      disk_min_bytes:
        description: Free disk reserve in bytes (override for guard rehearsals)
        type: string
        required: false
  schedule:
    - cron: '47 17 * * *'
permissions: {}
concurrency:
  # Pending runs replace each other even when cancel-in-progress is false; isolate nightly and manual runs.
  # https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
  group: db-tests-${{ github.event_name == 'pull_request' && github.ref || github.event_name == 'schedule' && 'nightly' || github.event_name == 'workflow_dispatch' && github.run_id || 'trunk' }}
  cancel-in-progress: false

jobs:
  db-test-timing-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      run-id: ${{ steps.timings.outputs.run-id }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with: {egress-policy: audit}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version-file: .node-version}
      - name: Find latest trusted timings
        id: timings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --get \
            -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            --data-urlencode 'name=db-test-timings' --data-urlencode 'per_page=100' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts" > "${RUNNER_TEMP}/db-test-timings.json"
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          const { artifacts } = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/db-test-timings.json`, 'utf8'));
          const own = Number(process.env.GITHUB_REPOSITORY_ID), branch = process.env.GITHUB_REF_NAME;
          const trusted = artifacts.filter(a => !a.expired &&
            a.workflow_run?.head_repository_id === own && a.workflow_run.repository_id === own &&
            (a.workflow_run.head_branch === branch || a.workflow_run.head_branch === 'dev'));
          trusted.sort((a, b) => Number(b.workflow_run.head_branch === branch) - Number(a.workflow_run.head_branch === branch)
            || b.created_at.localeCompare(a.created_at));
          if (trusted[0]) appendFileSync(process.env.GITHUB_OUTPUT, `run-id=${trusted[0].workflow_run.id}\n`);
          JS

  db-tests:
    needs: db-test-timing-source
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    services:
      postgres:
        image: postgres:18.4@sha256:65f70a152846cf504dff86e807007e9aeac98c3aeb7b62541b2c55ab9d264e56
        env:
          POSTGRES_DB: console_ci_contract
          POSTGRES_USER: console_buck_admin
          POSTGRES_PASSWORD: ${{ github.run_id }}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U console_buck_admin -d console_ci_contract"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_NEXTEST_VERSION: 0.9.138
      CARGO_TERM_COLOR: always
      # Keep headroom for runner diagnostics and failure artifacts during compilation.
      RUNNER_DISK_MIN_BYTES: ${{ inputs.disk_min_bytes || vars.RUNNER_DISK_MIN_BYTES || '2147483648' }}
      DATABASE_URL: postgres://console_buck_admin@127.0.0.1:5432/console_ci_contract?options%5Bconsole.sqlx_test_bootstrap%5D=buck-sqlx-superuser-v1
      SQLX_OFFLINE: 'true'
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with: {egress-policy: audit}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version-file: .node-version}
      - name: Reclaim runner disk
        run: |
          echo 'Disk before cleanup:'
          df -h "$GITHUB_WORKSPACE"
          # This Rust/PostgreSQL job does not use the hosted .NET, Swift or CodeQL SDKs.
          sudo rm -rf -- /usr/share/dotnet /usr/share/swift /opt/hostedtoolcache/CodeQL
          echo 'Disk after cleanup, before cache restore and build:'
          df -h "$GITHUB_WORKSPACE"
          node scripts/runner-disk.mjs before-cache
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: rust-cache
        with:
          path: |-
            ~/.cargo/registry
            backend/target/*/.fingerprint
            backend/target/*/build
            backend/target/*/deps
          key: db-tests-${{ runner.os }}-${{ runner.arch }}-debug${{ env.CARGO_PROFILE_TEST_DEBUG }}-${{ hashFiles('backend/rust-toolchain.toml', 'backend/Cargo.lock', 'backend/**/Cargo.toml') }}-${{ github.sha }}
          restore-keys: db-tests-${{ runner.os }}-${{ runner.arch }}-debug${{ env.CARGO_PROFILE_TEST_DEBUG }}-${{ hashFiles('backend/rust-toolchain.toml', 'backend/Cargo.lock', 'backend/**/Cargo.toml') }}-
      - name: Install pinned Rust test runner
        run: |
          node scripts/runner-disk.mjs after-cache
          curl --fail --silent --show-error --location -o "${RUNNER_TEMP}/nextest.tar.gz" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${CARGO_NEXTEST_VERSION}/cargo-nextest-${CARGO_NEXTEST_VERSION}-aarch64-unknown-linux-gnu.tar.gz"
          echo "e1c85dbe02dcf5b963803b3f96f4f561757f5c37cab68c932411dea20d57284e  ${RUNNER_TEMP}/nextest.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/nextest.tar.gz" -C "${RUNNER_TEMP}" cargo-nextest
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v7.0.0
        if: needs.db-test-timing-source.outputs.run-id != ''
        with:
          name: db-test-timings
          run-id: ${{ needs.db-test-timing-source.outputs.run-id }}
          github-token: ${{ github.token }}
          path: .cache/db-test-timings
      - name: Provision PostgreSQL test roles
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { spawnSync } from 'node:child_process';
          import { randomBytes } from 'node:crypto';
          import { appendFileSync, readFileSync } from 'node:fs';
          const credentials = Object.fromEntries([
            'POSTGRES_PASSWORD', 'CONSOLE_APP_POSTGRES_PASSWORD', 'CONSOLE_RT_POSTGRES_PASSWORD',
            'CONSOLE_LEAVE_COMMAND_POSTGRES_PASSWORD', 'CONSOLE_ONTOLOGY_COMMAND_POSTGRES_PASSWORD',
            'CONSOLE_PLATFORM_FORCE_COMMAND_POSTGRES_PASSWORD',
          ].map(key => [key, randomBytes(24).toString('hex')]));
          for (const value of Object.values(credentials)) console.log(`::add-mask::${value}`);
          const url = new URL(process.env.DATABASE_URL);
          const exec = (args, input) => {
            const result = spawnSync('docker', ['exec', '-i', ...args], {
              input, encoding: 'utf8', env: { ...process.env, ...credentials }, stdio: ['pipe', 'inherit', 'inherit'],
            });
            assert.ifError(result.error);
            assert.equal(result.status, 0, 'PostgreSQL test provisioning failed');
          };
          exec([...Object.keys(credentials).flatMap(key => ['--env', key]), process.env.POSTGRES_CONTAINER, 'bash'],
            readFileSync('deploy/dev/postgres-init.sh', 'utf8'));
          exec([process.env.POSTGRES_CONTAINER, 'psql', '-v', 'ON_ERROR_STOP=1', '--username', url.username, '--dbname', url.pathname.slice(1)],
            `ALTER ROLE ${url.username} PASSWORD '${credentials.POSTGRES_PASSWORD}';`);
          url.password = credentials.POSTGRES_PASSWORD;
          const owner = new URL(url), runtime = new URL(url);
          owner.username = 'console_app'; owner.password = credentials.CONSOLE_APP_POSTGRES_PASSWORD; owner.search = '';
          runtime.username = 'console_rt'; runtime.password = credentials.CONSOLE_RT_POSTGRES_PASSWORD; runtime.search = '';
          const fixtures = {
            DATABASE_URL: url.href, CONSOLE_APALIS_ADMIN_DATABASE_URL: url.href,
            CONSOLE_APALIS_OWNER_DATABASE_URL: owner.href, CONSOLE_APALIS_RUNTIME_DATABASE_URL: runtime.href,
            CONSOLE_TEST_RUNTIME_PASSWORD: credentials.CONSOLE_RT_POSTGRES_PASSWORD,
            CONSOLE_TEST_FORCE_PASSWORD: credentials.CONSOLE_PLATFORM_FORCE_COMMAND_POSTGRES_PASSWORD,
          };
          for (const [key, value] of Object.entries(fixtures)) {
            console.log(`::add-mask::${value}`);
            appendFileSync(process.env.GITHUB_ENV, `${key}=${value}\n`);
          }
          JS
      - name: Run duration shard
        run: node scripts/runner-disk.mjs db-shard-${{ matrix.shard }} node scripts/backend-tests.mjs --db --shard "${{ matrix.shard }}/4" --timings .cache/db-test-timings/timings.json
      - name: Report disk after database tests
        if: ${{ !cancelled() }}
        run: |
          echo 'Disk after database build and tests:'
          df -h "$GITHUB_WORKSPACE"
          node scripts/runner-disk.mjs after-tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v6.0.0
        if: ${{ !cancelled() }}
        with:
          name: db-test-results-${{ matrix.shard }}
          path: backend/target/nextest/ci/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v6.0.0
        if: ${{ !cancelled() }}
        with:
          name: db-test-diagnostics-${{ matrix.shard }}
          path: .cache/runner-disk/
          include-hidden-files: true
          if-no-files-found: error
      - name: Check Rust cache budget
        id: cache-budget
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/dev' && matrix.shard == 1 && steps.rust-cache.outputs.cache-hit != 'true' }}
        env:
          RUST_CACHE_MAX_BYTES: '3221225472'
        run: |
          find "$HOME/.cargo/registry" -type f -print0 > "${RUNNER_TEMP}/db-tests-rust-cache-files"
          find backend/target -type f \( -path 'backend/target/*/.fingerprint/*' -o -path 'backend/target/*/build/*' -o -path 'backend/target/*/deps/*' \) -print0 >> "${RUNNER_TEMP}/db-tests-rust-cache-files"
          # Count compressed bytes without retaining a second copy on the runner.
          # Standard runner storage: https://docs.github.com/en/actions/reference/runners/github-hosted-runners
          cache_bytes="$(tar --null -T "${RUNNER_TEMP}/db-tests-rust-cache-files" -cf - | zstd -q -T0 -3 | wc -c)"
          echo "Rust cache candidate: ${cache_bytes} bytes / ${RUST_CACHE_MAX_BYTES} bytes." >> "$GITHUB_STEP_SUMMARY"
          if (( cache_bytes > RUST_CACHE_MAX_BYTES )); then
            echo "::warning::Rust cache candidate is over budget; this shard remains green and the cache will not be saved."
            echo 'save=false' >> "$GITHUB_OUTPUT"
          else
            echo 'save=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/dev' && matrix.shard == 1 && steps.rust-cache.outputs.cache-hit != 'true' && steps.cache-budget.outputs.save == 'true' }}
        with:
          path: |-
            ~/.cargo/registry
            backend/target/*/.fingerprint
            backend/target/*/build
            backend/target/*/deps
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

  db-test-timings:
    if: ${{ always() && needs.db-tests.result != 'cancelled' }}
    needs: db-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with: {egress-policy: audit}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version-file: .node-version}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v7.0.0
        with:
          pattern: db-test-results-*
          path: .cache/db-test-results
      - name: Reconcile every shard and refresh timings
        run: >-
          node scripts/backend-tests.mjs --collect
          .cache/db-test-results/db-test-results-1/plan.json
          .cache/db-test-timings/timings.json
          .cache/db-test-results/db-test-results-*/junit-*.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v6.0.0
        with:
          name: db-test-timings
          path: .cache/db-test-timings/timings.json
          retention-days: 90
          if-no-files-found: error

  alert-nightly:
    if: ${{ always() && ((github.event_name == 'schedule' && (needs.db-test-timing-source.result != 'success' || needs.db-tests.result != 'success' || needs.db-test-timings.result != 'success')) || (github.event_name == 'workflow_dispatch' && inputs.alert_dry_run)) }}
    needs: [db-test-timing-source, db-tests, db-test-timings]
    permissions: {contents: read, actions: read}
    uses: ./.github/workflows/notify.yml
    with:
      title: Nightly database tests failed
      body: 'Job results: timing-source=${{ needs.db-test-timing-source.result }}, shards=${{ needs.db-tests.result }}, reconciliation=${{ needs.db-test-timings.result }}'
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.alert_dry_run }}
      failed-jobs: true
