# SPDX-License-Identifier: LicenseRef-Proprietary
# Long PostgreSQL tests run on dev, nightly and gate-changing pull requests.
# merge_group stays disabled until the database suite provides reliable proof before merge.
name: Database tests
on:
  pull_request:
    paths:
      - .github/workflows/db-tests.yml
      - scripts/backend-tests.mjs
      - deploy/dev/postgres-init.sh
      - .config/nextest.toml
  push:
    branches: [dev]
  schedule:
    - cron: '47 17 * * *'
permissions: {}
concurrency:
  # A newer run replaces a pending one in its group, so the nightly has its own group and pushes cannot cancel it.
  group: db-tests-${{ github.event_name == 'pull_request' && github.ref || github.event_name == 'schedule' && 'nightly' || 'trunk' }}
  cancel-in-progress: false

jobs:
  db-test-timing-source:
    name: Restore database test timings
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      run-id: ${{ steps.timings.outputs.run-id }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with: {egress-policy: audit}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version-file: .node-version}
      - name: Find latest trusted timings
        id: timings
        env:
          GH_TOKEN: ${{ github.token }}
        # The reconciliation job publishes timings from red runs too, and the planner validates them.
        run: node .github/ci-proof.cjs --any-conclusion db-test-timings db-tests.yml push schedule

  db-tests:
    name: Database tests · shard ${{ matrix.shard }}
    needs: db-test-timing-source
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    services:
      postgres:
        image: postgres:18.4@sha256:65f70a152846cf504dff86e807007e9aeac98c3aeb7b62541b2c55ab9d264e56
        env:
          POSTGRES_DB: console_ci_contract
          POSTGRES_USER: console_buck_admin
          POSTGRES_PASSWORD: ${{ github.run_id }}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U console_buck_admin -d console_ci_contract"
          --health-interval 30s
          --health-timeout 2s
          --health-retries 1
          --health-start-period 60s
          --health-start-interval 1s
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_NEXTEST_VERSION: 0.9.138
      CARGO_TERM_COLOR: always
      DATABASE_URL: postgres://console_buck_admin@127.0.0.1:5432/console_ci_contract?options%5Bconsole.sqlx_test_bootstrap%5D=buck-sqlx-superuser-v1
      SQLX_OFFLINE: 'true'
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with: {egress-policy: audit}
      - name: Docker healthcheck capabilities
        run: |
          docker version
          docker compose version
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version-file: .node-version}
      - name: Reclaim runner disk
        run: |
          echo 'Disk before cleanup:'
          df -h "$GITHUB_WORKSPACE"
          # This Rust/PostgreSQL job does not use the hosted .NET, Swift or CodeQL SDKs.
          sudo rm -rf -- /usr/share/dotnet /usr/share/swift /opt/hostedtoolcache/CodeQL
          echo 'Disk after cleanup, before build:'
          df -h "$GITHUB_WORKSPACE"
      - name: Install pinned Rust test runner
        run: |
          curl --fail --silent --show-error --location -o "${RUNNER_TEMP}/nextest.tar.gz" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${CARGO_NEXTEST_VERSION}/cargo-nextest-${CARGO_NEXTEST_VERSION}-aarch64-unknown-linux-gnu.tar.gz"
          echo "e1c85dbe02dcf5b963803b3f96f4f561757f5c37cab68c932411dea20d57284e  ${RUNNER_TEMP}/nextest.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/nextest.tar.gz" -C "${RUNNER_TEMP}" cargo-nextest
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v7.0.0
        if: needs.db-test-timing-source.outputs.run-id != ''
        with:
          name: db-test-timings
          run-id: ${{ needs.db-test-timing-source.outputs.run-id }}
          github-token: ${{ github.token }}
          path: .cache/db-test-timings
      - name: Provision PostgreSQL test roles
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { spawnSync } from 'node:child_process';
          import { randomBytes } from 'node:crypto';
          import { appendFileSync, readFileSync } from 'node:fs';
          const credentials = Object.fromEntries([
            'POSTGRES_PASSWORD', 'CONSOLE_APP_POSTGRES_PASSWORD', 'CONSOLE_RT_POSTGRES_PASSWORD',
            'CONSOLE_LEAVE_COMMAND_POSTGRES_PASSWORD', 'CONSOLE_ONTOLOGY_COMMAND_POSTGRES_PASSWORD',
            'CONSOLE_PLATFORM_FORCE_COMMAND_POSTGRES_PASSWORD',
          ].map(key => [key, randomBytes(24).toString('hex')]));
          for (const value of Object.values(credentials)) console.log(`::add-mask::${value}`);
          const url = new URL(process.env.DATABASE_URL);
          const exec = (args, input) => {
            const result = spawnSync('docker', ['exec', '-i', ...args], {
              input, encoding: 'utf8', env: { ...process.env, ...credentials }, stdio: ['pipe', 'inherit', 'inherit'],
            });
            assert.ifError(result.error);
            assert.equal(result.status, 0, 'PostgreSQL test provisioning failed');
          };
          exec([...Object.keys(credentials).flatMap(key => ['--env', key]), process.env.POSTGRES_CONTAINER, 'bash'],
            readFileSync('deploy/dev/postgres-init.sh', 'utf8'));
          exec([process.env.POSTGRES_CONTAINER, 'psql', '-v', 'ON_ERROR_STOP=1', '--username', url.username, '--dbname', url.pathname.slice(1)],
            `ALTER ROLE ${url.username} PASSWORD '${credentials.POSTGRES_PASSWORD}';`);
          url.password = credentials.POSTGRES_PASSWORD;
          const owner = new URL(url), runtime = new URL(url);
          owner.username = 'console_app'; owner.password = credentials.CONSOLE_APP_POSTGRES_PASSWORD; owner.search = '';
          runtime.username = 'console_rt'; runtime.password = credentials.CONSOLE_RT_POSTGRES_PASSWORD; runtime.search = '';
          const fixtures = {
            DATABASE_URL: url.href, CONSOLE_APALIS_ADMIN_DATABASE_URL: url.href,
            CONSOLE_APALIS_OWNER_DATABASE_URL: owner.href, CONSOLE_APALIS_RUNTIME_DATABASE_URL: runtime.href,
            CONSOLE_TEST_RUNTIME_PASSWORD: credentials.CONSOLE_RT_POSTGRES_PASSWORD,
            CONSOLE_TEST_FORCE_PASSWORD: credentials.CONSOLE_PLATFORM_FORCE_COMMAND_POSTGRES_PASSWORD,
          };
          for (const [key, value] of Object.entries(fixtures)) {
            console.log(`::add-mask::${value}`);
            appendFileSync(process.env.GITHUB_ENV, `${key}=${value}\n`);
          }
          JS
      - name: Run duration shard
        run: node scripts/backend-tests.mjs --db --shard "${{ matrix.shard }}/4" --timings .cache/db-test-timings/timings.json
      - name: Verify SeaweedFS compliance retention
        # Needs no database: a red database shard must not skip the retention proof.
        if: ${{ !cancelled() && matrix.shard == 1 }}
        working-directory: backend
        env:
          AWS_ACCESS_KEY_ID: ${{ github.run_id }}
        run: |
          AWS_SECRET_ACCESS_KEY=$(node -p 'crypto.randomUUID()')
          echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
          export AWS_SECRET_ACCESS_KEY
          image=$(jq -er .images.seaweed ../deploy/versions.json)
          container=$(docker create --hostname console-objects -p 127.0.0.1::8333 --entrypoint /usr/bin/weed "$image" \
            server -ip=console-objects -ip.bind=0.0.0.0 -dir=/data -volume.max=0 -master.volumeSizeLimitMB=64 -s3 -s3.config=/run/s3/config.json)
          config=$(mktemp -d)
          cleanup() {
            if [ "$?" != 0 ]; then docker logs --tail 200 "$container"; fi
            docker rm -fv "$container" >/dev/null
            rm -f "$config/config.json"
            rmdir "$config"
          }
          trap cleanup EXIT
          jq -n '{identities:[{name:"test",credentials:[{accessKey:env.AWS_ACCESS_KEY_ID,secretKey:env.AWS_SECRET_ACCESS_KEY}],actions:["Admin","Read","Write","List","Tagging"]}]}' > "$config/config.json"
          docker cp "$config" "$container:/run/s3"
          docker start "$container" >/dev/null
          address=$(docker port "$container" 8333/tcp)
          export CONSOLE_STORAGE_TEST_S3_ENDPOINT="http://$address"
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 1 --max-time 3 "$CONSOLE_STORAGE_TEST_S3_ENDPOINT/status"
          cargo nextest run --locked -p console-platform-storage --features test-seaweedfs --test seaweedfs_worm --no-tests fail
      - name: Report disk after database tests
        if: ${{ !cancelled() }}
        run: |
          echo 'Disk after database build and tests:'
          df -h "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v6.0.0
        if: ${{ !cancelled() }}
        with:
          name: db-test-results-${{ matrix.shard }}
          path: backend/target/nextest/ci/
          if-no-files-found: error

  db-test-timings:
    name: Reconcile database test results
    if: ${{ always() && needs.db-tests.result != 'cancelled' }}
    needs: db-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with: {egress-policy: audit}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version-file: .node-version}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v7.0.0
        with:
          pattern: db-test-results-*
          path: .cache/db-test-results
      - name: Reconcile every shard and refresh timings
        run: node scripts/backend-tests.mjs --collect .cache/db-test-results .cache/db-test-timings/timings.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v6.0.0
        if: ${{ !cancelled() && hashFiles('.cache/db-test-timings/timings.json') != '' }}
        with:
          name: db-test-timings
          path: .cache/db-test-timings/timings.json
          retention-days: 90
          if-no-files-found: error
