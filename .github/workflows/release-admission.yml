# SPDX-License-Identifier: LicenseRef-Proprietary
name: release-admission
on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      since:
        description: Last admitted dev SHA (exclusive); backfills merged PR evidence
        required: true
        type: string
permissions: {}
concurrency:
  group: release-admission-${{ github.sha }}
  cancel-in-progress: false
jobs:
  plan:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: node --test .github/release-admission.test.cjs
      - id: plan
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          ADMISSION_BASE: ${{ inputs.since || github.event.before }}
        with:
          script: |
            return require('./.github/release-admission.cjs').plan(process.env.ADMISSION_BASE, context.sha);
  attest:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    permissions:
      contents: read
      pull-requests: read
      checks: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: evidence
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          ADMISSION_MERGE: ${{ matrix.merge }}
        with:
          script: |
            const admission = require('./.github/release-admission.cjs');
            const record = await admission.collect(github, process.env.ADMISSION_MERGE);
            admission.write(record);
            core.setOutput('predicate-type', require('./.github/release-admission-policy.json').predicate_type);
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dev-merge
          predicate-type: ${{ steps.evidence.outputs.predicate-type }}
          predicate-path: pr-admission.json
          show-summary: false
