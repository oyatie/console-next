# SPDX-License-Identifier: LicenseRef-Proprietary
name: platform
on:
  pull_request:
  merge_group:
  push:
    branches: [dev]
  workflow_dispatch:
  schedule:
    - cron: '19 3 * * 1'
permissions: {}
env:
  RUNNER_DISK_MIN_BYTES: ${{ vars.RUNNER_DISK_MIN_BYTES || '2147483648' }}
concurrency:
  group: platform-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43
        with: {egress-policy: audit}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version-file: .node-version, cache: npm}
      - &disk-start
        name: Check runner disk before restores
        working-directory: .
        run: |
          node scripts/runner-disk.mjs before-cache
          echo "$GITHUB_WORKSPACE/scripts" >> "$GITHUB_PATH"
      - name: Locked tools
        run: python3 deploy/ci/tools.py flux cosign kind buildx conftest kubeconform syft kustomize actionlint helm kubectl
      - name: Contracts and strict manifests
        shell: bash -e -o pipefail -c "exec runner-disk-shell.sh {0}"
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          python3 -m unittest discover -s deploy/ci -p '*_test.py'
          node --test deploy/ci/*.test.mjs
          bash deploy/ci/validate.sh
      - name: ValidatingAdmissionPolicy server dry-run and refusals
        shell: bash -e -o pipefail -c "exec runner-disk-shell.sh {0}"
        run: |
          export KUBECONFIG="${RUNNER_TEMP}/platform-admission.kubeconfig"
          trap 'kind delete cluster --name platform-admission' EXIT
          kind create cluster --name platform-admission --image "$(jq -r .images.kind deploy/versions.json)" --wait 120s
          node deploy/ci/admission.mjs
      - &disk-evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: runner-disk-${{ github.job }}-${{ strategy.job-index || '0' }}
          path: .cache/runner-disk/
          include-hidden-files: true
          if-no-files-found: error

  prune-image-cache:
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && github.ref == 'refs/heads/dev'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43
        with: {egress-policy: audit}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Prune legacy image caches
        id: prune
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const { pruneImageCache } = await import(`${process.env.GITHUB_WORKSPACE}/deploy/ci/prune-image-cache.mjs`);
            const result = await pruneImageCache(github, context);
            await core.summary.addRaw(`Removed ${result.deleted} legacy image cache entries (${result.bytes} bytes).\n`).write();
      - name: Warn when image cache cleanup fails
        if: >-
          !cancelled() && steps.prune.outcome != 'success'
        run: |
          echo '**Warning:** Image cache cleanup failed. Build and publish will continue; legacy caches may remain near the repository cache limit.' >> "$GITHUB_STEP_SUMMARY"

  build:
    if: github.event_name == 'merge_group' || github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43
        with: {egress-policy: audit}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version-file: .node-version}
      - *disk-start
      - name: Locked Buildx
        run: python3 deploy/ci/tools.py buildx
      - name: Export GHA cache credentials
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            if (!process.env.ACTIONS_RUNTIME_TOKEN) throw new Error('GHA cache runtime token is missing');
            core.setSecret(process.env.ACTIONS_RUNTIME_TOKEN);
            for (const name of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_CACHE_URL', 'ACTIONS_RESULTS_URL']) {
              if (process.env[name]) core.exportVariable(name, process.env[name]);
            }
      - name: Native image and GHA cache
        env:
          ARCH: ${{ matrix.arch }}
          CACHE_WRITE: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
        shell: bash -e -o pipefail -c "exec runner-disk-shell.sh {0}"
        run: |
          case "${ARCH}/$(docker info --format '{{.Architecture}}')" in
            amd64/x86_64|arm64/aarch64) ;;
            *) echo 'PLAT_NATIVE_ARCH: Docker must run the matrix architecture natively' >&2; exit 1;;
          esac
          buildx create --name platform --driver docker-container --driver-opt "image=$(jq -r .images.buildkit deploy/versions.json)" --use
          cache_export=()
          if [[ "${CACHE_WRITE}" == true ]]; then
            cache_export=(--cache-to "type=gha,version=2,scope=console-platform-${ARCH},mode=min")
          fi
          buildx build --builder platform --platform "linux/${ARCH}" \
            --build-arg "NODE_IMAGE=$(jq -r .images.node deploy/versions.json)" \
            --build-arg "RUST_IMAGE=$(jq -r .images.rust deploy/versions.json)" \
            --build-arg "RUNTIME_IMAGE=$(jq -r .images.runtime deploy/versions.json)" \
            --cache-from "type=gha,version=2,scope=console-platform-${ARCH}" \
            "${cache_export[@]}" --progress=plain \
            --tag "console-platform:${ARCH}" --file deploy/images/console.Dockerfile \
            --output "type=docker,dest=${RUNNER_TEMP}/console-${ARCH}.tar" .
      - name: Test native image
        env: {ARCH: '${{ matrix.arch }}'}
        shell: bash -e -o pipefail -c "exec runner-disk-shell.sh {0}"
        run: |
          docker load --input "${RUNNER_TEMP}/console-${ARCH}.tar"
          bash deploy/ci/image-smoke.sh "console-platform:${ARCH}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: console-${{ matrix.arch }}
          path: ${{ runner.temp }}/console-${{ matrix.arch }}.tar
          retention-days: 2
          compression-level: 0
      - *disk-evidence

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      artifact: ${{ steps.artifact.outputs.reference }}
      image: ${{ steps.image.outputs.name }}@${{ steps.image.outputs.digest }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43
        with: {egress-policy: audit}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version-file: .node-version, cache: npm}
      - *disk-start
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with: {pattern: 'console-*', merge-multiple: true, path: '.tmp/images'}
      - name: Tools and registry login
        env: {REGISTRY_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        shell: bash -e -o pipefail -c "exec runner-disk-shell.sh {0}"
        run: |
          python3 deploy/ci/tools.py buildx cosign syft flux kustomize kubeconform conftest
          npm ci --ignore-scripts --no-audit --no-fund
          printf '%s' "${REGISTRY_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/console" >> "${GITHUB_ENV}"
          echo "DEPLOY=ghcr.io/${GITHUB_REPOSITORY,,}/console-deploy" >> "${GITHUB_ENV}"
      - name: Push native manifests and merge OCI index
        id: image
        env: {GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        shell: bash -e -o pipefail -c "exec runner-disk-shell.sh {0}"
        run: |
          sources=()
          unsigned_sources=()
          mkdir -p .tmp/previous
          if flux pull artifact "oci://${DEPLOY}:shadow" --output=.tmp/previous 2> .tmp/previous-error.txt; then
            cp .tmp/previous/revision.json .tmp/previous-revision.json
          else
            # Only an absent first artifact is bootstrapping; auth/network failures remain errors. GHCR answers a
            # package that does not exist yet with 'denied', so that case is confirmed by the package API's 404.
            cat .tmp/previous-error.txt >&2
            if ! grep -Eqi 'MANIFEST_UNKNOWN|manifest unknown|not found|404' .tmp/previous-error.txt; then
              pkg="${DEPLOY#ghcr.io/*/}"
              code="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${GH_TOKEN}" \
                "https://api.github.com/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${pkg//\//%2F}")"
              [[ "${code}" == 404 ]] || { echo "previous deploy artifact unreadable and its package exists (HTTP ${code})" >&2; exit 1; }
            fi
            printf '{}\n' > .tmp/previous-revision.json
          fi
          for arch in amd64 arm64; do
            docker load --input ".tmp/images/console-${arch}.tar"
            tag="${IMAGE}:${GITHUB_SHA}-${GITHUB_RUN_ID}-${arch}"
            docker tag "console-platform:${arch}" "${tag}"
            docker push "${tag}"
            digest="$(buildx imagetools inspect "${tag}" --format '{{json .Manifest}}' | jq -er .digest)"
            sources+=("${IMAGE}@${digest}")
            unsigned_tag="${IMAGE}-unsigned:${GITHUB_SHA}-${GITHUB_RUN_ID}-${arch}"
            docker tag "console-platform:${arch}" "${unsigned_tag}"
            docker push "${unsigned_tag}"
            unsigned_sources+=("${IMAGE}-unsigned@${digest}")
          done
          buildx imagetools create --tag "${IMAGE}:${GITHUB_SHA}" "${sources[@]}"
          buildx imagetools create --tag "${IMAGE}-unsigned:${GITHUB_SHA}" "${unsigned_sources[@]}"
          digest="$(buildx imagetools inspect "${IMAGE}:${GITHUB_SHA}" --format '{{json .Manifest}}' | jq -er .digest)"
          buildx imagetools inspect "${IMAGE}@${digest}" --raw > .tmp/index.json
          jq -e '[.manifests[].platform | .os + "/" + .architecture] | sort == ["linux/amd64", "linux/arm64"]' .tmp/index.json
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "name=${IMAGE}" >> "${GITHUB_OUTPUT}"
          cosign sign --yes "${IMAGE}@${digest}"
          syft "registry:${IMAGE}@${digest}" --platform linux/amd64 -o spdx-json=.tmp/sbom-amd64.json
          syft "registry:${IMAGE}@${digest}" --platform linux/arm64 -o spdx-json=.tmp/sbom-arm64.json
          node deploy/ci/sbom.mjs .tmp/sbom-amd64.json .tmp/sbom-arm64.json .tmp/sbom.json
      - name: SLSA provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: SPDX SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: .tmp/sbom.json
          push-to-registry: true
      - name: Signed shadow deploy artifact
        id: artifact
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          PLATFORM_WORKFLOW_IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/platform.yml@refs/heads/dev
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node deploy/ci/render.mjs exit-test "${IMAGE}@${IMAGE_DIGEST}" .tmp/bundle
          unsigned_digest="$(buildx imagetools inspect "${IMAGE}-unsigned:${GITHUB_SHA}" --format '{{json .Manifest}}' | jq -er .digest)"
          jq --arg unsigned "${IMAGE}-unsigned@${unsigned_digest}" --arg wrong "${IMAGE}-wrong-identity@${unsigned_digest}" \
            '. + {unsignedImage: $unsigned, wrongIdentityImage: $wrong}' .tmp/bundle/revision.json > .tmp/revision.json
          mv .tmp/revision.json .tmp/bundle/revision.json
          node deploy/ci/previous-release.mjs .tmp/bundle/revision.json .tmp/previous-revision.json
          cp .tmp/sbom.json .tmp/bundle/image-sbom.json
          bash deploy/ci/validate.sh .tmp/bundle
          flux push artifact "oci://${DEPLOY}:shadow" --path=.tmp/bundle \
            --source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" --revision="${GITHUB_SHA}" --output=json > .tmp/artifact.json
          digest="$(jq -er '.digest' .tmp/artifact.json)"
          cosign sign --yes "${DEPLOY}@${digest}"
          echo "reference=oci://${DEPLOY}@${digest}" >> "${GITHUB_OUTPUT}"
      - *disk-evidence

  scan:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {contents: read, packages: read}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43
        with: {egress-policy: audit}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version-file: .node-version}
      - *disk-start
      - shell: bash -e -o pipefail -c "exec runner-disk-shell.sh {0}"
        run: python3 deploy/ci/tools.py cosign grype
      - name: Scan the image's verified SPDX attestation
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          REGISTRY_TOKEN: ${{ github.token }}
        shell: bash -e -o pipefail -c "exec runner-disk-shell.sh {0}"
        run: |
          printf '%s' "${REGISTRY_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          cosign verify-attestation --type=https://spdx.dev/Document/v2.3 --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            --certificate-identity="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/platform.yml@refs/heads/dev" \
            "${IMAGE}" > "${RUNNER_TEMP}/spdx-attestation.json"
          jq -ecs --arg digest "${IMAGE##*@sha256:}" \
            '[.[] | (if type == "array" then .[] else . end) | .payload | @base64d | fromjson | select(any(.subject[]; .digest.sha256 == $digest)) | .predicate] | if length > 0 then .[] else error("expected a verified image SBOM") end' \
            "${RUNNER_TEMP}/spdx-attestation.json" > "${RUNNER_TEMP}/image-sboms.jsonl"
          while IFS= read -r sbom; do
            printf '%s\n' "${sbom}" > "${RUNNER_TEMP}/image-sbom.json"
            grype "sbom:${RUNNER_TEMP}/image-sbom.json" --only-fixed --fail-on high
          done < "${RUNNER_TEMP}/image-sboms.jsonl"
      - *disk-evidence

  negative-signer:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: publish
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/platform-negative-signer.yml
    with:
      artifact: ${{ needs.publish.outputs.artifact }}

  exit-test:
    if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev') || (github.event_name == 'push' && needs.negative-signer.result == 'success'))
    needs: [publish, negative-signer]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        repetition: ${{ fromJSON(github.event_name == 'schedule' && '[1, 2]' || '[1]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43
        with: {egress-policy: audit}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, ref: dev}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version-file: .node-version, cache: npm}
      - *disk-start
      - name: Locked tools
        shell: bash -e -o pipefail -c "exec runner-disk-shell.sh {0}"
        run: |
          python3 deploy/ci/tools.py kind kubectl flux cosign kustomize
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Class B reconciliation and negative controls
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPETITION: ${{ matrix.repetition }}
          PLATFORM_WORKFLOW_IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/platform.yml@refs/heads/dev
          ARTIFACT: ${{ needs.publish.outputs.artifact }}
          WRONG_ARTIFACT: ${{ needs.negative-signer.outputs.artifact }}
        shell: bash -e -o pipefail -c "exec runner-disk-shell.sh {0}"
        run: bash deploy/ci/exit-test.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: class-b-${{ runner.arch }}-${{ matrix.repetition }}
          path: .tmp/evidence
          if-no-files-found: error
          retention-days: 14
      - *disk-evidence
