# SPDX-License-Identifier: LicenseRef-Proprietary
# Disable repository default setup when this advanced workflow merges (see docs/security/code-scanning-triage.md).
name: CodeQL
on:
  push:
    branches: [dev]
  schedule:
    - cron: '37 3 * * 1'
permissions: {}
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python, rust]
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed
        with:
          egress-policy: block
          allowed-endpoints: "*.actions.githubusercontent.com:443 *.blob.core.windows.net:443 api.github.com:443 codeload.github.com:443 ghcr.io:443 github.com:443 objects.githubusercontent.com:443 pkg-containers.githubusercontent.com:443 raw.githubusercontent.com:443 release-assets.githubusercontent.com:443 uploads.github.com:443"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - name: Analyze first-party code
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:${{ matrix.language }}
