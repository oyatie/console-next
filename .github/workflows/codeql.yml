# Disable repository default setup when this advanced workflow merges (see docs/security/code-scanning-triage.md).
name: CodeQL
on:
  push:
    branches: [dev]
  pull_request:
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '37 3 * * 1'
permissions: {}
concurrency:
  group: codeql-${{ github.ref }}
  # dev pushes and the weekly scan run to completion; only superseded PR scans are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Rust takes ~31 min, so PRs and merge groups skip it (owner ruling CI-CODEQL-TIER, 2026-10-22);
        # dev pushes and the weekly schedule scan every language.
        language: ${{ fromJSON((github.event_name == 'pull_request' || github.event_name == 'merge_group') && '["actions","javascript-typescript","python"]' || '["actions","javascript-typescript","python","rust"]') }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - name: Analyze first-party code
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: /language:${{ matrix.language }}
          output: ${{ runner.temp }}/codeql-results
          wait-for-processing: true
      - name: Refuse high or critical findings in changed lines
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        env:
          CODEQL_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          CODEQL_RESULTS: ${{ runner.temp }}/codeql-results
        run: node scripts/check-codeql-diff.mjs "$CODEQL_RESULTS" "$CODEQL_BASE"
      - name: Refuse untriaged high or critical JavaScript/Rust alerts
        if: ${{ github.event_name == 'push' && (matrix.language == 'javascript-typescript' || matrix.language == 'rust') }}
        env:
          CODEQL_LANGUAGE: ${{ matrix.language }}
          CODEQL_ALERT_EXCEPTIONS: .github/codeql/alert-exceptions.json
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-codeql-alerts.mjs

  code-scanning:
    name: Code scanning gate
    needs: [analyze]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Require every language analysis and diff gate
        env:
          ANALYZE_RESULT: ${{ needs.analyze.result }}
        run: test "$ANALYZE_RESULT" = success
