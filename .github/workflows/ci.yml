# SPDX-License-Identifier: LicenseRef-Proprietary
# Candidate checks on pull requests and merge groups; dev pushes consume the proven tree's artifacts
# (public-readiness H-4): the web workspace and the backend
# workspace, each standalone. Fork pull requests run with a read-only token and no secrets (plain pull_request,
# never pull_request_target); the repository setting "Require approval for all outside collaborators" gates them.
# web runs `npm run check`: the client-contract check against backend/openapi, typecheck, lint, unit tests, build,
# bundle budget, gitleaks over the whole history and the build, licence headers on added files, fixture ids
# (checksum-valid RRNs, whole or Excel-stripped) and the npm licence gate.
# backend also runs non-database Rust tests, including full-feature OpenAPI drift, with nextest
# and reconciles JUnit with a fresh test inventory.
# Database tests remain INTEG's; solo journeys gate merge groups, mocked states run for affected web changes.
name: ci
on:
  push:
    branches: [dev]
  pull_request:
  merge_group:
permissions: {}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  affected:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      run-id: ${{ fromJSON(steps.proof.outputs.result || '{}').id }}
      tools: ${{ fromJSON(steps.proof.outputs.result || '{}').tools }}
      backend: ${{ steps.paths.outputs.backend || steps.import.outputs.backend }}
      web: ${{ steps.paths.outputs.web || steps.import.outputs.web }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with: {egress-policy: audit}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version-file: .node-version}
      - run: node --test scripts/ci-affected.test.mjs
        if: github.event_name != 'push'
      - name: Classify changes against the merge base
        if: github.event_name != 'push'
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci-affected.mjs "$GITHUB_EVENT_NAME" "$BASE_SHA" "$HEAD_SHA"
      - id: proof
        if: github.event_name == 'push'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { source } = require('./.github/ci-proof.cjs');
            for (let attempt = 0; ; attempt++) {
              try { return await source(github, context); }
              catch (error) {
                if (!error.message.startsWith('CI_PROOF_MISSING') || attempt >= 5) throw error;
                await new Promise(resolve => setTimeout(resolve, 10000));
              }
            }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: github.event_name == 'push'
        with:
          name: ci-proof
          run-id: ${{ fromJSON(steps.proof.outputs.result).id }}
          github-token: ${{ github.token }}
          path: .cache/proof
      - id: import
        if: github.event_name == 'push'
        env:
          PROVEN_SHA: ${{ fromJSON(steps.proof.outputs.result).sha }}
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const proof = JSON.parse(fs.readFileSync('.cache/proof/ci.json'));
          if (proof.commit !== process.env.PROVEN_SHA) throw new Error('CI_PROOF_COMMIT');
          for (const key of ['backend', 'web']) {
            const value = proof.jobs.affected.outputs[key];
            if (!['true', 'false'].includes(value)) throw new Error('CI_PROOF_CLASSIFICATION');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
          }
          JS

  commits:
    if: github.event_name != 'push'
    permissions:
      contents: read
    uses: ./.github/workflows/commits.yml

  workflows:
    if: github.event_name != 'push'
    permissions: {contents: read}
    uses: ./.github/workflows/workflows-check.yml

  web:
    needs: [affected]
    if: &web-affected ${{ github.event_name != 'push' && needs.affected.outputs.web == 'true' }}
    runs-on: ubuntu-24.04
    # 12m setup (9m observed browser install + 3m checkout/npm/artifacts) + existing 30m checks.
    timeout-minutes: 42
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      # Full history: the ratchet tests (scripts/gates.test.ts ai-quality) diff against the dev branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: local dev branch for the ratchet base
        run: git rev-parse --verify -q refs/heads/dev >/dev/null || git branch dev origin/dev
      # npm run secrets and scripts/hygiene.test.ts need the real scanner (pinned release, checksum-verified).
      - name: gitleaks 8.30.1
        run: |
          curl -sSfL --retry 4 -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - &playwright-version
        name: Locked Playwright version
        id: playwright
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${lock.packages['node_modules/playwright-core'].version}\n`);
          JS
      - &playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-chromium-${{ steps.playwright.outputs.version }}
      - &playwright-install
        name: Chromium headless shell for browser-backed tests
        run: |
          install_started=$SECONDS
          report_install_duration() {
            printf 'Playwright Chromium install: %ss (includes OS dependencies).\n' "$((SECONDS - install_started))" >> "$GITHUB_STEP_SUMMARY"
          }
          trap report_install_duration EXIT
          npx playwright install --with-deps --only-shell chromium
      - name: Export browser cache for dev
        if: github.event_name == 'merge_group'
        run: tar -czf "$RUNNER_TEMP/playwright.tgz" -C "$HOME/.cache" ms-playwright
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: github.event_name == 'merge_group'
        with: {name: playwright-cache, path: '${{ runner.temp }}/playwright.tgz', retention-days: 1, if-no-files-found: error}
      - name: Web checks
        timeout-minutes: 30
        run: |
          npm run check
          node --test scripts/ci-backend.test.mjs
          node --test scripts/ghcr-retention.test.mjs
          node --test scripts/negative-index.test.mjs
          python3 scripts/d7_evidence_test.py
          node --test scripts/d10-census.test.mjs
          python3 scripts/d10_evidence_test.py
          python3 scripts/d8_evidence_test.py
          python3 scripts/states_evidence_test.py
          CONSOLE_WEB_PORT=58743 npx playwright test --config apps/web/src/features/people/ui/grid-table.playwright.ts grid-table.spec.ts grid-table-focus.spec.ts grid-table-paste.spec.ts

  # Duration-packed whole specs; matrix size and exact selections come from the same budget-checked plan.
  states-plan:
    needs: [affected]
    if: *web-affected
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with: {egress-policy: audit}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version-file: .node-version, cache: npm}
      - run: npm ci --no-audit --no-fund
      - run: node --test scripts/states-shards.test.mjs
      - name: Find latest trusted dev timings
        id: timings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --retry 4 --get \
            -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            --data-urlencode 'name=states-timings' --data-urlencode 'per_page=100' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts" > "${RUNNER_TEMP}/states-timings.json"
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const { artifacts } = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/states-timings.json`, 'utf8'));
          const cached = artifacts.find(a => !a.expired && a.workflow_run?.head_branch === 'dev' && a.workflow_run.head_repository_id === Number(process.env.GITHUB_REPOSITORY_ID) && a.workflow_run.repository_id === Number(process.env.GITHUB_REPOSITORY_ID));
          if (cached) appendFileSync(process.env.GITHUB_OUTPUT, `run-id=${cached.workflow_run.id}\n`);
          JS
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: steps.timings.outputs.run-id != ''
        with:
          name: states-timings
          run-id: ${{ steps.timings.outputs.run-id }}
          github-token: ${{ github.token }}
          path: .cache/states-timings
      - name: Plan every state spec
        id: plan
        env:
          E2E_MODULES_FILE: .cache/states-plan/modules.json
        run: |
          mkdir -p .cache
          node scripts/d8-module-routes.mjs "$E2E_MODULES_FILE"
          npx playwright test --config e2e/mock/playwright.config.ts --list --reporter=json > .cache/states-list.json
          node scripts/states-shards.mjs plan .cache/states-list.json e2e/mock/timings.json .cache/states-plan/plan.json .cache/states-timings/timings.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: states-plan
          path: .cache/states-plan
          include-hidden-files: true
          if-no-files-found: error

  states:
    needs: states-plan
    runs-on: ubuntu-24.04
    # Plan-derived run budget plus setupAllowanceSeconds; setup cannot consume the run allowance.
    timeout-minutes: ${{ matrix.jobTimeoutMinutes }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs['states-plan'].outputs.matrix) }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - *playwright-version
      - *playwright-cache
      - *playwright-install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: states-plan
          path: .cache/states-plan
      # Workers stay at the timing configuration's default; go wider with shards, not workers.
      - run: node scripts/states-shards.mjs run .cache/states-plan/plan.json "${{ matrix.shard }}"
        timeout-minutes: ${{ matrix.runTimeoutMinutes }}
        env:
          E2E_MODULES_FILE: .cache/states-plan/modules.json
          PLAYWRIGHT_JSON_OUTPUT_FILE: .cache/states-report-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: states-report-${{ matrix.shard }}
          path: .cache/states-report-${{ matrix.shard }}.json
          include-hidden-files: true
          if-no-files-found: error

  states-timings:
    if: github.event_name == 'push' && needs.affected.outputs.web == 'true'
    needs: [affected]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with: {egress-policy: audit}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version-file: .node-version}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          run-id: ${{ needs.affected.outputs.run-id }}
          github-token: ${{ github.token }}
          pattern: states-report-*
          merge-multiple: true
          path: .cache/states-reports
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          run-id: ${{ needs.affected.outputs.run-id }}
          github-token: ${{ github.token }}
          name: states-plan
          path: .cache/states-plan
      - name: Refresh measurements from complete CI results
        run: node scripts/states-shards.mjs refresh e2e/mock/timings.json .cache/states-plan/plan.json .cache/states-timings/timings.json .cache/states-reports/*.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: states-timings
          path: .cache/states-timings/timings.json
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error

  backend:
    needs: [affected]
    if: &backend-affected ${{ !cancelled() && github.event_name != 'push' && needs.affected.outputs.backend == 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions: {contents: read}
    defaults: &backend-defaults
      run:
        working-directory: backend
    env: &backend-env
      SQLX_OFFLINE: "true"
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - &backend-harden
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with: {egress-policy: audit}
      - &backend-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false, fetch-depth: 0}
      # All workers restore the same cache; only the dev-only collector saves their union.
      - &rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            backend/target
          key: backend-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('backend/rust-toolchain.toml', 'backend/Cargo.lock', 'backend/**/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            backend-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('backend/rust-toolchain.toml', 'backend/Cargo.lock', 'backend/**/Cargo.toml') }}-
      - &cache-mark
        name: Mark restored cache
        run: |
          mkdir -p "$HOME/.cargo/registry" "$HOME/.cargo/git/db" "$GITHUB_WORKSPACE/backend/target"
          touch "$RUNNER_TEMP/rust-cache-start"
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - &cache-collect
        name: Collect Rust cache changes
        if: github.event_name == 'merge_group'
        run: |
          mkdir -p "$RUNNER_TEMP/rust-cache"
          cd "$HOME"
          find .cargo/registry .cargo/git/db -type f -newer "$RUNNER_TEMP/rust-cache-start" -print0 |
            tar --null -czf "$RUNNER_TEMP/rust-cache/registry-$GITHUB_JOB-${NEXTEST_SHARD:-0}.tgz" -T -
          cd "$GITHUB_WORKSPACE"
          find backend/target -type f -newer "$RUNNER_TEMP/rust-cache-start" -print0 |
            tar --null -czf "$RUNNER_TEMP/rust-cache/target-$GITHUB_JOB-${NEXTEST_SHARD:-0}.tgz" -T -
      - &cache-upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: github.event_name == 'merge_group'
        with:
          name: rust-cache-${{ github.job }}-${{ env.NEXTEST_SHARD || '0' }}
          path: ${{ runner.temp }}/rust-cache/*.tgz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  backend-gates:
    needs: [affected]
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.affected.outputs.backend == 'true') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions: {contents: read}
    defaults: *backend-defaults
    env:
      SQLX_OFFLINE: "true"
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      MIGRATION_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
    steps:
      - *backend-harden
      - *backend-checkout
      - *rust-cache
      - *cache-mark
      - run: cargo test --locked -p console-gate-migration-safety
      - name: Backend code gates (release parity)
        shell: bash
        run: |
          pkgs="$(sed -n 's/^name = "\(console-gate-[a-z0-9-]*\)"$/\1/p' ci/gates/*/Cargo.toml | sort -u)"
          test -n "$pkgs"
          args=()
          for p in ${pkgs}; do args+=(-p "$p"); done
          cargo build --locked "${args[@]}"
          failed=0
          for p in ${pkgs}; do
            cargo run -q --locked --offline -p "${p}" || failed=1
          done
          echo "Backend code gates: ${SECONDS}s"
          exit "$failed"
      - *cache-collect
      - *cache-upload

  backend-release:
    needs: [affected]
    if: *backend-affected
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions: {contents: read}
    defaults: *backend-defaults
    env: *backend-env
    steps:
      - *backend-harden
      - *backend-checkout
      - *rust-cache
      - *cache-mark
      - name: Release backend for Home probe
        run: cargo build --release --locked -p console-app --features e2e-test-support
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: d10-backend
          path: backend/target/release/console-app
          retention-days: 1
          if-no-files-found: error
      - *cache-collect
      - *cache-upload

  backend-tests:
    needs: [affected]
    if: *backend-affected
    runs-on: ubuntu-24.04-arm
    # Queue workers also export cache deltas (observed 13m); retain the PR check budget.
    timeout-minutes: ${{ github.event_name == 'merge_group' && 45 || 30 }}
    permissions: {contents: read}
    defaults: *backend-defaults
    env:
      SQLX_OFFLINE: "true"
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_NEXTEST_VERSION: 0.9.138
      NEXTEST_SHARD: ${{ matrix.shard }}
      NEXTEST_SHARDS: ${{ strategy.job-total }}
    strategy:
      fail-fast: false
      matrix: {shard: [1, 2]}
    steps:
      - *backend-harden
      - *backend-checkout
      - *rust-cache
      - *cache-mark
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version-file: .node-version}
      - name: Install pinned Rust test runner
        run: |
          curl --fail --silent --show-error --retry 4 --location -o "${RUNNER_TEMP}/nextest.tar.gz" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${CARGO_NEXTEST_VERSION}/cargo-nextest-${CARGO_NEXTEST_VERSION}-aarch64-unknown-linux-gnu.tar.gz"
          echo "e1c85dbe02dcf5b963803b3f96f4f561757f5c37cab68c932411dea20d57284e  ${RUNNER_TEMP}/nextest.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/nextest.tar.gz" -C "${RUNNER_TEMP}" cargo-nextest
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"
      - run: node scripts/backend-tests.mjs
        working-directory: .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: backend-test-results-${{ matrix.shard }}
          path: backend/target/nextest/ci/
          if-no-files-found: error

      - *cache-collect
      - *cache-upload

  # Import only the successful queue proof; all cache writes stay on dev.
  backend-cache:
    if: github.event_name == 'push' && needs.affected.outputs.backend == 'true'
    needs: [affected]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions: {contents: read, actions: read}
    steps:
      - *backend-harden
      - *backend-checkout
      - *rust-cache
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          run-id: ${{ needs.affected.outputs.run-id }}
          github-token: ${{ github.token }}
          pattern: rust-cache-*
          merge-multiple: true
          path: ${{ runner.temp }}/rust-cache
      - name: Merge Rust cache changes
        run: |
          for archive in "$RUNNER_TEMP"/rust-cache/registry-*.tgz; do tar -xzf "$archive" -C "$HOME"; done
          for archive in "$RUNNER_TEMP"/rust-cache/target-*.tgz; do tar -xzf "$archive" -C "$GITHUB_WORKSPACE"; done
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            backend/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

  home:
    needs: [affected, backend-release]
    if: ${{ !cancelled() && github.event_name != 'push' && needs.affected.result == 'success' && (needs.affected.outputs.web == 'true' || needs.affected.outputs.backend == 'true') && (needs['backend-release'].result == 'success' || (needs.affected.outputs.backend == 'false' && needs['backend-release'].result == 'skipped')) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with: {egress-policy: audit}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version-file: .node-version, cache: npm}
      - name: Served Home probe prerequisites
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps --only-shell chromium
          npm run build
      - name: Find latest successful trusted dev backend
        id: backend
        if: needs['backend-release'].result == 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-home-backend.mjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: d10-backend
          path: .cache/home-backend
          run-id: ${{ steps.backend.outputs.run-id || github.run_id }}
          github-token: ${{ github.token }}
      - run: chmod +x .cache/home-backend/console-app
      - name: Served 2,000-person Home budget
        env:
          E2E_SERVED: "1"
          E2E_PREBUILT: "1"
          E2E_WORKERS: "1"
          CONSOLE_APP_BIN: .cache/home-backend/console-app
        run: npx playwright test e2e/performance/home-inbox.spec.ts --project=parallel
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() }}
        with:
          name: home-inbox-performance
          path: test-results
          if-no-files-found: error

      - name: Firefox for D7 solo journey
        if: ${{ !cancelled() && github.event_name == 'merge_group' }}
        run: npx playwright install --with-deps firefox
      - name: Solo journey on Chromium and Firefox
        if: ${{ !cancelled() && github.event_name == 'merge_group' }}
        env:
          E2E_SERVED: "1"
          E2E_PREBUILT: "1"
          E2E_REPORTER: line,json
          CONSOLE_APP_BIN: .cache/home-backend/console-app
        run: |
          failed=0
          for browser in 0 1; do
            E2E_XBROWSER="$browser" PLAYWRIGHT_JSON_OUTPUT_FILE=".cache/d7/playwright-$browser.json" \
              npx playwright test e2e/first-run-solo.spec.ts --grep @first-run || failed=1
          done
          exit "$failed"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() && github.event_name == 'merge_group' }}
        with:
          name: d7-playwright
          path: .cache/d7/*.json
          include-hidden-files: true
          if-no-files-found: error

      - name: Live no-grant write census on Chromium
        if: github.event_name == 'merge_group'
        env:
          E2E_SERVED: "1"
          E2E_PREBUILT: "1"
          E2E_REPORTER: line,json
          PLAYWRIGHT_JSON_OUTPUT_FILE: .cache/d10/playwright.json
          CONSOLE_APP_BIN: .cache/home-backend/console-app
        run: |
          npx playwright test e2e/authz/write-refusals.spec.ts --project=parallel
          PLAYWRIGHT_JSON_OUTPUT_FILE=.cache/d10/beacon.json npx playwright test e2e/error-beacon.spec.ts --project=parallel
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() && github.event_name == 'merge_group' }}
        with:
          name: d10-playwright
          path: .cache/d10/*.json
          include-hidden-files: true
          if-no-files-found: error

  release-evidence:
    if: github.event_name == 'push' && needs.affected.outputs.backend == 'true' && needs.affected.outputs.web == 'true'
    needs: [affected]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with: {egress-policy: audit}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version-file: .node-version, cache: npm}
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with: {run-id: '${{ needs.affected.outputs.run-id }}', github-token: '${{ github.token }}', pattern: states-report-*, merge-multiple: true, path: .cache/d7-input}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with: {run-id: '${{ needs.affected.outputs.run-id }}', github-token: '${{ github.token }}', name: d7-playwright, path: .cache/d7-input}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with: {run-id: '${{ needs.affected.outputs.run-id }}', github-token: '${{ github.token }}', pattern: backend-test-results-*, path: .cache/d7-nextest}
      - run: python3 scripts/d7-evidence.py .cache/d7-evidence .cache/d7-nextest .cache/d7-input/*.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: d7-evidence
          path: .cache/d7-evidence/*.json
          include-hidden-files: true
          if-no-files-found: error

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with: {run-id: '${{ needs.affected.outputs.run-id }}', github-token: '${{ github.token }}', name: d10-playwright, path: .cache/d10-input}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with: {run-id: '${{ needs.affected.outputs.run-id }}', github-token: '${{ github.token }}', pattern: states-report-*, merge-multiple: true, path: .cache/d8-input}
      - run: node scripts/d10-census.mjs > .cache/d10-census.json
      - run: python3 scripts/d10-evidence.py .cache/d10-evidence .cache/d10-census.json .cache/d7-evidence .cache/d10-input/*.json
      - run: python3 scripts/d8-evidence.py .cache/d8-evidence .cache/d7-evidence/e2e.json .cache/d8-input/*.json .cache/d10-input/*.json
      - name: Produce route-state evidence from the existing reports
        run: |
          node scripts/d8-module-routes.mjs .cache/d8-routes.json
          python3 scripts/states-evidence.py .cache/d8-evidence/states.json .cache/d8-routes.json .cache/d8-input/*.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: d8-evidence
          path: .cache/d8-evidence/*.json
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: d10-evidence
          path: .cache/d10-evidence/*.json
          include-hidden-files: true
          if-no-files-found: error

  supply-chain:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      CARGO_DENY_VERSION: 0.20.2
      CARGO_AUDIT_VERSION: 0.22.2
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with: {egress-policy: audit}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version-file: .node-version}
      # Reuse approved artifact actions for a cross-run binary cache; only dev writes it.
      - name: Find trusted tool cache
        id: cache
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_KEY: cargo-security-${{ runner.os }}-${{ runner.arch }}-deny-${{ env.CARGO_DENY_VERSION }}-audit-${{ env.CARGO_AUDIT_VERSION }}
        run: |
          echo "TOOL_ROOT=${RUNNER_TEMP}/cargo-security-tools" >> "$GITHUB_ENV"
          echo "key=${CACHE_KEY}" >> "$GITHUB_OUTPUT"
          curl --fail --silent --show-error --retry 4 --get \
            -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            --data-urlencode "name=${CACHE_KEY}" --data-urlencode 'per_page=100' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts" > "${RUNNER_TEMP}/tool-cache.json"
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const { artifacts } = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/tool-cache.json`, 'utf8'));
          const cached = artifacts.find(a => !a.expired && a.workflow_run?.head_branch === 'dev' && a.workflow_run.head_repository_id === a.workflow_run.repository_id);
          if (cached) appendFileSync(process.env.GITHUB_OUTPUT, `run-id=${cached.workflow_run.id}\n`);
          JS
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: steps.cache.outputs.run-id != ''
        with:
          name: ${{ steps.cache.outputs.key }}
          run-id: ${{ steps.cache.outputs.run-id }}
          github-token: ${{ github.token }}
          path: ${{ env.TOOL_ROOT }}/bin
      - name: Install pinned tools on cache miss
        if: steps.cache.outputs.run-id == ''
        run: |
          cargo install cargo-deny --locked --version "${CARGO_DENY_VERSION}" --root "$TOOL_ROOT"
          cargo install cargo-audit --locked --version "${CARGO_AUDIT_VERSION}" --root "$TOOL_ROOT"
      - name: Restore executable permissions
        run: chmod +x "$TOOL_ROOT/bin/cargo-deny" "$TOOL_ROOT/bin/cargo-audit"
      - name: Prove licence and advisory refusals
        run: node --test scripts/supply-chain-fixtures.test.mjs
      - name: cargo-deny
        run: '"$TOOL_ROOT/bin/cargo-deny" --manifest-path backend/Cargo.toml --locked check'
      - name: cargo-audit
        if: ${{ !cancelled() }}
        working-directory: backend
        run: '"$TOOL_ROOT/bin/cargo-audit" audit'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: github.event_name == 'merge_group'
        with:
          name: ${{ steps.cache.outputs.key }}
          path: ${{ env.TOOL_ROOT }}/bin/cargo-*
          retention-days: 90
          if-no-files-found: error

  dev-artifacts:
    if: github.event_name == 'push'
    needs: [affected]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {contents: read, actions: read}
    steps:
      - *backend-harden
      - *backend-checkout
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version-file: .node-version}
      - *playwright-version
      - id: backend
        if: needs.affected.outputs.backend == 'false'
        env: {GH_TOKEN: '${{ github.token }}'}
        run: node scripts/ci-home-backend.mjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: d10-backend
          path: .cache/dev-backend
          run-id: ${{ steps.backend.outputs.run-id || needs.affected.outputs.run-id }}
          github-token: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: {name: d10-backend, path: .cache/dev-backend/console-app, retention-days: 90, if-no-files-found: error}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.affected.outputs.tools }}
          path: .cache/dev-tools
          run-id: ${{ needs.affected.outputs.run-id }}
          github-token: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: {name: '${{ needs.affected.outputs.tools }}', path: '.cache/dev-tools/cargo-*', retention-days: 90, if-no-files-found: error}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: needs.affected.outputs.web == 'true'
        with:
          name: playwright-cache
          path: .cache/dev-browser
          run-id: ${{ needs.affected.outputs.run-id }}
          github-token: ${{ github.token }}
      - if: needs.affected.outputs.web == 'true'
        run: |
          mkdir -p "$HOME/.cache"
          tar -xzf .cache/dev-browser/playwright.tgz -C "$HOME/.cache"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: needs.affected.outputs.web == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-chromium-${{ steps.playwright.outputs.version }}

  ci-ok:
    permissions: {contents: read}
    if: ${{ always() }}
    needs: [affected, commits, workflows, web, states-plan, states, states-timings, backend, backend-gates, backend-tests, backend-release, home, supply-chain, dev-artifacts, backend-cache, release-evidence]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every affected CI job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node <<'JS'
          const jobs = JSON.parse(process.env.NEEDS);
          const push = process.env.GITHUB_EVENT_NAME === 'push';
          for (const key of ['backend', 'web']) {
            if (!['true', 'false'].includes(jobs.affected.outputs[key])) throw new Error('CI_CLASSIFICATION_MISSING');
          }
          const backend = jobs.affected.outputs.backend !== 'false';
          const web = jobs.affected.outputs.web !== 'false';
          const backendJobs = ['backend', 'backend-gates', 'backend-tests', 'backend-release'];
          for (const [name, job] of Object.entries(jobs)) {
            let skip = push;
            if (name === 'affected') skip = false;
            else if (name === 'dev-artifacts') skip = !push;
            else if (name === 'states-timings') skip = !push || !web;
            else if (name === 'backend-cache') skip = !push || !backend;
            else if (name === 'release-evidence') skip = !push || !backend || !web;
            else if (name === 'backend-gates') skip = !push && !backend;
            else if (backendJobs.includes(name)) skip ||= !backend;
            else if (['web', 'states-plan', 'states'].includes(name)) skip ||= !web;
            else if (name === 'home') skip ||= !web && !backend;
            if (job.result !== (skip ? 'skipped' : 'success')) throw new Error(`${name}: ${job.result}`);
          }
          const fs = require('node:fs');
          fs.mkdirSync('.cache', { recursive: true });
          fs.writeFileSync('.cache/ci.json', JSON.stringify({ commit: process.env.GITHUB_SHA, jobs }));
          JS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: github.event_name == 'merge_group'
        with: {name: ci-proof, path: .cache/ci.json, include-hidden-files: true, retention-days: 1, if-no-files-found: error}
