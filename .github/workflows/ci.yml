# SPDX-License-Identifier: LicenseRef-Proprietary
# PR/queue fast proof; dispatch release-unit proof. backend/web preserve the live required checks.
name: ci
"on":
  push:
    branches:
      - dev
  workflow_dispatch: null
  pull_request: null
  merge_group:
    types:
      - checks_requested
permissions: {}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  NPM_CONFIG_CACHE: ${{ github.workspace }}/.cache/npm
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed
        with:
          egress-policy: block
          allowed-endpoints: "*.actions.githubusercontent.com:443 *.blob.core.windows.net:443 api.github.com:443 codeload.github.com:443 github.com:443 nodejs.org:443 objects.githubusercontent.com:443 raw.githubusercontent.com:443 registry.npmjs.org:443 release-assets.githubusercontent.com:443 static.rust-lang.org:443"
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - &duration-start
        name: Start duration measurement
        run: echo "CI_STARTED_AT=$(date +%s)" >>"$GITHUB_ENV"
      - &node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
          package-manager-cache: false
      - &npm-restore
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        id: npm
        with:
          path: .cache/npm
          key: console-ci-npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - &npm-ci
        run: npm ci --no-audit --no-fund
      - name: Affected Cargo and npm workspaces
        id: plan
        run: node scripts/ci/plan.mjs
      - &job-metrics
        name: Record duration and cache hits
        if: always()
        env:
          CI_STEPS: ${{ toJSON(steps) }}
        run: node scripts/ci/report.mjs
      - name: Personal-data scan before any upload
        id: privacy
        if: always()
        env: &scan-terms
          CLIENT_DATA_TERMS: ${{ (github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/dev')) && secrets.CONSOLE_CLIENT_DATA_TERMS || '' }}
        run: node scripts/ci/privacy.mjs .cache/ci/summary.md .cache/ci/metrics.json
      - name: Publish scanned summary
        if: always() && steps.privacy.outcome == 'success'
        run: cat .cache/ci/summary.md >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.privacy.outcome == 'success' && steps.plan.outputs.retention != ''
        with:
          name: metrics-plan
          path: .cache/ci/metrics.json
          retention-days: ${{ steps.plan.outputs.retention }}
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
      browsers: ${{ steps.plan.outputs.browsers }}
      e2eFiles: ${{ steps.plan.outputs.e2eFiles }}
      full: ${{ steps.plan.outputs.full }}
      crates: ${{ steps.plan.outputs.crates }}
      workspaces: ${{ steps.plan.outputs.workspaces }}
      backend: ${{ steps.plan.outputs.backend }}
      web: ${{ steps.plan.outputs.web }}
      desktop: ${{ steps.plan.outputs.desktop }}
      e2e: ${{ steps.plan.outputs.e2e }}
      required: ${{ steps.plan.outputs.required }}
      postgres: ${{ steps.plan.outputs.postgres }}
      retention: ${{ steps.plan.outputs.retention }}
      base: ${{ steps.plan.outputs.base }}
      unit: ${{ steps.plan.outputs.unit }}
      db: ${{ steps.plan.outputs.db }}
      build: ${{ steps.plan.outputs.build }}
      budget: ${{ steps.plan.outputs.budget }}
      unitMatrix: ${{ steps.plan.outputs.unitMatrix }}
      dbMatrix: ${{ steps.plan.outputs.dbMatrix }}
      browserVersion: ${{ steps.plan.outputs.browserVersion }}
      testAdmin: ${{ steps.plan.outputs.testAdmin }}
      database: ${{ steps.plan.outputs.database }}
  hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed
        with:
          egress-policy: block
          allowed-endpoints: "*.actions.githubusercontent.com:443 *.blob.core.windows.net:443 api.github.com:443 codeload.github.com:443 github.com:443 nodejs.org:443 objects.githubusercontent.com:443 raw.githubusercontent.com:443 registry.npmjs.org:443 release-assets.githubusercontent.com:443"
      - *checkout
      - *duration-start
      - *node
      - *npm-restore
      - *npm-ci
      - run: bash scripts/ci/install-tools.sh gitleaks actionlint
      - name: actionlint
        run: actionlint -color
      - name: Workflow regression and safety checks
        run: node --test scripts/ci.test.mjs scripts/ci-privacy.test.mjs scripts/ci-results.test.mjs scripts/dev-secrets.test.mjs scripts/check-repo-files.test.mjs
      - name: Check hermetic repository inputs
        run: node --test --test-name-pattern="check refuses" scripts/check-hermetic.test.mjs
      - name: Repository file policy
        run: node scripts/check-repo-files.mjs --full
      - name: Synthetic fixtures and repository secrets
        run: |-
          node scripts/check-fixture-ids.mjs
          node scripts/check-e2e-identifiers.mjs
          gitleaks git --redact --no-banner --config .gitleaks.toml --log-opts=HEAD .
      - name: Structural client-data scan
        run: |-
          python3 scripts/client-data-scan.py --root . --tree
          python3 scripts/ci/scan-uploads.py --terms-tree
      - name: Validate the owned trunk baseline
        env:
          CI_BASE_SHA: ${{ needs.plan.outputs.base }}
        run: python3 scripts/ci/test-results.py --validate
      - *job-metrics
      - name: Personal-data scan before any upload
        id: privacy
        if: always()
        env: *scan-terms
        run: node scripts/ci/privacy.mjs .cache/ci/summary.md .cache/ci/metrics.json .cache/npm
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        if: >-
          success() && github.event_name == 'push' && github.ref == 'refs/heads/dev' && steps.privacy.outcome == 'success' &&
          steps.npm.outputs.cache-hit != 'true'
        with:
          path: .cache/npm
          key: console-ci-npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Publish scanned summary
        if: always() && steps.privacy.outcome == 'success'
        run: cat .cache/ci/summary.md >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.privacy.outcome == 'success' && needs.plan.outputs.retention != ''
        with:
          name: metrics-hygiene
          path: .cache/ci/metrics.json
          retention-days: ${{ needs.plan.outputs.retention }}
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
    needs:
      - plan
  web-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed
        with:
          egress-policy: block
          allowed-endpoints: "*.actions.githubusercontent.com:443 *.blob.core.windows.net:443 api.github.com:443 archive.ubuntu.com:443 azure.archive.ubuntu.com:80 cdn.playwright.dev:443 codeload.github.com:443 github.com:443 nodejs.org:443 objects.githubusercontent.com:443 packages.microsoft.com:443 playwright.download.prss.microsoft.com:443 raw.githubusercontent.com:443 registry.npmjs.org:443 release-assets.githubusercontent.com:443 security.ubuntu.com:443 static.rust-lang.org:443 storage.googleapis.com:443"
      - *checkout
      - *duration-start
      - *node
      - *npm-restore
      - *npm-ci
      - run: bash scripts/ci/install-tools.sh gitleaks
      - name: Chromium headless shell for browser-backed unit tests
        run: npx playwright install --with-deps --only-shell chromium
      - run: npm run check
        env:
          CI_BASE_SHA: ${{ needs.plan.outputs.base }}
      - *job-metrics
      - name: Personal-data scan before any upload
        id: privacy
        if: always()
        env: *scan-terms
        run: node scripts/ci/privacy.mjs .cache/ci/summary.md .cache/ci/metrics.json .cache/npm apps/web/dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: success() && steps.privacy.outcome == 'success' && needs.plan.outputs.retention != ''
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: ${{ needs.plan.outputs.retention }}
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        if: >-
          success() && github.event_name == 'push' && github.ref == 'refs/heads/dev' && steps.privacy.outcome == 'success' &&
          steps.npm.outputs.cache-hit != 'true'
        with:
          path: .cache/npm
          key: console-ci-npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Publish scanned summary
        if: always() && steps.privacy.outcome == 'success'
        run: cat .cache/ci/summary.md >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.privacy.outcome == 'success' && needs.plan.outputs.retention != ''
        with:
          name: metrics-web
          path: .cache/ci/metrics.json
          retention-days: ${{ needs.plan.outputs.retention }}
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
    needs:
      - plan
    if: needs.plan.outputs.web == 'true' || needs.plan.outputs.e2e == 'true'
  rust-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed
        with:
          egress-policy: block
          allowed-endpoints: "*.actions.githubusercontent.com:443 *.blob.core.windows.net:443 api.github.com:443 codeload.github.com:443 github.com:443 index.crates.io:443 nodejs.org:443 objects.githubusercontent.com:443 raw.githubusercontent.com:443 release-assets.githubusercontent.com:443 static.crates.io:443 static.rust-lang.org:443"
      - *checkout
      - *duration-start
      - *node
      - &cargo-registry-restore
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        id: registry
        with:
          path: |-
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: console-ci-cargo-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock') }}
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        id: compiler
        with:
          path: .cache/sccache
          key: >-
            console-ci-sccache-${{ runner.os }}-${{ hashFiles('backend/rust-toolchain.toml', 'scripts/ci/versions.json') }}-${{
            hashFiles('backend/Cargo.lock') }}-test-symbols
          restore-keys: >-
            console-ci-sccache-${{ runner.os }}-${{ hashFiles('backend/rust-toolchain.toml', 'scripts/ci/versions.json') }}-${{
            hashFiles('backend/Cargo.lock') }}-test-symbols-

            console-ci-sccache-${{ runner.os }}-${{ hashFiles('backend/rust-toolchain.toml', 'scripts/ci/versions.json') }}-
      - run: |-
          bash scripts/ci/install-tools.sh nextest sccache cargo-deny
          echo "SCCACHE_CACHE_SIZE=$(jq -r .sccacheBytes scripts/ci/config.json)" >>"$GITHUB_ENV"
      - name: Reclaim unused hosted SDKs for the shared archive
        run: |-
          jq -r '.runnerUnusedPaths[]' scripts/ci/config.json | while IFS= read -r unused; do sudo rm -rf -- "$unused"; done
      - name: Format and all Clippy feature sets
        if: needs.plan.outputs.backend == 'true'
        run: |-
          cd backend
          cargo fmt --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy --workspace --all-targets --locked --features full -- -D warnings
          cargo clippy --workspace --all-targets --locked --features full,test-postgres -- -D warnings
      - name: Compile and archive the affected workspace once
        if: needs.plan.outputs.backend == 'true'
        env:
          CI_RUST_BUILD: ${{ needs.plan.outputs.build }}
        run: |-
          cd backend
          node ../scripts/ci/rust-build.mjs
      - name: Build the backend once for every browser shard
        if: needs.plan.outputs.e2e == 'true'
        run: |-
          cd backend
          cargo build --locked -p console-app --features full,e2e-test-support
          mkdir -p ../.cache/ci/build/backend
          cp target/debug/console-app ../.cache/ci/build/backend/console-app
      - name: Check build and extraction disk budgets
        run: python3 scripts/ci/disk-budget.py
      - *job-metrics
      - name: Personal-data scan before any upload
        id: privacy
        if: always()
        env: *scan-terms
        run: >-
          node scripts/ci/privacy.mjs .cache/ci/summary.md .cache/ci/metrics.json .cache/ci/disk.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: success() && steps.privacy.outcome == 'success' && needs.plan.outputs.backend == 'true' && needs.plan.outputs.retention != ''
        with:
          name: rust-tests
          path: .cache/ci/build/tests
          retention-days: ${{ needs.plan.outputs.retention }}
          if-no-files-found: error
          include-hidden-files: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: success() && steps.privacy.outcome == 'success' && needs.plan.outputs.e2e == 'true' && needs.plan.outputs.retention != ''
        with:
          name: backend-binary
          path: .cache/ci/build/backend
          retention-days: ${{ needs.plan.outputs.retention }}
          if-no-files-found: error
          include-hidden-files: true
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        if: >-
          success() && github.event_name == 'push' && github.ref == 'refs/heads/dev' && steps.privacy.outcome == 'success' &&
          steps.registry.outputs.cache-hit != 'true'
        with:
          path: |-
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: console-ci-cargo-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock') }}
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        if: >-
          success() && github.event_name == 'push' && github.ref == 'refs/heads/dev' && steps.privacy.outcome == 'success' &&
          steps.compiler.outputs.cache-hit != 'true'
        with:
          path: .cache/sccache
          key: >-
            console-ci-sccache-${{ runner.os }}-${{ hashFiles('backend/rust-toolchain.toml', 'scripts/ci/versions.json') }}-${{
            hashFiles('backend/Cargo.lock') }}-test-symbols
      - name: Publish scanned summary
        if: always() && steps.privacy.outcome == 'success'
        run: cat .cache/ci/summary.md >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.privacy.outcome == 'success' && needs.plan.outputs.retention != ''
        with:
          name: metrics-rust-build
          path: .cache/ci/metrics.json
          retention-days: ${{ needs.plan.outputs.retention }}
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
    needs:
      - plan
      - hygiene
    if: needs.plan.outputs.backend == 'true' || needs.plan.outputs.e2e == 'true'
    env:
      SQLX_OFFLINE: "true"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_TEST_STRIP: symbols
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_DEV_STRIP: symbols
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
  backend-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed
        with:
          egress-policy: block
          allowed-endpoints: "*.actions.githubusercontent.com:443 *.blob.core.windows.net:443 api.github.com:443 codeload.github.com:443 github.com:443 nodejs.org:443 objects.githubusercontent.com:443 raw.githubusercontent.com:443 release-assets.githubusercontent.com:443 static.rust-lang.org:443"
      - *checkout
      - *duration-start
      - *node
      - run: bash scripts/ci/install-tools.sh nextest
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: rust-tests
          path: .cache/ci
      - name: Non-DB unit suites from the shared archive
        env:
          PARTITION: ${{ matrix.partition }}
        run: |-
          cd backend
          node ../scripts/ci/rust-tests.mjs unit "$PARTITION"
      - *job-metrics
      - name: Personal-data scan before any upload
        id: privacy
        if: always()
        env: *scan-terms
        run: >-
          node scripts/ci/privacy.mjs .cache/ci/summary.md .cache/ci/metrics.json backend/target/nextest/ci/junit.xml
          backend/target/nextest/ci/junit.baseline.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.privacy.outcome == 'success' && needs.plan.outputs.retention != ''
        with:
          name: backend-test-junit-${{ matrix.partition }}
          path: |-
            backend/target/nextest/ci/junit.xml
            backend/target/nextest/ci/junit.baseline.json
          retention-days: ${{ needs.plan.outputs.retention }}
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
      - name: Publish scanned summary
        if: always() && steps.privacy.outcome == 'success'
        run: cat .cache/ci/summary.md >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.privacy.outcome == 'success' && needs.plan.outputs.retention != ''
        with:
          name: metrics-backend-test-${{ matrix.partition }}
          path: .cache/ci/metrics.json
          retention-days: ${{ needs.plan.outputs.retention }}
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
    needs:
      - plan
      - rust-build
    if: needs.plan.outputs.unit == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.unitMatrix) }}
    env:
      SQLX_OFFLINE: "true"
      CI_RUST_BUILD: ${{ needs.plan.outputs.build }}
  backend-db:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed
        with:
          egress-policy: block
          allowed-endpoints: "*.actions.githubusercontent.com:443 *.blob.core.windows.net:443 api.github.com:443 codeload.github.com:443 github.com:443 nodejs.org:443 objects.githubusercontent.com:443 raw.githubusercontent.com:443 release-assets.githubusercontent.com:443 static.rust-lang.org:443"
      - *checkout
      - *duration-start
      - *node
      - name: Generate isolated test credentials
        env:
          PG_PORT: ${{ job.services.postgres.ports['5432'] }}
          PG_ADMIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.partition }}
        run: node scripts/ci/prepare-db.mjs
      - name: Reconcile production role topology
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: bash scripts/ci/bootstrap-db.sh "$PG_CONTAINER" "$RUNNER_TEMP/db.container.env"
      - run: bash scripts/ci/install-tools.sh nextest
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: rust-tests
          path: .cache/ci
      - name: Every DB suite from the shared archive
        env:
          PARTITION: ${{ matrix.partition }}
        run: |-
          cd backend
          node ../scripts/ci/rust-tests.mjs db "$PARTITION"
      - *job-metrics
      - name: Personal-data scan before any upload
        id: privacy
        if: always()
        env: *scan-terms
        run: >-
          node scripts/ci/privacy.mjs .cache/ci/summary.md .cache/ci/metrics.json backend/target/nextest/ci/junit.xml
          backend/target/nextest/ci/junit.baseline.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.privacy.outcome == 'success' && needs.plan.outputs.retention != ''
        with:
          name: backend-db-junit-${{ matrix.partition }}
          path: |-
            backend/target/nextest/ci/junit.xml
            backend/target/nextest/ci/junit.baseline.json
          retention-days: ${{ needs.plan.outputs.retention }}
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
      - name: Publish scanned summary
        if: always() && steps.privacy.outcome == 'success'
        run: cat .cache/ci/summary.md >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.privacy.outcome == 'success' && needs.plan.outputs.retention != ''
        with:
          name: metrics-backend-db-${{ matrix.partition }}
          path: .cache/ci/metrics.json
          retention-days: ${{ needs.plan.outputs.retention }}
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
    needs:
      - plan
      - rust-build
    if: needs.plan.outputs.db == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.dbMatrix) }}
    env:
      CI_RUST_BUILD: ${{ needs.plan.outputs.build }}
      SQLX_OFFLINE: "true"
    services:
      postgres:
        image: ${{ needs.plan.outputs.postgres }}
        env:
          POSTGRES_USER: ${{ needs.plan.outputs.testAdmin }}
          POSTGRES_DB: ${{ needs.plan.outputs.database }}
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.partition }}
        ports:
          - 127.0.0.1::5432
        options: >-
          --health-cmd "pg_isready -U ${{ needs.plan.outputs.testAdmin }} -d ${{ needs.plan.outputs.database }}" --health-interval
          5s --health-timeout 5s --health-retries 20
  e2e-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed
        with:
          egress-policy: block
          allowed-endpoints: "*.actions.githubusercontent.com:443 *.blob.core.windows.net:443 api.github.com:443 codeload.github.com:443 github.com:443 nodejs.org:443 objects.githubusercontent.com:443 raw.githubusercontent.com:443 registry.npmjs.org:443 release-assets.githubusercontent.com:443"
      - *checkout
      - *duration-start
      - *node
      - *npm-restore
      - *npm-ci
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        id: timings
        with:
          path: .cache/e2e-timings
          key: console-ci-e2e-timings-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: console-ci-e2e-timings-${{ runner.os }}-
      - name: Duration-based browser shard inventory
        id: shards
        env:
          E2E_TIMINGS_FILE: ${{ github.workspace }}/.cache/e2e-timings/timings.json
          E2E_SERVED: "1"
          CI_PLAN: ${{ toJSON(needs.plan.outputs) }}
        run: node scripts/ci/e2e.mjs plan
      - *job-metrics
      - name: Personal-data scan before any upload
        id: privacy
        if: always()
        env: *scan-terms
        run: node scripts/ci/privacy.mjs .cache/ci/summary.md .cache/ci/metrics.json
      - name: Publish scanned summary
        if: always() && steps.privacy.outcome == 'success'
        run: cat .cache/ci/summary.md >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.privacy.outcome == 'success' && needs.plan.outputs.retention != ''
        with:
          name: metrics-e2e-plan
          path: .cache/ci/metrics.json
          retention-days: ${{ needs.plan.outputs.retention }}
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
    needs:
      - plan
    if: needs.plan.outputs.e2e == 'true'
    outputs:
      matrix: ${{ steps.shards.outputs.matrix }}
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed
        with:
          egress-policy: block
          allowed-endpoints: "*.actions.githubusercontent.com:443 *.blob.core.windows.net:443 api.github.com:443 archive.ubuntu.com:443 auth.docker.io:443 azure.archive.ubuntu.com:80 cdn.playwright.dev:443 codeload.github.com:443 github.com:443 nodejs.org:443 objects.githubusercontent.com:443 packages.microsoft.com:443 playwright.download.prss.microsoft.com:443 production.cloudflare.docker.com:443 production.cloudfront.docker.com:443 raw.githubusercontent.com:443 registry-1.docker.io:443 registry.npmjs.org:443 release-assets.githubusercontent.com:443 security.ubuntu.com:443 storage.googleapis.com:443"
      - *checkout
      - *duration-start
      - *node
      - *npm-restore
      - *npm-ci
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: console-ci-browsers-${{ runner.os }}-${{ needs.plan.outputs.browserVersion }}-${{ matrix.browser }}
          restore-keys: console-ci-browsers-${{ runner.os }}-${{ needs.plan.outputs.browserVersion }}-${{ matrix.browser }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: backend-binary
          path: .cache/ci/backend
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: web-dist
          path: apps/web/dist
      - name: Install browser and system dependencies
        env:
          BROWSER: ${{ matrix.browser }}
        run: |-
          node_modules/.bin/playwright install --with-deps "$BROWSER"
          python3 scripts/ci/public-browser-cache.py ~/.cache/ms-playwright "$RUNNER_TEMP/public-browsers.json"
          echo "CONSOLE_PUBLIC_BROWSER_MANIFEST_FILE=$RUNNER_TEMP/public-browsers.json" >>"$GITHUB_ENV"
          chmod +x "$CONSOLE_APP_BIN"
      - name: Run the measured shard
        id: browser-run
        env:
          SHARD: ${{ toJSON(matrix) }}
        run: node scripts/ci/e2e.mjs run
      - *job-metrics
      - name: Personal-data scan before any upload
        id: privacy
        if: always()
        env: *scan-terms
        run: >-
          node scripts/ci/privacy.mjs .cache/ci/summary.md .cache/ci/metrics.json .cache/ci/e2e-results test-results
          ~/.cache/ms-playwright
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.privacy.outcome == 'success' && needs.plan.outputs.retention != ''
        with:
          name: e2e-results-${{ matrix.browser }}-${{ matrix.shard }}
          path: .cache/ci/e2e-results
          retention-days: ${{ needs.plan.outputs.retention }}
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.privacy.outcome == 'success' && steps.browser-run.outputs.traces == 'true' && needs.plan.outputs.retention != ''
        with:
          name: e2e-traces-${{ matrix.browser }}-${{ matrix.shard }}
          path: test-results
          retention-days: ${{ needs.plan.outputs.retention }}
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        if: >-
          success() && github.event_name == 'push' && github.ref == 'refs/heads/dev' && steps.privacy.outcome == 'success' &&
          steps.browsers.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/ms-playwright
          key: console-ci-browsers-${{ runner.os }}-${{ needs.plan.outputs.browserVersion }}-${{ matrix.browser }}
      - name: Publish scanned summary
        if: always() && steps.privacy.outcome == 'success'
        run: cat .cache/ci/summary.md >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.privacy.outcome == 'success' && needs.plan.outputs.retention != ''
        with:
          name: metrics-e2e-${{ matrix.browser }}-${{ matrix.shard }}
          path: .cache/ci/metrics.json
          retention-days: ${{ needs.plan.outputs.retention }}
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
    needs:
      - plan
      - e2e-plan
      - web-check
      - rust-build
    if: needs.plan.outputs.e2e == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.e2e-plan.outputs.matrix) }}
    env:
      E2E_SERVED: "1"
      E2E_PREBUILT: "1"
      E2E_REPORTER: dot,junit
      E2E_TIMINGS_FILE: ${{ github.workspace }}/.cache/ci/e2e-results/timings.json
      PLAYWRIGHT_JUNIT_OUTPUT_FILE: .cache/ci/e2e-results/junit.xml
      CONSOLE_APP_BIN: ${{ github.workspace }}/.cache/ci/backend/console-app
      CONSOLE_POSTGRES_IMAGE: ${{ needs.plan.outputs.postgres }}
  desktop-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    needs: [plan]
    if: needs.plan.outputs.desktop == 'true'
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed
        with:
          egress-policy: block
          allowed-endpoints: "*.actions.githubusercontent.com:443 *.blob.core.windows.net:443 api.github.com:443 archive.ubuntu.com:443 azure.archive.ubuntu.com:80 codeload.github.com:443 github.com:443 index.crates.io:443 nodejs.org:443 objects.githubusercontent.com:443 packages.microsoft.com:443 raw.githubusercontent.com:443 release-assets.githubusercontent.com:443 security.ubuntu.com:443 static.crates.io:443 static.rust-lang.org:443"
      - *checkout
      - *duration-start
      - *node
      - *cargo-registry-restore
      - name: Install Tauri Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Desktop crate unit tests
        run: npm run desktop:test -- --locked
      - *job-metrics
      - name: Personal-data scan before any upload
        id: privacy
        if: always()
        env: *scan-terms
        run: node scripts/ci/privacy.mjs .cache/ci/summary.md .cache/ci/metrics.json
      - name: Publish scanned summary
        if: always() && steps.privacy.outcome == 'success'
        run: cat .cache/ci/summary.md >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.privacy.outcome == 'success' && needs.plan.outputs.retention != ''
        with:
          name: metrics-desktop-test
          path: .cache/ci/metrics.json
          retention-days: ${{ needs.plan.outputs.retention }}
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
  ci-ok:
    runs-on: ubuntu-24.04
    # Cover the entire dependency path, including the shared build and test partitions.
    timeout-minutes: 210
    permissions:
      contents: read
      actions: read
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed
        with:
          egress-policy: block
          allowed-endpoints: "*.actions.githubusercontent.com:443 *.blob.core.windows.net:443 api.github.com:443 codeload.github.com:443 github.com:443 index.crates.io:443 nodejs.org:443 objects.githubusercontent.com:443 raw.githubusercontent.com:443 release-assets.githubusercontent.com:443 static.crates.io:443 static.rust-lang.org:443"
      - *checkout
      - *duration-start
      - *node
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        id: timings
        with:
          path: .cache/e2e-timings
          key: console-ci-e2e-timings-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: console-ci-e2e-timings-${{ runner.os }}-
      - *cargo-registry-restore
      - name: Fetch locked code-gate dependencies
        run: |-
          cd backend
          cargo fetch --locked
      - name: Backend code gates (release parity)
        shell: bash
        run: |
          cd backend
          pkgs="$(sed -n 's/^name = "\(console-gate-[a-z0-9-]*\)"$/\1/p' ci/gates/*/Cargo.toml | sort -u)"
          test -n "$pkgs"
          args=()
          for p in ${pkgs}; do args+=(-p "$p"); done
          cargo build --locked --offline "${args[@]}"
          failed=0
          for p in ${pkgs}; do
            cargo run -q --locked --offline -p "${p}" || failed=1
          done
          echo "Backend code gates: ${SECONDS}s"
          exit "$failed"
      - name: Enforce required results and plan-authorized skips
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/gate.mjs
      - name: Collect job metrics and passing test durations
        if: always() && needs.e2e.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: e2e-results-*
          path: .cache/ci/e2e-collected
      - name: Merge measured durations
        if: always() && needs.e2e.result == 'success'
        run: |
          node --input-type=module - <<'NODE'
          import {readdirSync,readFileSync} from 'node:fs';
          import {record} from './scripts/e2e-timings.mjs';
          const dir='.cache/ci/e2e-collected';
          const combined=Object.assign({},
          ...readdirSync(dir).map((file)=>JSON.parse(readFileSync(dir+'/'+file+'/timings.json','utf8'))));
          record(Object.fromEntries(Object.entries(combined).map(([key,value])=>[key,value.s])),
            {file:'.cache/e2e-timings/timings.json'});
          NODE
      - name: Collect completed job metrics
        if: always() && needs.plan.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: metrics-*
          path: .cache/ci/job-metrics
      - name: Record duration and cache hits
        if: always()
        env:
          CI_STEPS: ${{ toJSON(steps) }}
          CI_CACHE_TOTAL: "1"
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/report.mjs
      - name: Personal-data scan before any upload
        id: privacy
        if: always()
        env: *scan-terms
        run: node scripts/ci/privacy.mjs .cache/ci/summary.md .cache/ci/metrics.json .cache/e2e-timings
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        if: >-
          success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/dev' && steps.privacy.outcome == 'success' &&
          steps.timings.outputs.cache-hit != 'true' && needs.e2e.result == 'success'
        with:
          path: .cache/e2e-timings
          key: console-ci-e2e-timings-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish scanned totals
        if: always() && steps.privacy.outcome == 'success'
        run: cat .cache/ci/summary.md >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.privacy.outcome == 'success' && needs.plan.outputs.retention != ''
        with:
          name: metrics-ci-ok
          path: .cache/ci/metrics.json
          retention-days: ${{ needs.plan.outputs.retention }}
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
    if: always()
    needs:
      - plan
      - hygiene
      - web-check
      - desktop-test
      - rust-build
      - backend-test
      - backend-db
      - e2e-plan
      - e2e
  # Keep the live required contexts until the owner switches the ruleset to ci-ok.
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: &propagate-timeout 225
    permissions:
      contents: read
    if: always()
    needs: [ci-ok]
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed
        with:
          egress-policy: block
          allowed-endpoints: "api.github.com:443 codeload.github.com:443 github.com:443"
      - *checkout
      - name: Propagate complete CI proof
        env:
          CI_RESULT: ${{ needs.ci-ok.result }}
        run: test "$CI_RESULT" = success
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: *propagate-timeout
    permissions:
      contents: read
    if: always()
    needs: [ci-ok]
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed
        with:
          egress-policy: block
          allowed-endpoints: "api.github.com:443 codeload.github.com:443 github.com:443"
      - *checkout
      - name: Propagate complete CI proof
        env:
          CI_RESULT: ${{ needs.ci-ok.result }}
        run: test "$CI_RESULT" = success
