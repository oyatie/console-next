# SPDX-License-Identifier: LicenseRef-Proprietary
# Checks on every push to dev and every pull request (public-readiness H-4): the web workspace and the backend
# workspace, each standalone. Fork pull requests run with a read-only token and no secrets (plain pull_request,
# never pull_request_target); the repository setting "Require approval for all outside collaborators" gates them.
# web runs `npm run check`: the client-contract check against backend/openapi, typecheck, lint, unit tests, build,
# bundle budget, gitleaks over the whole history and the build, licence headers on added files, fixture ids
# (checksum-valid RRNs, whole or Excel-stripped) and the npm licence gate.
# backend-tests runs non-database Rust tests with nextest and reconciles JUnit with a fresh test inventory.
# Database tests and real-backend browser E2E are not wired here yet; mocked browser states run in states.
name: ci
on:
  push:
    branches: [dev]
  pull_request:
  merge_group:
permissions: {}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commits:
    permissions:
      contents: read
    uses: ./.github/workflows/commits.yml

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      # Full history: the ratchet tests (scripts/gates.test.ts ai-quality) diff against the dev branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: local dev branch for the ratchet base
        run: git rev-parse --verify -q refs/heads/dev >/dev/null || git branch dev origin/dev
      # npm run secrets and scripts/hygiene.test.ts need the real scanner (pinned release, checksum-verified).
      - name: gitleaks 8.30.1
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Browser-backed unit tests (vitest + Playwright) need the pinned Chromium headless shell; caching is CI-1's.
      - name: Chromium headless shell for browser-backed unit tests
        run: npx playwright install --with-deps --only-shell chromium
      - run: npm run check
      - name: GHCR retention safety controls
        run: node --test scripts/ghcr-retention.test.mjs
      - name: Spreadsheet paste browser regression
        run: npx playwright test --config apps/web/src/features/people/ui/grid-table.playwright.ts grid-table-paste.spec.ts

  # Duration-packed whole specs; matrix size and exact selections come from the same budget-checked plan.
  states-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with: {egress-policy: audit}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version-file: .node-version, cache: npm}
      - run: npm ci --no-audit --no-fund
      - run: node --test scripts/states-shards.test.mjs
      - name: Find latest trusted dev timings
        id: timings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --get \
            -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            --data-urlencode 'name=states-timings' --data-urlencode 'per_page=100' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts" > "${RUNNER_TEMP}/states-timings.json"
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const { artifacts } = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/states-timings.json`, 'utf8'));
          const cached = artifacts.find(a => !a.expired && a.workflow_run?.head_branch === 'dev' && a.workflow_run.head_repository_id === Number(process.env.GITHUB_REPOSITORY_ID) && a.workflow_run.repository_id === Number(process.env.GITHUB_REPOSITORY_ID));
          if (cached) appendFileSync(process.env.GITHUB_OUTPUT, `run-id=${cached.workflow_run.id}\n`);
          JS
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: steps.timings.outputs.run-id != ''
        with:
          name: states-timings
          run-id: ${{ steps.timings.outputs.run-id }}
          github-token: ${{ github.token }}
          path: .cache/states-timings
      - name: Plan every state spec
        id: plan
        run: |
          mkdir -p .cache
          npx playwright test --config e2e/mock/playwright.config.ts --list --reporter=json > .cache/states-list.json
          node scripts/states-shards.mjs plan .cache/states-list.json e2e/mock/timings.json .cache/states-plan/plan.json .cache/states-timings/timings.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: states-plan
          path: .cache/states-plan
          include-hidden-files: true
          if-no-files-found: error

  states:
    needs: states-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs['states-plan'].outputs.matrix) }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps --only-shell chromium
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: states-plan
          path: .cache/states-plan
      # Workers stay at the timing configuration's default; go wider with shards, not workers.
      - run: node scripts/states-shards.mjs run .cache/states-plan/plan.json "${{ matrix.shard }}"
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: .cache/states-report-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: states-report-${{ matrix.shard }}
          path: .cache/states-report-${{ matrix.shard }}.json
          include-hidden-files: true
          if-no-files-found: error

  states-timings:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [states-plan, states]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with: {egress-policy: audit}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version-file: .node-version}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: states-report-*
          merge-multiple: true
          path: .cache/states-reports
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: states-plan
          path: .cache/states-plan
      - name: Refresh measurements from complete CI results
        run: node scripts/states-shards.mjs refresh e2e/mock/timings.json .cache/states-plan/plan.json .cache/states-timings/timings.json .cache/states-reports/*.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: states-timings
          path: .cache/states-timings/timings.json
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error

  backend:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    env:
      SQLX_OFFLINE: "true"
      CARGO_TERM_COLOR: always
      MIGRATION_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # backend/rust-toolchain.toml pins the toolchain; rustup on the runner installs it on first use.
      # Workspace members only: --all would also format the vendored path dependencies in third-party/.
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --locked -p console-gate-migration-safety
      # Clippy fills the registry first so the release commands below can run offline.
      # Same discovery, build and no-argument execution as console-infra's code-gates image stage.
      - name: Backend code gates (release parity)
        shell: bash
        run: |
          pkgs="$(sed -n 's/^name = "\(console-gate-[a-z0-9-]*\)"$/\1/p' ci/gates/*/Cargo.toml | sort -u)"
          test -n "$pkgs"
          args=()
          for p in ${pkgs}; do args+=(-p "$p"); done
          cargo build --locked --offline "${args[@]}"
          failed=0
          for p in ${pkgs}; do
            cargo run -q --locked --offline -p "${p}" || failed=1
          done
          echo "Backend code gates: ${SECONDS}s"
          exit "$failed"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Served Home probe prerequisites
        working-directory: .
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps --only-shell chromium
          npm run build
      - name: Release backend for Home probe
        run: cargo build --release --locked -p console-app --features e2e-test-support
      - name: Served 2,000-person Home budget
        working-directory: .
        env:
          E2E_SERVED: "1"
          E2E_PREBUILT: "1"
          E2E_WORKERS: "1"
          CONSOLE_APP_BIN: backend/target/release/console-app
        run: npx playwright test e2e/performance/home-inbox.spec.ts --project=parallel
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() }}
        with:
          name: home-inbox-performance
          path: test-results
          if-no-files-found: error

  backend-tests:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SQLX_OFFLINE: "true"
      CARGO_TERM_COLOR: always
      CARGO_NEXTEST_VERSION: 0.9.138
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
      - name: Install pinned Rust test runner
        run: |
          curl --fail --silent --show-error --location -o "${RUNNER_TEMP}/nextest.tar.gz" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.138/cargo-nextest-${CARGO_NEXTEST_VERSION}-aarch64-unknown-linux-gnu.tar.gz"
          echo "e1c85dbe02dcf5b963803b3f96f4f561757f5c37cab68c932411dea20d57284e  ${RUNNER_TEMP}/nextest.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/nextest.tar.gz" -C "${RUNNER_TEMP}" cargo-nextest
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"
      - run: node scripts/backend-tests.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: backend-test-results
          path: backend/target/nextest/ci/
          if-no-files-found: error

  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      CARGO_DENY_VERSION: 0.20.2
      CARGO_AUDIT_VERSION: 0.22.2
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with: {egress-policy: audit}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version-file: .node-version}
      # Reuse approved artifact actions for a cross-run binary cache; only dev writes it.
      - name: Find trusted tool cache
        id: cache
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_KEY: cargo-security-${{ runner.os }}-${{ runner.arch }}-deny-${{ env.CARGO_DENY_VERSION }}-audit-${{ env.CARGO_AUDIT_VERSION }}
        run: |
          echo "TOOL_ROOT=${RUNNER_TEMP}/cargo-security-tools" >> "$GITHUB_ENV"
          echo "key=${CACHE_KEY}" >> "$GITHUB_OUTPUT"
          curl --fail --silent --show-error --get \
            -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            --data-urlencode "name=${CACHE_KEY}" --data-urlencode 'per_page=100' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts" > "${RUNNER_TEMP}/tool-cache.json"
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const { artifacts } = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/tool-cache.json`, 'utf8'));
          const cached = artifacts.find(a => !a.expired && a.workflow_run?.head_branch === 'dev' && a.workflow_run.head_repository_id === a.workflow_run.repository_id);
          if (cached) appendFileSync(process.env.GITHUB_OUTPUT, `run-id=${cached.workflow_run.id}\n`);
          JS
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: steps.cache.outputs.run-id != ''
        with:
          name: ${{ steps.cache.outputs.key }}
          run-id: ${{ steps.cache.outputs.run-id }}
          github-token: ${{ github.token }}
          path: ${{ env.TOOL_ROOT }}/bin
      - name: Install pinned tools on cache miss
        if: steps.cache.outputs.run-id == ''
        run: |
          cargo install cargo-deny --locked --version "${CARGO_DENY_VERSION}" --root "$TOOL_ROOT"
          cargo install cargo-audit --locked --version "${CARGO_AUDIT_VERSION}" --root "$TOOL_ROOT"
      - name: Restore executable permissions
        run: chmod +x "$TOOL_ROOT/bin/cargo-deny" "$TOOL_ROOT/bin/cargo-audit"
      - name: Prove licence and advisory refusals
        run: node --test scripts/supply-chain-fixtures.test.mjs
      - name: cargo-deny
        run: '"$TOOL_ROOT/bin/cargo-deny" --manifest-path backend/Cargo.toml --locked check'
      - name: cargo-audit
        if: ${{ !cancelled() }}
        working-directory: backend
        run: '"$TOOL_ROOT/bin/cargo-audit" audit'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && steps.cache.outputs.run-id == ''
        with:
          name: ${{ steps.cache.outputs.key }}
          path: ${{ env.TOOL_ROOT }}/bin/cargo-*
          retention-days: 90
          if-no-files-found: error

  ci-ok:
    if: ${{ always() }}
    needs: [commits, web, states-plan, states, states-timings, backend, backend-tests, supply-chain]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every CI job
        run: |
          test "${{ needs.commits.result }}" = success
          test "${{ needs.web.result }}" = success
          test "${{ needs['states-plan'].result }}" = success
          test "${{ needs.states.result }}" = success
          test "${{ needs['states-timings'].result }}" = success || test "${{ needs['states-timings'].result }}" = skipped
          test "${{ needs.backend.result }}" = success
          test "${{ needs.backend-tests.result }}" = success
          test "${{ needs.supply-chain.result }}" = success
