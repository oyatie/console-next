# SPDX-License-Identifier: LicenseRef-Proprietary
name: route-load
on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: route-load-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
      SQLX_OFFLINE: "true"
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with: {egress-policy: audit}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version-file: .node-version, cache: npm}
      - run: npm ci --no-audit --no-fund
      - name: Build the full E2E backend once
        working-directory: backend
        run: cargo build --release --locked -p console-app --features full,e2e-test-support
      - name: Build the served web client once
        run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-live-runtime
          path: |
            backend/target/release/console-app
            apps/web/dist
          retention-days: 1
          if-no-files-found: error

  route-load:
    needs: [build]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 210
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.4@sha256:65f70a152846cf504dff86e807007e9aeac98c3aeb7b62541b2c55ab9d264e56
        env:
          POSTGRES_DB: console_dev
          POSTGRES_USER: console_cluster_admin
          POSTGRES_PASSWORD: e2e-${{ github.run_id }}-${{ github.run_attempt }}-route-load
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U console_cluster_admin -d console_dev"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 60
    env:
      CONSOLE_APP_BIN: .cache/e2e-live-runtime/backend/target/release/console-app
      CONSOLE_DEV_PG_PORT: "5432"
      CONSOLE_DEV_PROJECT: route-load-${{ github.run_id }}-route-load
      CONSOLE_WEB_DIST: .cache/e2e-live-runtime/apps/web/dist
      E2E_PREBUILT: "1"
      E2E_SERVED: "1"
      E2E_PERF: "1"
      E2E_WORKERS: "1"
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with: {egress-policy: audit}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version-file: .node-version, cache: npm}
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps --only-shell chromium
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: e2e-live-runtime, path: .cache/e2e-live-runtime}
      - run: chmod +x "$CONSOLE_APP_BIN"
      - name: Cold and warm LCP at the synthetic tenant size, including negative controls
        env:
          CONSOLE_DEV_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          PERF_EVIDENCE_DIR: ${{ runner.temp }}/route-load
        run: npx playwright test e2e/perf/route-load.spec.ts --project=parallel --retries=0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: route-load-evidence
          path: ${{ runner.temp }}/route-load/route-load.json
          if-no-files-found: error
