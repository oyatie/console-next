# SPDX-License-Identifier: LicenseRef-Proprietary
name: Directory first-row diagnosis
on: workflow_dispatch
permissions: {}
jobs:
  measurements:
    name: Measure original Firefox shard three
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions: {actions: read, contents: read}
    services:
      postgres:
        image: postgres:18.4@sha256:65f70a152846cf504dff86e807007e9aeac98c3aeb7b62541b2c55ab9d264e56
        env:
          POSTGRES_DB: console_dev
          POSTGRES_USER: console_cluster_admin
          POSTGRES_PASSWORD: e2e-${{ github.run_id }}-${{ github.run_attempt }}-3
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U console_cluster_admin -d console_dev"
          --health-interval 30s
          --health-timeout 2s
          --health-retries 1
          --health-start-period 60s
          --health-start-interval 1s
    env:
      CARGO_INCREMENTAL: "0"
      SQLX_OFFLINE: "true"
      CONSOLE_APP_BIN: backend/target/release/console-app
      CONSOLE_DEV_PG_PORT: "5432"
      CONSOLE_DEV_PROJECT: directory-diagnosis-${{ github.run_id }}
      CONSOLE_WEB_DIST: apps/web/dist
      E2E_PREBUILT: "1"
      E2E_SERVED: "1"
      E2E_WORKERS: "2"
      E2E_XBROWSER: "1"
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with: {egress-policy: audit}
      - name: Docker healthcheck capabilities
        run: |
          docker version
          docker compose version
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version-file: .node-version, cache: npm}
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps firefox
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-live-runtime
          path: .cache/e2e-live-runtime
          run-id: 46081442011
          github-token: ${{ github.token }}
      - name: Compile candidate with embedded migrations
        working-directory: backend
        run: cargo build --release --locked -p console-app --features full,e2e-test-support
      - name: Build candidate web application
        run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: directory-diagnostic-backend
          path: backend/target/release/console-app
          retention-days: 1
          if-no-files-found: error
      - name: Run original Firefox shard
        env:
          CONSOLE_DEV_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: npx playwright test --project=firefox --test-list=.cache/e2e-live-runtime/.cache/e2e-live-plan/firefox-3.txt --global-timeout=2400000 --retries=0 --reporter=line
