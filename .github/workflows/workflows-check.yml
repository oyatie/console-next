# Checks workflow syntax and the shared CI safety contract.
name: workflows-check
on:
  pull_request:
    paths: [".github/**", "scripts/ci*.mjs", "scripts/ci/**"]
  push:
    branches: [dev]
    paths: [".github/**", "scripts/ci*.mjs", "scripts/ci/**"]
permissions: {}
jobs:
  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443 api.github.com:443 codeload.github.com:443
            release-assets.githubusercontent.com:443 registry.npmjs.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksum-pinned actionlint
        run: bash scripts/ci/install-tools.sh actionlint
      - name: actionlint
        run: actionlint -color
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: CI workflow properties
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test scripts/ci.test.mjs
