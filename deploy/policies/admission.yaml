apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: console-workloads}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods, pods/ephemeralcontainers]
  variables:
    - name: containers
      expression: >-
        object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : []) + (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : [])
  validations:
    - expression: >-
        variables.containers.all(c, c.image.matches('^([^/@]+/)*[^/:@]+(:[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127})?@sha256:[a-f0-9]{64}$'))
      message: 'PLAT_IMAGE_DIGEST: images must use sha256 digests'
    - expression: >-
        has(object.spec.securityContext) && has(object.spec.securityContext.runAsNonRoot) && object.spec.securityContext.runAsNonRoot && variables.containers.all(c, !has(c.securityContext) || ((!has(c.securityContext.runAsNonRoot) || c.securityContext.runAsNonRoot) && (!has(c.securityContext.runAsUser) || c.securityContext.runAsUser != 0)))
      message: 'PLAT_NON_ROOT: workloads must run as non-root'
    - expression: >-
        variables.containers.all(c, has(c.securityContext) && has(c.securityContext.readOnlyRootFilesystem) && c.securityContext.readOnlyRootFilesystem)
      message: 'PLAT_READ_ONLY: containers need a read-only root filesystem'
    - expression: >-
        variables.containers.all(c, has(c.resources) && has(c.resources.requests) && has(c.resources.limits) && ['cpu', 'memory'].all(r, r in c.resources.requests && r in c.resources.limits && quantity(c.resources.requests[r]).isGreaterThan(quantity('0')) && quantity(c.resources.limits[r]).isGreaterThan(quantity('0'))))
      message: 'PLAT_RESOURCES: CPU and memory requests and limits are required'
    - expression: >-
        !has(object.spec.volumes) || object.spec.volumes.all(v, !has(v.hostPath))
      message: 'PLAT_HOST_PATH: hostPath volumes are forbidden'
    - expression: >-
        (!has(object.spec.hostNetwork) || !object.spec.hostNetwork) && (!has(object.spec.hostPID) || !object.spec.hostPID) && (!has(object.spec.hostIPC) || !object.spec.hostIPC)
      message: 'PLAT_HOST_NAMESPACE: host namespaces are forbidden'
    - expression: >-
        variables.containers.all(c, has(c.securityContext) && has(c.securityContext.allowPrivilegeEscalation) && !c.securityContext.allowPrivilegeEscalation && (!has(c.securityContext.privileged) || !c.securityContext.privileged) && has(c.securityContext.capabilities) && has(c.securityContext.capabilities.drop) && 'ALL' in c.securityContext.capabilities.drop && (!has(c.securityContext.capabilities.add) || size(c.securityContext.capabilities.add) == 0))
      message: 'PLAT_PRIVILEGE: containers must drop ALL capabilities and refuse escalation'
    - expression: >-
        has(object.spec.securityContext) && has(object.spec.securityContext.seccompProfile) && object.spec.securityContext.seccompProfile.type == 'RuntimeDefault'
      message: 'PLAT_SECCOMP: RuntimeDefault seccomp is required'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: console-workloads}
spec:
  policyName: console-workloads
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels: {platform.console/enforce: 'true'}
