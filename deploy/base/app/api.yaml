# SPDX-License-Identifier: LicenseRef-Proprietary
# Rollouts reads the Deployment template; its own replica sets serve traffic.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console-api
spec:
  replicas: 0
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: console-api
  template:
    metadata:
      labels:
        app: console-api
        console-workload: app
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          image: console-image
          envFrom:
            - configMapRef:
                name: console-settings
          env:
            - name: CONSOLE_APP_ROLE
              value: api
            - name: DATABASE_URL_FILE
              value: /run/console/DATABASE_URL
            - name: LEAVE_COMMAND_DATABASE_URL_FILE
              value: /run/console/LEAVE_COMMAND_DATABASE_URL
            - name: ONTOLOGY_COMMAND_DATABASE_URL_FILE
              value: /run/console/ONTOLOGY_COMMAND_DATABASE_URL
            - name: PLATFORM_FORCE_COMMAND_DATABASE_URL_FILE
              value: /run/console/PLATFORM_FORCE_COMMAND_DATABASE_URL
            - name: CONSOLE_JWT_PRIVATE_KEY_PEM_FILE
              value: /run/console/CONSOLE_JWT_PRIVATE_KEY_PEM
            - name: CONSOLE_JWT_PUBLIC_KEY_PEM_FILE
              value: /run/console/CONSOLE_JWT_PUBLIC_KEY_PEM
            - name: CONSOLE_COLDSTART_OTP_FILE
              value: /run/console/CONSOLE_COLDSTART_OTP
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          volumeMounts:
            - name: credentials
              mountPath: /run/console
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: credentials
          secret:
            secretName: console-api
            defaultMode: 288
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: console-api
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: console-api
spec:
  replicas: 2
  revisionHistoryLimit: 2
  # The renderer derives progressDeadlineSeconds from probes, analysis and the environment's margin.
  progressDeadlineAbort: true
  selector:
    matchLabels:
      app: console-api
  strategy:
    canary:
      stableService: console-api
      canaryService: console-api-canary
      maxSurge: 1
      maxUnavailable: 0
      steps:
        - setWeight: 25
        - analysis:
            args:
              - name: namespace
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
            templates:
              - templateName: console-ready
        - setWeight: 100
  workloadRef:
    apiVersion: apps/v1
    kind: Deployment
    name: console-api
    scaleDown: onsuccess
