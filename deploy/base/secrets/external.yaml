apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: console-api
  namespace: console
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: console-openbao
  target:
    name: console-api
    template:
      type: Opaque
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: REPLACE_ENVIRONMENT/api
        property: DATABASE_URL
    - secretKey: LEAVE_COMMAND_DATABASE_URL
      remoteRef:
        key: REPLACE_ENVIRONMENT/api
        property: LEAVE_COMMAND_DATABASE_URL
    - secretKey: ONTOLOGY_COMMAND_DATABASE_URL
      remoteRef:
        key: REPLACE_ENVIRONMENT/api
        property: ONTOLOGY_COMMAND_DATABASE_URL
    - secretKey: PLATFORM_FORCE_COMMAND_DATABASE_URL
      remoteRef:
        key: REPLACE_ENVIRONMENT/api
        property: PLATFORM_FORCE_COMMAND_DATABASE_URL
    - secretKey: CONSOLE_JWT_PRIVATE_KEY_PEM
      remoteRef:
        key: REPLACE_ENVIRONMENT/api
        property: CONSOLE_JWT_PRIVATE_KEY_PEM
    - secretKey: CONSOLE_JWT_PUBLIC_KEY_PEM
      remoteRef:
        key: REPLACE_ENVIRONMENT/api
        property: CONSOLE_JWT_PUBLIC_KEY_PEM
    - secretKey: CONSOLE_COLDSTART_OTP
      remoteRef:
        key: REPLACE_ENVIRONMENT/api
        property: CONSOLE_COLDSTART_OTP
---
